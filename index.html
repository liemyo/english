  { id: 'd-r1', type: 'read', title: 'Bacaan: Rutinitas Harian Rina', en: 'Reading: Rina\'s Daily Routine',
    text: [
      "Rina is twenty-eight years old. She lives in Bekasi with her husband and her daughter. She works as an administrator at a construction company in Jakarta.|Rina berumur dua puluh delapan tahun. Ia tinggal di Bekasi bersama suami dan putrinya. Ia bekerja sebagai staf administrasi di sebuah perusahaan konstruksi di Jakarta.",
      "Every day, Rina gets up at five o'clock. She prepares breakfast and takes her daughter to school. Then she takes the train to the office. The trip takes about one hour.|Setiap hari Rina bangun pukul lima. Ia menyiapkan sarapan dan mengantar putrinya ke sekolah. Kemudian ia naik kereta ke kantor. Perjalanannya kira-kira satu jam.",
      "At work, Rina checks emails, prepares documents, and answers the phone. She has lunch with her colleagues at twelve. In the afternoon, she often meets the project team.|Di kantor, Rina memeriksa email, menyiapkan dokumen, dan menjawab telepon. Ia makan siang bersama rekan kerjanya pukul dua belas. Pada sore hari ia sering bertemu tim proyek.",
      "Rina finishes work at five. In the evening, she cooks dinner and helps her daughter with homework. She usually goes to bed at ten.|Rina selesai bekerja pukul lima. Pada malam hari ia memasak makan malam dan membantu putrinya mengerjakan PR. Ia biasanya tidur pukul sepuluh."
    ],
    gloss: ["administrator|staf administrasi", "gets up|bangun tidur", "prepares|menyiapkan", "colleague|rekan kerja", "homework|pekerjaan rumah (PR)", "usually|biasanya"],
    qs: ["Where does Rina work?|At a construction company in Jakarta.|At a school in Bekasi.|At a hospital in Jakarta.", "How does she go to the office?|By train.|By car.|By bus.", "What time does she have lunch?|At twelve.|At five.|At ten.", "What does she do in the evening?|She cooks dinner and helps her daughter.|She meets the project team.|She checks emails."],
    tf: ["Rina lives in Jakarta.|F", "The trip to the office takes about one hour.|T", "Rina answers the phone at work.|T", "She usually goes to bed at eleven.|F"] },
  { id: 'd-r2', type: 'read', title: 'Bacaan: Hari Pertama di Kantor', en: 'Reading: First Day at Work',
    text: [
      "Today is Andi's first day at his new job. He is a junior engineer at a small consulting company. He arrives at the office at a quarter to eight because he does not want to be late.|Hari ini hari pertama Andi di pekerjaan barunya. Ia insinyur junior di sebuah perusahaan konsultan kecil. Ia tiba di kantor pukul delapan kurang seperempat karena tidak ingin terlambat.",
      "The office is on the third floor. There are twelve people in his team. His manager, Mrs. Sari, is friendly and helpful. She shows him his desk, his computer, and the meeting room.|Kantornya berada di lantai tiga. Ada dua belas orang di timnya. Manajernya, Bu Sari, ramah dan suka membantu. Ia menunjukkan meja, komputer, dan ruang rapat kepada Andi.",
      "In the morning, Andi reads the company rules and some project drawings. At lunch, his new colleagues invite him to a small restaurant near the office.|Pada pagi hari Andi membaca peraturan perusahaan dan beberapa gambar proyek. Saat makan siang, rekan-rekan barunya mengajaknya ke restoran kecil di dekat kantor.",
      "In the afternoon, he visits a project site with a senior engineer. He asks many questions and writes notes in his book. It is a long day, but Andi is happy.|Pada sore hari ia mengunjungi lokasi proyek bersama seorang insinyur senior. Ia banyak bertanya dan mencatat di bukunya. Hari itu panjang, tetapi Andi senang."
    ],
    gloss: ["junior engineer|insinyur junior", "consulting company|perusahaan konsultan", "helpful|suka membantu", "drawing|gambar (teknik)", "invite|mengajak / mengundang", "project site|lokasi proyek"],
    qs: ["What is Andi's job?|A junior engineer.|A manager.|A driver.", "Why does he arrive early?|He doesn't want to be late.|He wants to have breakfast.|His manager asks him.", "How many people are in his team?|Twelve.|Three.|Eight.", "What does he do in the afternoon?|He visits a project site.|He reads the company rules.|He goes home."],
    tf: ["The office is on the third floor.|T", "Mrs. Sari is not friendly.|F", "Andi has lunch alone.|F", "Andi writes notes during the site visit.|T"] }
);

  { id: 'u-g7', type: 'grammar', title: 'Countable & Uncountable', en: 'much, many, some, any',
    explain: `<p>Kata benda dibagi dua: <b>countable</b> (dapat dihitung: a bag, two bags) dan <b>uncountable</b> (tidak dapat dihitung secara langsung: water, money, information, cement, equipment, advice). Kata benda uncountable tidak memakai <i>a/an</i> dan tidak diberi akhiran <i>-s</i>.</p><ul><li><b>many / a few</b> + countable jamak: many workers, a few problems.</li><li><b>much / a little</b> + uncountable: much time, a little sugar.</li><li><b>a lot of</b> dapat dipakai untuk keduanya: a lot of trucks, a lot of sand.</li><li><b>some</b> untuk kalimat positif dan tawaran; <b>any</b> untuk kalimat negatif dan pertanyaan.</li><li>Pertanyaan jumlah: <b>How many</b> + countable? <b>How much</b> + uncountable?</li></ul><p class="tip">Untuk menghitung benda uncountable gunakan satuan: a bag of cement, a cubic metre of concrete, a piece of advice.</p>`,
    pattern: ["many / a few / How many + benda jamak", "much / a little / How much + benda uncountable", "some (positif) · any (negatif & tanya)"],
    examples: ["How many workers are on site today?|Berapa pekerja di lokasi hari ini?", "How much cement do we need?|Berapa banyak semen yang kita butuhkan?", "There isn't any water in the tank.|Tidak ada air di tangki.", "We have some time before the meeting.|Kita punya sedikit waktu sebelum rapat.", "I need a little help with this report.|Saya perlu sedikit bantuan untuk laporan ini.", "A few trucks arrived late.|Beberapa truk datang terlambat.", "She gave me some good advice.|Dia memberi saya nasihat yang baik."],
    quiz: ["How ___ bags of cement are there?|many|much|any|Ada berapa sak semen?", "How ___ money do you have?|much|many|lot|Berapa banyak uangmu?", "We don't have ___ sand left.|any|some|many|Kita tidak punya pasir lagi.", "Would you like ___ coffee?|some|any|many|Mau kopi?", "There are only a ___ problems.|few|little|much|Hanya ada sedikit masalah.", "I have a ___ time this afternoon.|little|few|many|Saya punya sedikit waktu sore ini.", "She gave me some useful ___.|information|informations|an information|Dia memberi saya informasi yang berguna.", "There isn't ___ traffic today.|much|many|few|Lalu lintas tidak terlalu padat hari ini."]
  },
  { id: 'u-t6', type: 'topic', cat: 'work', title: 'Wawancara Kerja', en: 'Job Interviews',
    phrases: ["Could you tell me about yourself?|Bisa ceritakan tentang diri Anda?", "I graduated in civil engineering.|Saya lulusan teknik sipil.", "I have five years of experience in…|Saya memiliki pengalaman lima tahun di bidang…", "My main responsibility was…|Tanggung jawab utama saya adalah…", "Why do you want to work here?|Mengapa Anda ingin bekerja di sini?", "What are your strengths?|Apa kelebihan Anda?", "I work well under pressure.|Saya dapat bekerja dengan baik di bawah tekanan.", "One of my weaknesses is…|Salah satu kekurangan saya adalah…", "Where do you see yourself in five years?|Di mana Anda melihat diri Anda lima tahun lagi?", "What is your expected salary?|Berapa gaji yang Anda harapkan?", "When can you start?|Kapan Anda bisa mulai bekerja?", "Do you have any questions for us?|Apakah ada pertanyaan untuk kami?"],
    dialog: ["A|Thank you for coming. Could you tell me about yourself?|Terima kasih sudah datang. Bisa ceritakan tentang diri Anda?", "B|Of course. I graduated in civil engineering in 2019 and have worked as a site engineer since then.|Tentu. Saya lulus teknik sipil tahun 2019 dan sejak itu bekerja sebagai site engineer.", "A|What was your main responsibility?|Apa tanggung jawab utama Anda?", "B|I supervised concrete work and prepared daily reports.|Saya mengawasi pekerjaan beton dan menyusun laporan harian.", "A|Why do you want to join our company?|Mengapa Anda ingin bergabung dengan perusahaan kami?", "B|Your company works on large infrastructure projects, and I want to grow in that area.|Perusahaan Anda menangani proyek infrastruktur besar, dan saya ingin berkembang di bidang itu.", "A|When can you start?|Kapan Anda bisa mulai?", "B|I can start next month.|Saya bisa mulai bulan depan."],
    resp: ["Could you tell me about yourself?|Sure. I'm a site engineer with four years of experience.|Yes, I can tell.|I'm fine, thank you.", "What are your strengths?|I'm well organised and I learn quickly.|My strength is twenty-five.|I'm strong, yes.", "Why should we hire you?|I have the right experience and I'm a reliable team player.|Because I need money.|Yes, you should.", "Do you have any questions for us?|Yes. What does a typical day look like in this role?|No, I don't have any answers.|Yes, I am questions."] },
  { id: 'u-g8', type: 'grammar', title: 'Kata Hubung', en: 'Linking Words: and, but, because, so, although',
    explain: `<p>Kata hubung (<b>conjunction</b>) menggabungkan dua gagasan agar kalimat lebih jelas dan tidak terputus-putus.</p><ul><li><b>and</b> = dan (menambah): The site is clean and safe.</li><li><b>but</b> = tetapi (berlawanan): It is small but comfortable.</li><li><b>because</b> = karena (alasan): We stopped because it rained.</li><li><b>so</b> = sehingga / jadi (akibat): It rained, so we stopped.</li><li><b>although</b> = meskipun: Although it rained, we continued.</li><li><b>or</b> = atau (pilihan): Would you like tea or coffee?</li></ul><p class="tip">Perhatikan arah sebab-akibat: <i>because</i> diikuti sebab, sedangkan <i>so</i> diikuti akibat.</p>`,
    pattern: ["Klausa 1 + because + sebab", "Sebab + , so + akibat", "Although + klausa 1, klausa 2"],
    examples: ["I was late because the traffic was heavy.|Saya terlambat karena lalu lintas padat.", "The traffic was heavy, so I was late.|Lalu lintas padat sehingga saya terlambat.", "Although the budget is small, the quality is good.|Meskipun anggarannya kecil, kualitasnya bagus.", "He is tired but happy.|Dia lelah tetapi senang.", "We can meet on Monday or Tuesday.|Kita bisa bertemu hari Senin atau Selasa.", "The design is simple and practical.|Desainnya sederhana dan praktis.", "It was expensive, so we chose another supplier.|Harganya mahal, jadi kami memilih pemasok lain."],
    quiz: ["I stayed at home ___ I was sick.|because|so|but|Saya di rumah karena sakit.", "It was raining, ___ we cancelled the trip.|so|because|although|Hujan turun, jadi kami membatalkan perjalanan.", "___ he was tired, he finished the report.|Although|Because|So|Meskipun lelah, dia menyelesaikan laporannya.", "The room is small ___ clean.|but|or|so|Kamarnya kecil tetapi bersih.", "Do you want tea ___ coffee?|or|and|but|Kamu mau teh atau kopi?", "She speaks English ___ Japanese.|and|but|so|Dia berbicara bahasa Inggris dan Jepang.", "The truck broke down, ___ the delivery was late.|so|because|or|Truknya mogok sehingga pengiriman terlambat.", "We continued working ___ it was very hot.|although|so|or|Kami terus bekerja meskipun sangat panas."]
  },
  { id: 'u-t7', type: 'topic', cat: 'project', title: 'Rapat Online & Koordinasi Tim', en: 'Online Meetings & Team Coordination',
    phrases: ["Can everyone hear me?|Apakah semua bisa mendengar saya?", "You're on mute.|Mikrofon Anda masih dimatikan.", "Could you share your screen?|Bisa bagikan layar Anda?", "Sorry, you're breaking up.|Maaf, suara Anda putus-putus.", "Let me share the latest schedule.|Saya bagikan jadwal terbaru.", "Who is responsible for this task?|Siapa penanggung jawab tugas ini?", "Can we set a deadline for that?|Bisakah kita tetapkan tenggatnya?", "I'll follow up by email.|Saya akan menindaklanjuti lewat email.", "Let's summarise the action items.|Mari kita rangkum daftar tindakan.", "Is there anything else?|Ada hal lain?", "I have to drop off now.|Saya harus keluar dari rapat sekarang.", "Thanks, everyone. Have a good day.|Terima kasih semuanya. Selamat bekerja."],
    dialog: ["A|Good afternoon. Can everyone hear me?|Selamat siang. Apakah semua bisa mendengar saya?", "B|Yes, loud and clear.|Ya, jelas sekali.", "A|Great. Dian, could you share your screen?|Baik. Dian, bisa bagikan layarmu?", "C|Sure. This is the updated schedule. Piling is two days behind.|Tentu. Ini jadwal terbaru. Pekerjaan tiang pancang terlambat dua hari.", "A|Who is responsible for catching up?|Siapa yang bertanggung jawab mengejar keterlambatan?", "B|I am. We'll add a second shift from Monday.|Saya. Kami akan menambah shift kedua mulai Senin.", "A|Good. Let's summarise the action items, and I'll follow up by email.|Baik. Mari rangkum daftar tindakan, dan saya akan menindaklanjuti lewat email."],
    resp: ["You're on mute.|Sorry, can you hear me now?|Yes, I'm mute.|I'm on the screen.", "Could you share your screen?|Sure, one moment.|My screen is big.|No, it's my screen.", "Who is responsible for the drawings?|Rudi is. He'll send them by Friday.|The drawings are responsible.|Yes, it is.", "Is there anything else?|No, I think we've covered everything.|Yes, everything is else.|I'm on mute."] },
  { id: 'u-g9', type: 'grammar', title: 'Used to (Kebiasaan Masa Lalu)', en: 'used to & would',
    explain: `<p><b>Used to</b> + kata kerja dasar menyatakan kebiasaan atau keadaan di masa lalu yang <b>sekarang sudah tidak berlaku</b>.</p><ul><li>I used to live in Medan. (dulu tinggal di Medan, sekarang tidak)</li><li>Negatif: <b>didn't use to</b>: She didn't use to drink coffee.</li><li>Pertanyaan: <b>Did</b> + subjek + <b>use to</b>? Did you use to work there?</li></ul><p><b>Would</b> juga dapat menyatakan kebiasaan berulang di masa lalu, tetapi tidak untuk keadaan: <i>Every summer we would visit our grandparents.</i></p><p class="tip">Bedakan dengan <b>be used to + -ing</b> (sudah terbiasa): I am used to working at night.</p>`,
    pattern: ["Subjek + used to + kata kerja dasar", "Subjek + didn't use to + kata kerja dasar", "be used to + kata kerja-ing (terbiasa)"],
    examples: ["I used to work in Surabaya.|Dulu saya bekerja di Surabaya.", "This area used to be a rice field.|Daerah ini dulunya sawah.", "He didn't use to like vegetables.|Dulu dia tidak suka sayur.", "Did you use to play football?|Apakah dulu kamu bermain sepak bola?", "We would go fishing every Sunday.|Dulu kami biasa memancing setiap Minggu.", "I'm used to waking up early.|Saya sudah terbiasa bangun pagi.", "There used to be a bridge here.|Dulu ada jembatan di sini."],
    quiz: ["I ___ smoke, but I stopped last year.|used to|use to|was used|Dulu saya merokok, tetapi berhenti tahun lalu.", "Did you ___ live here?|use to|used to|using to|Dulu kamu tinggal di sini?", "She didn't ___ like coffee.|use to|used to|uses to|Dulu dia tidak suka kopi.", "This building ___ be a hotel.|used to|is used to|use|Gedung ini dulunya hotel.", "I'm used to ___ in the heat.|working|work|worked|Saya sudah terbiasa bekerja di cuaca panas.", "There ___ be a market on this street.|used to|use to|was used to|Dulu ada pasar di jalan ini.", "As children, we ___ swim in the river every day.|would|will|are|Saat kecil kami biasa berenang di sungai setiap hari.", "He ___ to driving on the left now.|is used|used|uses|Sekarang dia sudah terbiasa menyetir di sebelah kiri."]
  },
  { id: 'u-t8', type: 'topic', cat: 'daily', title: 'Di Bank & Layanan Umum', en: 'At the Bank & Public Services',
    phrases: ["I'd like to open an account.|Saya ingin membuka rekening.", "What documents do I need?|Dokumen apa yang saya perlukan?", "Please fill in this form.|Silakan isi formulir ini.", "Could I see your ID card?|Boleh saya lihat KTP Anda?", "I'd like to transfer some money.|Saya ingin mentransfer uang.", "What is the exchange rate today?|Berapa kurs hari ini?", "Is there a fee for this?|Apakah ada biaya untuk ini?", "Please take a number and wait.|Silakan ambil nomor antrean dan tunggu.", "Where do I sign?|Di mana saya tanda tangan?", "My card was blocked.|Kartu saya terblokir.", "How long does it take?|Berapa lama prosesnya?", "Could you explain that again?|Bisa dijelaskan sekali lagi?"],
    dialog: ["A|Good morning. How can I help you?|Selamat pagi. Ada yang bisa dibantu?", "B|I'd like to open a savings account.|Saya ingin membuka rekening tabungan.", "A|Certainly. Could I see your ID card and tax number?|Tentu. Boleh saya lihat KTP dan NPWP Anda?", "B|Here they are. Is there a monthly fee?|Ini. Apakah ada biaya bulanan?", "A|Yes, it's ten thousand rupiah a month. Please fill in this form.|Ya, sepuluh ribu rupiah per bulan. Silakan isi formulir ini.", "B|Where do I sign?|Di mana saya tanda tangan?", "A|Here, at the bottom of the page. Your card will be ready in fifteen minutes.|Di sini, di bagian bawah halaman. Kartu Anda siap dalam lima belas menit."],
    resp: ["How can I help you?|I'd like to transfer money to another bank.|I'm helping you.|Yes, I can.", "Could I see your ID card?|Of course. Here it is.|Yes, I see it.|It's a nice card.", "Please fill in this form.|Sure. Do you have a pen?|I'm full, thank you.|No, it's a form.", "Is there a fee for this service?|Yes, it's five thousand rupiah.|Yes, I'm free.|No, it's a service."] },
  { id: 'u-r1', type: 'read', title: 'Bacaan: Perjalanan Dinas', en: 'Reading: A Business Trip',
    text: [
      "Last month, Dewi went on a three-day business trip to Singapore. Her company wanted to buy new formwork systems, and she had to visit two suppliers and compare their products.|Bulan lalu Dewi melakukan perjalanan dinas tiga hari ke Singapura. Perusahaannya ingin membeli sistem bekisting baru, dan ia harus mengunjungi dua pemasok serta membandingkan produk mereka.",
      "On the first day, her flight was delayed for two hours because of bad weather. She arrived at the hotel late at night, but she still prepared her notes for the next meeting.|Pada hari pertama penerbangannya tertunda dua jam karena cuaca buruk. Ia tiba di hotel larut malam, tetapi tetap menyiapkan catatan untuk pertemuan berikutnya.",
      "The first supplier offered a lower price, but the delivery time was eight weeks. The second supplier was more expensive, although it could deliver in three weeks and provide training for the workers.|Pemasok pertama menawarkan harga lebih rendah, tetapi waktu pengirimannya delapan minggu. Pemasok kedua lebih mahal, meskipun dapat mengirim dalam tiga minggu dan memberikan pelatihan bagi para pekerja.",
      "After she returned, Dewi wrote a short report. She recommended the second supplier because the project schedule was tight and a delay would cost more than the price difference.|Setelah kembali, Dewi menulis laporan singkat. Ia merekomendasikan pemasok kedua karena jadwal proyek padat dan keterlambatan akan merugikan lebih besar daripada selisih harga."
    ],
    gloss: ["business trip|perjalanan dinas", "supplier|pemasok", "formwork|bekisting", "delayed|tertunda", "delivery time|waktu pengiriman", "tight schedule|jadwal yang padat"],
    qs: ["Why did Dewi go to Singapore?|To visit suppliers and compare formwork systems.|To attend a training course.|To have a holiday.", "Why was her flight delayed?|Because of bad weather.|Because she was late.|Because of a strike.", "What was the advantage of the second supplier?|Faster delivery and training for workers.|A lower price.|A longer delivery time.", "Which supplier did she recommend?|The second supplier.|The first supplier.|Neither of them."],
    tf: ["The trip lasted three days.|T", "The first supplier was more expensive.|F", "The second supplier could deliver in three weeks.|T", "Dewi did not write a report.|F"] },
  { id: 'u-r2', type: 'read', title: 'Bacaan: Bekerja dari Rumah', en: 'Reading: Working From Home',
    text: [
      "Many companies now allow their staff to work from home for part of the week. For office workers such as designers, estimators, and administrators, this can save a lot of time and money on travel.|Banyak perusahaan kini mengizinkan stafnya bekerja dari rumah pada sebagian hari dalam seminggu. Bagi pekerja kantor seperti desainer, estimator, dan staf administrasi, hal ini dapat menghemat banyak waktu dan biaya perjalanan.",
      "However, working from home is not always easy. Some people find it difficult to concentrate because of noise or family activities. Others feel lonely because they do not see their colleagues every day.|Namun, bekerja dari rumah tidak selalu mudah. Sebagian orang sulit berkonsentrasi karena kebisingan atau kegiatan keluarga. Sebagian lain merasa kesepian karena tidak bertemu rekan kerja setiap hari.",
      "Good communication is the key. Teams that hold short online meetings every morning and use shared folders usually work more effectively than teams that only communicate by email.|Komunikasi yang baik adalah kuncinya. Tim yang mengadakan rapat online singkat setiap pagi dan menggunakan folder bersama biasanya bekerja lebih efektif daripada tim yang hanya berkomunikasi lewat email.",
      "Of course, not every job can be done at home. Site engineers, supervisors, and workers still need to be on site to check the quality of the work and to keep everyone safe.|Tentu tidak semua pekerjaan dapat dilakukan dari rumah. Site engineer, pengawas, dan pekerja tetap harus berada di lokasi untuk memeriksa mutu pekerjaan dan menjaga keselamatan semua orang."
    ],
    gloss: ["allow|mengizinkan", "staff|staf / karyawan", "concentrate|berkonsentrasi", "lonely|kesepian", "effectively|secara efektif", "on site|di lokasi proyek"],
    qs: ["What is one benefit of working from home?|It saves time and money on travel.|It makes people lonely.|It improves site safety.", "Why do some people find it hard to concentrate?|Because of noise or family activities.|Because the internet is too fast.|Because they have too many meetings.", "Which teams usually work more effectively?|Teams with short daily online meetings and shared folders.|Teams that only use email.|Teams that never meet.", "Who still needs to be on site?|Site engineers, supervisors, and workers.|Designers and estimators.|Administrators."],
    tf: ["All companies require staff to work in the office every day.|F", "Some people feel lonely when they work from home.|T", "Email alone is the best way for remote teams to communicate.|F", "Site engineers can do all their work from home.|F"] }
);

  { id: 'f-v6', type: 'vocab', title: 'Bahasa Surat & Email Formal', en: 'Formal Letters & Emails', words: [

  { id: 'f-g7', type: 'grammar', title: 'Modal Perfect', en: 'should have, could have, must have, might have',
    explain: `<p><b>Modal + have + past participle</b> dipakai untuk membicarakan <b>masa lalu</b>: penyesalan, kritik, kemungkinan, dan kesimpulan.</p><ul><li><b>should have</b> = seharusnya (tetapi tidak dilakukan): We should have checked the soil.</li><li><b>shouldn't have</b> = seharusnya tidak: You shouldn't have signed it.</li><li><b>could have</b> = bisa saja (kesempatan yang tidak dipakai): We could have finished earlier.</li><li><b>must have</b> = pasti (kesimpulan logis): The pipe must have burst.</li><li><b>might / may have</b> = mungkin: The truck might have taken another route.</li><li><b>can't have</b> = tidak mungkin: He can't have seen the drawing.</li></ul><p class="tip">Dalam percakapan, <i>should have</i> sering terdengar seperti “should’ve”. Jangan menulis “should of”.</p>`,
    pattern: ["should / could / must / might + have + V3", "shouldn't / can't + have + V3"],
    examples: ["We should have ordered the steel earlier.|Seharusnya kita memesan baja lebih awal.", "The concrete must have set too quickly.|Betonnya pasti mengeras terlalu cepat.", "He might have missed the email.|Dia mungkin tidak membaca email itu.", "They could have avoided the accident.|Mereka sebenarnya bisa menghindari kecelakaan itu.", "You shouldn't have removed the formwork so soon.|Seharusnya kamu tidak membongkar bekisting secepat itu.", "She can't have finished already.|Tidak mungkin dia sudah selesai.", "The crack may have been caused by settlement.|Retakan itu mungkin disebabkan oleh penurunan tanah."],
    quiz: ["We ___ checked the levels before pouring.|should have|should|must|Seharusnya kita mengecek elevasi sebelum pengecoran.", "The road is wet. It ___ rained last night.|must have|should have|can't have|Jalannya basah. Pasti tadi malam hujan.", "He ___ seen the message; his phone was off.|can't have|must have|should have|Tidak mungkin dia melihat pesannya; ponselnya mati.", "You ___ told me earlier. I could have helped.|should have|must have|can have|Seharusnya kamu memberi tahu saya lebih awal.", "The delivery ___ been delayed by traffic.|might have|must|should|Pengirimannya mungkin tertunda karena macet.", "We ___ finished on time if it hadn't rained.|could have|must have|can't have|Kita bisa saja selesai tepat waktu kalau tidak hujan.", "You shouldn't have ___ the safety barrier.|removed|remove|removing|Seharusnya kamu tidak memindahkan pembatas pengaman.", "She must have ___ the wrong drawing.|used|use|using|Dia pasti memakai gambar yang salah."]
  },
  { id: 'f-t6', type: 'topic', cat: 'work', title: 'Diskusi & Menyampaikan Pendapat', en: 'Discussions & Expressing Opinions',
    phrases: ["In my opinion,…|Menurut pendapat saya,…", "From my point of view,…|Dari sudut pandang saya,…", "I tend to think that…|Saya cenderung berpikir bahwa…", "I couldn't agree more.|Saya sangat setuju.", "That's a fair point, but…|Itu poin yang masuk akal, tetapi…", "I'm not entirely convinced.|Saya belum sepenuhnya yakin.", "With respect, I see it differently.|Dengan hormat, saya melihatnya berbeda.", "Could I come in here?|Boleh saya menyela sebentar?", "Let me finish my point.|Izinkan saya menyelesaikan pendapat saya.", "What's the evidence for that?|Apa buktinya?", "Let's look at it from another angle.|Mari kita lihat dari sudut lain.", "So, to sum up,…|Jadi, sebagai kesimpulan,…"],
    dialog: ["A|I tend to think we should switch to precast panels.|Saya cenderung berpikir kita sebaiknya beralih ke panel pracetak.", "B|That's a fair point, but the crane costs will go up.|Itu poin yang masuk akal, tetapi biaya crane akan naik.", "A|True, although we would save at least three weeks.|Benar, meskipun kita akan menghemat setidaknya tiga minggu.", "C|Could I come in here? What's the evidence for three weeks?|Boleh saya menyela? Apa dasar perhitungan tiga minggu itu?", "A|It's based on the last two projects. I'll share the data.|Berdasarkan dua proyek terakhir. Saya akan bagikan datanya.", "B|I'm not entirely convinced, but I'm open to it if the numbers work.|Saya belum sepenuhnya yakin, tetapi saya terbuka jika angkanya masuk.", "A|So, to sum up, we'll compare both options with real costs by Friday.|Jadi, kesimpulannya, kita bandingkan kedua opsi dengan biaya riil paling lambat Jumat."],
    resp: ["I think we should cancel the contract.|With respect, I see it differently. The penalty would be too high.|Yes, I think so too, thank you.|I'm cancelling now.", "What's your view on the new design?|From my point of view, it's practical but slightly over budget.|My view is very nice.|I can see the design.", "Could I come in here?|Of course, go ahead.|Yes, come in the room.|No, I'm here.", "So, do we all agree?|Broadly, yes, but we still need to confirm the budget.|Agree is good.|Yes, we are all."] },
  { id: 'f-g8', type: 'grammar', title: 'Wish & If Only', en: 'Wishes & Regrets',
    explain: `<p><b>Wish</b> dan <b>if only</b> menyatakan keinginan yang berlawanan dengan kenyataan. Bentuk kata kerjanya mundur satu langkah ke masa lalu.</p><ul><li>Keinginan tentang <b>sekarang</b>: wish + past simple. I wish I had more time. (kenyataannya waktunya sedikit)</li><li>Penyesalan tentang <b>masa lalu</b>: wish + past perfect. I wish I had studied harder.</li><li>Keluhan atau harapan agar orang lain berubah: wish + would. I wish the noise would stop.</li><li>Untuk <i>to be</i>, bentuk formal memakai <b>were</b> untuk semua subjek: I wish I were taller.</li></ul><p><b>If only</b> bermakna sama tetapi lebih kuat: <i>If only we had known earlier.</i></p>`,
    pattern: ["wish + past simple (sekarang)", "wish + had + V3 (masa lalu)", "wish + would + V1 (keluhan)"],
    examples: ["I wish I spoke English fluently.|Saya berharap bisa berbahasa Inggris dengan lancar.", "I wish we had checked the drawings.|Andai kita memeriksa gambar-gambarnya.", "She wishes she lived closer to the office.|Dia berharap tinggal lebih dekat dengan kantor.", "If only the rain would stop.|Andai hujannya berhenti.", "I wish I were on holiday now.|Andai saya sedang berlibur sekarang.", "If only we had ordered more cement.|Seandainya kita memesan lebih banyak semen.", "He wishes he hadn't signed the contract.|Dia menyesal telah menandatangani kontrak itu."],
    quiz: ["I wish I ___ more time to finish.|had|have|will have|Saya berharap punya lebih banyak waktu untuk menyelesaikannya.", "I wish I ___ harder at university.|had studied|studied|study|Andai dulu saya belajar lebih giat di kampus.", "If only the traffic ___ move.|would|will|can|Andai lalu lintasnya mau bergerak.", "I wish I ___ taller.|were|am|be|Andai saya lebih tinggi.", "She wishes she ___ that mistake.|hadn't made|didn't make|doesn't make|Dia menyesal telah membuat kesalahan itu.", "If only we ___ about the problem earlier.|had known|knew|know|Seandainya kita tahu masalah itu lebih awal.", "I wish you ___ stop interrupting me.|would|will|are|Saya harap kamu berhenti memotong pembicaraan saya.", "They wish they ___ closer to the site.|lived|live|are living|Mereka berharap tinggal lebih dekat ke lokasi proyek."]
  },
  { id: 'f-t7', type: 'topic', cat: 'project', title: 'Menangani Keluhan Klien', en: 'Handling Client Complaints',
    phrases: ["I understand your frustration.|Saya memahami kekecewaan Anda.", "Thank you for bringing this to our attention.|Terima kasih telah menyampaikan hal ini kepada kami.", "Let me look into it right away.|Saya akan segera memeriksanya.", "I'm sorry for the trouble this has caused.|Saya mohon maaf atas masalah yang ditimbulkan.", "Could you give me more details?|Bisa berikan rincian lebih lanjut?", "Here's what we can do.|Ini yang dapat kami lakukan.", "We'll have it fixed by Thursday.|Kami akan memperbaikinya paling lambat Kamis.", "I'll keep you updated.|Saya akan terus memberi kabar.", "That's outside the scope of the contract.|Itu di luar lingkup kontrak.", "We can offer a goodwill gesture.|Kami dapat memberikan kompensasi sebagai itikad baik.", "Does that solution work for you?|Apakah solusi itu sesuai untuk Anda?", "We value your business.|Kami menghargai kerja sama Anda."],
    dialog: ["A|The ceiling in the lobby is leaking again. This is the second time this month.|Plafon di lobi bocor lagi. Ini sudah kedua kalinya bulan ini.", "B|I'm sorry for the trouble this has caused. Could you give me more details?|Saya mohon maaf atas masalahnya. Bisa berikan rincian lebih lanjut?", "A|Water drips near the main entrance whenever it rains heavily.|Air menetes di dekat pintu masuk utama setiap kali hujan deras.", "B|Thank you. Let me look into it right away. I'll send our team this afternoon.|Terima kasih. Saya akan segera memeriksanya. Tim kami akan datang sore ini.", "A|I need a permanent solution, not another temporary repair.|Saya perlu solusi permanen, bukan perbaikan sementara lagi.", "B|Understood. We'll inspect the roof waterproofing and propose a full repair by Thursday.|Dimengerti. Kami akan memeriksa lapisan kedap air atap dan mengajukan perbaikan menyeluruh paling lambat Kamis.", "A|All right. Please keep me updated.|Baik. Tolong terus beri kabar."],
    resp: ["This is the third time I've complained!|I completely understand your frustration. Let me deal with it personally.|Yes, three is a good number.|Please complain again later.", "When will it be fixed?|We'll have it fixed by Friday at the latest.|It was fixed by nobody.|Yes, it's fixed.", "Who is going to pay for this?|As it's a defect in our work, we'll cover the cost.|You are going to pay.|I'm paying attention.", "Does that solution work for you?|Yes, that sounds reasonable. Thank you.|No, it doesn't work, it's broken.|Yes, I work."] },
  { id: 'f-g9', type: 'grammar', title: 'Inversi & Kalimat Penekanan', en: 'Inversion & Cleft Sentences',
    explain: `<p>Dalam tulisan formal dan presentasi, penekanan dapat dibuat dengan <b>inversi</b>: kata keterangan negatif diletakkan di depan, lalu urutan subjek dan kata kerja bantu dibalik.</p><ul><li><b>Never</b> have we seen such good results.</li><li><b>Not only</b> did the contractor finish early, <b>but</b> they also saved costs.</li><li><b>Under no circumstances</b> should the barrier be removed.</li><li><b>Only after</b> the test was the slab approved.</li></ul><p><b>Cleft sentence</b> menonjolkan satu bagian kalimat:</p><ul><li><b>It was</b> the drainage <b>that</b> caused the problem.</li><li><b>What</b> we need <b>is</b> a clear schedule.</li></ul><p class="tip">Inversi terdengar sangat formal. Gunakan secukupnya dalam laporan dan presentasi, jarang dalam percakapan santai.</p>`,
    pattern: ["Never / Rarely / Seldom + kata kerja bantu + subjek + V", "Not only + kata kerja bantu + subjek + V, but … also …", "It is/was + bagian yang ditekankan + that …", "What + subjek + kata kerja + is/was …"],
    examples: ["Never have I seen such a well-organised site.|Belum pernah saya melihat lokasi proyek serapi ini.", "Not only was the design late, but it was also incomplete.|Desainnya bukan hanya terlambat, tetapi juga tidak lengkap.", "Under no circumstances should you enter without a helmet.|Dalam keadaan apa pun Anda tidak boleh masuk tanpa helm.", "Only then did we realise the mistake.|Baru saat itulah kami menyadari kesalahannya.", "It was the foreman who reported the crack.|Mandorlah yang melaporkan retakan itu.", "What we need is more skilled workers.|Yang kita butuhkan adalah lebih banyak pekerja terampil.", "Rarely do we receive complaints from this client.|Jarang sekali kami menerima keluhan dari klien ini."],
    quiz: ["Never ___ such heavy rain.|have I seen|I have seen|I saw|Belum pernah saya melihat hujan selebat itu.", "Not only ___ the project on time, but it was also under budget.|was|it was|did|Proyek bukan hanya tepat waktu, tetapi juga di bawah anggaran.", "Under no circumstances ___ the valve be opened.|should|you should|must you to|Dalam keadaan apa pun katup tidak boleh dibuka.", "Only after the inspection ___ the work continue.|could|it could|can it|Hanya setelah inspeksi pekerjaan dapat dilanjutkan.", "It ___ the supplier that made the mistake.|was|did|had|Pemasoklah yang membuat kesalahan.", "___ we need is a better plan.|What|That|Which|Yang kita butuhkan adalah rencana yang lebih baik.", "Rarely ___ such a complex structure.|do we build|we build|we do build|Jarang sekali kami membangun struktur serumit itu.", "Seldom ___ he arrive late.|does|he does|is|Ia jarang sekali datang terlambat."]
  },
  { id: 'f-t8', type: 'topic', cat: 'daily', title: 'Networking & Acara Profesional', en: 'Networking & Professional Events',
    phrases: ["Is this seat taken?|Apakah kursi ini kosong?", "What brings you to this conference?|Apa yang membawa Anda ke konferensi ini?", "What line of work are you in?|Anda bergerak di bidang apa?", "I'm involved in infrastructure projects.|Saya terlibat di proyek-proyek infrastruktur.", "That sounds fascinating.|Kedengarannya menarik sekali.", "How long have you been with the company?|Sudah berapa lama Anda di perusahaan itu?", "We've got a lot in common.|Kita punya banyak kesamaan.", "Here's my card.|Ini kartu nama saya.", "Let's keep in touch.|Mari tetap berhubungan.", "It was a pleasure talking to you.|Senang berbincang dengan Anda.", "Would you mind if I connected with you online?|Apakah Anda keberatan jika saya terhubung dengan Anda secara daring?", "I'll drop you an email next week.|Saya akan mengirimi Anda email minggu depan."],
    dialog: ["A|Excuse me, is this seat taken?|Permisi, apakah kursi ini kosong?", "B|No, please go ahead. What brings you to this conference?|Tidak, silakan. Apa yang membawa Anda ke konferensi ini?", "A|I'm a structural engineer, so the session on bridge design caught my eye.|Saya insinyur struktur, jadi sesi tentang desain jembatan menarik perhatian saya.", "B|What a coincidence. We're bidding on a bridge project in Kalimantan.|Kebetulan sekali. Kami sedang ikut tender proyek jembatan di Kalimantan.", "A|That sounds fascinating. Which type of bridge is it?|Kedengarannya menarik. Jembatan jenis apa?", "B|A steel truss bridge, about one hundred and twenty metres long. Here's my card.|Jembatan rangka baja, panjangnya sekitar seratus dua puluh meter. Ini kartu nama saya.", "A|Thank you. Let's keep in touch. I'll drop you an email next week.|Terima kasih. Mari tetap berhubungan. Saya akan mengirimi Anda email minggu depan."],
    resp: ["What line of work are you in?|I'm a project manager in the construction sector.|I'm in the line for coffee.|I work on the line.", "It was a pleasure talking to you.|Likewise. Let's keep in touch.|Yes, you talked a lot.|No problem, see you never.", "How long have you been with the company?|For about six years now.|Since tomorrow.|It's a long company.", "Would you mind if I connected with you online?|Not at all. Please do.|Yes, I'm online.|I don't mind the internet."] },
  { id: 'f-r1', type: 'read', title: 'Bacaan: Mengelola Tim Jarak Jauh', en: 'Reading: Managing Remote Teams',
    text: [
      "As projects become more international, engineers increasingly work with colleagues they rarely meet in person. A design office in Jakarta may coordinate with a client in Singapore, a steel fabricator in Batam, and a specialist consultant in Australia.|Seiring proyek yang semakin internasional, para insinyur makin sering bekerja dengan rekan yang jarang mereka temui langsung. Sebuah kantor desain di Jakarta dapat berkoordinasi dengan klien di Singapura, fabrikator baja di Batam, dan konsultan spesialis di Australia.",
      "Managing such teams requires more than good software. Time-zone differences, cultural expectations, and language barriers can easily lead to misunderstandings. A short message that seems efficient to one person may appear rude to another.|Mengelola tim seperti ini memerlukan lebih dari sekadar perangkat lunak yang baik. Perbedaan zona waktu, harapan budaya, dan hambatan bahasa mudah menimbulkan salah paham. Pesan singkat yang dianggap efisien oleh satu orang bisa terkesan kasar bagi orang lain.",
      "Experienced managers therefore establish clear rules from the start: which platform is used for which purpose, how quickly messages should be answered, and who has the authority to approve changes. Decisions are always confirmed in writing.|Karena itu, manajer berpengalaman menetapkan aturan yang jelas sejak awal: platform mana dipakai untuk keperluan apa, seberapa cepat pesan harus dijawab, dan siapa yang berwenang menyetujui perubahan. Setiap keputusan selalu dikonfirmasi secara tertulis.",
      "Not only does this reduce errors, but it also builds trust. When people know what to expect, they are more willing to raise problems early, which is exactly what a project needs.|Hal ini bukan hanya mengurangi kesalahan, tetapi juga membangun kepercayaan. Ketika orang tahu apa yang diharapkan, mereka lebih bersedia menyampaikan masalah sejak dini, dan itulah yang dibutuhkan sebuah proyek."
    ],
    gloss: ["increasingly|semakin", "in person|secara langsung", "fabricator|fabrikator / pembuat komponen", "misunderstanding|salah paham", "establish|menetapkan", "authority|wewenang"],
    qs: ["What is the main idea of the text?|Remote teams need clear rules, not just good software.|Software solves all communication problems.|Engineers should never work internationally.", "Why can a short message cause problems?|It may seem rude to someone from a different culture.|It is always too expensive.|It cannot be translated.", "What do experienced managers decide at the start?|Platforms, response times, and who approves changes.|The salaries of all team members.|The location of every office.", "According to the text, what is a benefit of clear rules?|People raise problems earlier.|Projects need fewer engineers.|Meetings become longer."],
    tf: ["The text says good software is enough to manage remote teams.|F", "Time-zone differences can cause misunderstandings.|T", "Decisions are confirmed only by phone.|F", "Clear rules can help build trust.|T"] },
  { id: 'f-r2', type: 'read', title: 'Bacaan: Kota yang Tangguh', en: 'Reading: Resilient Cities',
    text: [
      "Floods, heatwaves, and land subsidence are no longer rare events in many Asian cities. Planners are therefore shifting from simply building larger drains to designing cities that can absorb and recover from shocks.|Banjir, gelombang panas, dan penurunan muka tanah tidak lagi menjadi peristiwa langka di banyak kota Asia. Karena itu para perencana beralih dari sekadar membangun saluran yang lebih besar ke merancang kota yang mampu menyerap dan pulih dari guncangan.",
      "One approach is the so-called sponge city. Instead of sending all rainwater into concrete channels, the city uses parks, permeable pavements, and retention ponds to store water temporarily and allow it to soak into the ground.|Salah satu pendekatannya adalah apa yang disebut kota spons. Alih-alih mengalirkan seluruh air hujan ke saluran beton, kota memanfaatkan taman, perkerasan berpori, dan kolam retensi untuk menampung air sementara dan membiarkannya meresap ke tanah.",
      "Critics argue that such solutions require large areas of land, which is expensive in dense cities. Supporters reply that the long-term savings from reduced flood damage far outweigh the initial cost.|Para pengkritik berpendapat bahwa solusi semacam itu membutuhkan lahan luas, yang mahal di kota padat. Para pendukung menjawab bahwa penghematan jangka panjang dari berkurangnya kerusakan akibat banjir jauh melebihi biaya awalnya.",
      "In practice, the most successful cities combine both approaches. Engineers upgrade critical drainage infrastructure while gradually adding green spaces wherever land becomes available.|Dalam praktiknya, kota yang paling berhasil menggabungkan kedua pendekatan. Para insinyur meningkatkan infrastruktur drainase yang vital sambil secara bertahap menambah ruang hijau di mana pun lahan tersedia."
    ],
    gloss: ["land subsidence|penurunan muka tanah", "absorb|menyerap", "permeable pavement|perkerasan berpori", "retention pond|kolam retensi", "outweigh|melebihi (manfaatnya)", "gradually|secara bertahap"],
    qs: ["What is a sponge city designed to do?|Store rainwater temporarily and let it soak into the ground.|Send all water quickly into concrete channels.|Build taller buildings.", "What is the main criticism of sponge cities?|They need large, expensive areas of land.|They increase flood damage.|They are too modern.", "What do supporters say?|Long-term savings outweigh the initial cost.|The cost is very low from the start.|Floods are not important.", "What do the most successful cities do?|Combine better drainage with more green spaces.|Use only green spaces.|Stop building drains."],
    tf: ["Floods are now rare in many Asian cities.|F", "Retention ponds are part of the sponge city approach.|T", "Critics say sponge cities are cheap.|F", "The text recommends combining two approaches.|T"] }
);

    { id: 's-g1', type: 'grammar', title: 'Kalimat Pasif dalam Metode Kerja', en: 'Passive Voice in Method Statements',
      explain: `<p>Dokumen teknik seperti <b>method statement</b>, spesifikasi, dan laporan inspeksi lebih banyak memakai <b>kalimat pasif</b>. Fokusnya pada pekerjaan dan hasilnya, bukan pada siapa yang mengerjakan.</p><ul><li>Aktif: The workers pour the concrete. → Pasif: The concrete <b>is poured</b>.</li><li>Langkah kerja: The area <b>shall be cleared</b> before excavation.</li><li>Laporan: The slab <b>was cast</b> on 12 May.</li><li>Sedang berlangsung: The rebar <b>is being installed</b>.</li><li>Sudah selesai: The formwork <b>has been checked</b>.</li></ul><p>Pelaku cukup ditambahkan dengan <b>by</b> bila penting: The test was witnessed <b>by the consultant</b>.</p><p class="tip">Rumus inti: <b>be</b> (sesuai waktu) + <b>past participle</b>. Contoh past participle: poured, cast, placed, laid, cured, tested, approved, installed.</p>`,
      pattern: ["Present: is / are + V3 (prosedur umum)", "Past: was / were + V3 (laporan)", "Perfect: has / have been + V3 (status selesai)", "Modal: shall / must / should be + V3 (ketentuan)"],
      examples: ["The concrete is poured in layers of 30 centimetres.|Beton dicor per lapisan setebal 30 sentimeter.", "The slab was cast on Monday.|Pelat dicor pada hari Senin.", "The excavation has been completed.|Galian telah selesai.", "The rebar is being installed on the second floor.|Besi tulangan sedang dipasang di lantai dua.", "All materials must be approved before use.|Semua material harus disetujui sebelum digunakan.", "The samples were tested at the laboratory.|Benda uji diuji di laboratorium.", "The surface shall be kept wet for seven days.|Permukaan harus dijaga tetap basah selama tujuh hari."],
      quiz: ["The concrete ___ yesterday afternoon.|was poured|poured|is pour|Beton dicor kemarin sore.", "All drawings must ___ by the consultant.|be approved|approved|approve|Semua gambar harus disetujui oleh konsultan.", "The formwork has already ___ removed.|been|be|being|Bekisting sudah dibongkar.", "The pipes ___ installed at the moment.|are being|are been|were be|Pipa-pipa sedang dipasang saat ini.", "Three samples ___ from each truck.|are taken|take|are take|Tiga benda uji diambil dari setiap truk.", "The test was witnessed ___ the consultant.|by|from|with|Pengujian disaksikan oleh konsultan.", "The surface shall be ___ wet for seven days.|kept|keep|keeping|Permukaan harus dijaga tetap basah selama tujuh hari.", "The bridge ___ in 1998.|was built|built|has build|Jembatan itu dibangun pada tahun 1998."]
    },
    { id: 's-t1', type: 'topic', cat: 'site', title: 'Rapat Koordinasi Lapangan', en: 'Site Coordination Meeting',
      phrases: ["Let's go through the look-ahead schedule.|Mari kita bahas jadwal beberapa minggu ke depan.", "What's the status of the pile caps?|Bagaimana status pile cap?", "We're two days behind on the retaining wall.|Pekerjaan dinding penahan tanah terlambat dua hari.", "The concrete pour is scheduled for Thursday.|Pengecoran dijadwalkan hari Kamis.", "Is the formwork ready for inspection?|Apakah bekisting siap diinspeksi?", "We're still waiting for the shop drawings.|Kami masih menunggu shop drawing.", "There's a clash between the duct and the beam.|Ada benturan antara ducting dan balok.", "Can we resequence the work?|Bisakah kita mengubah urutan pekerjaan?", "We need more manpower on night shift.|Kami butuh tambahan tenaga kerja untuk shift malam.", "Who will coordinate with the MEP contractor?|Siapa yang akan berkoordinasi dengan kontraktor MEP?", "Please record that in the minutes.|Tolong catat itu di notulen.", "Let's close out the action items from last week.|Mari tuntaskan daftar tindakan dari minggu lalu."],
      dialog: ["A|Good morning, everyone. Let's go through the look-ahead schedule.|Selamat pagi semua. Mari kita bahas jadwal ke depan.", "B|The pile caps on grid C are complete. Grid D will be poured on Thursday.|Pile cap di as C sudah selesai. As D akan dicor hari Kamis.", "A|Is the formwork on grid D ready for inspection?|Apakah bekisting di as D siap diinspeksi?", "B|Almost. We'll finish the rebar tomorrow morning and request inspection at two.|Hampir. Kami selesaikan pembesian besok pagi dan mengajukan inspeksi pukul dua.", "C|There's one issue. The drainage pipe clashes with the tie beam on grid D.|Ada satu masalah. Pipa drainase berbenturan dengan sloof di as D.", "A|Can the pipe be lowered by 200 millimetres?|Bisakah pipanya diturunkan 200 milimeter?", "C|Yes, but we need the designer to confirm the new slope.|Bisa, tetapi kami perlu konfirmasi kemiringan baru dari perencana.", "A|All right. I'll send an RFI today. Please record that in the minutes.|Baik. Saya kirim RFI hari ini. Tolong catat di notulen."],
      resp: ["What's the status of the excavation?|About eighty percent complete. We should finish on Friday.|The excavation is very deep, thank you.|Yes, it is a status.", "Is the formwork ready for inspection?|Not yet. We need two more hours to fix the props.|Yes, the formwork is a wood.|I'm ready, thanks.", "Why is the retaining wall behind schedule?|Because the rebar delivery was three days late.|Because it's a wall.|It's behind the building.", "Can we pour on Thursday?|Only if the inspection is approved on Wednesday.|Yes, it's pouring rain.|Thursday is a nice day."] },

    { id: 's-g2', type: 'grammar', title: 'Shall, Must & Should dalam Spesifikasi', en: 'Requirements in Specifications',
      explain: `<p>Spesifikasi teknis dan kontrak memakai modal tertentu untuk menunjukkan <b>tingkat kewajiban</b>. Pemilihan kata ini berpengaruh secara hukum, sehingga harus dibaca dengan cermat.</p><ul><li><b>shall</b> = wajib (kewajiban kontraktual). The Contractor <b>shall</b> submit samples.</li><li><b>must</b> = harus (sering untuk persyaratan mutlak dan keselamatan). Helmets <b>must</b> be worn at all times.</li><li><b>should</b> = sebaiknya (rekomendasi, tidak mengikat penuh). Joints <b>should</b> be sealed before rain.</li><li><b>may</b> = boleh (pilihan yang diizinkan). The Engineer <b>may</b> request additional tests.</li><li><b>shall not / must not</b> = dilarang. Concrete <b>shall not</b> be placed in heavy rain.</li></ul><p class="tip">Bedakan <b>shall not</b> (dilarang) dengan <b>need not</b> (tidak wajib). Keduanya sering tertukar dalam penerjemahan.</p>`,
      pattern: ["The Contractor shall + V1 (kewajiban)", "… shall / must be + V3 (persyaratan pasif)", "… should + V1 (rekomendasi)", "… may + V1 (izin / pilihan)"],
      examples: ["The Contractor shall submit a method statement.|Kontraktor wajib menyerahkan metode kerja.", "Concrete shall not be placed during heavy rain.|Beton tidak boleh dicor saat hujan deras.", "Safety helmets must be worn at all times.|Helm keselamatan wajib dipakai setiap saat.", "Formwork should be cleaned before reuse.|Bekisting sebaiknya dibersihkan sebelum dipakai ulang.", "The Engineer may request additional tests.|Direksi teknis dapat meminta pengujian tambahan.", "All welds shall be inspected by a certified inspector.|Semua las wajib diperiksa oleh inspektur bersertifikat.", "Samples need not be tested if a valid certificate is provided.|Sampel tidak wajib diuji jika sertifikat yang berlaku dilampirkan."],
      quiz: ["The Contractor ___ submit shop drawings before fabrication.|shall|may|need not|Kontraktor wajib menyerahkan shop drawing sebelum fabrikasi.", "Concrete ___ be placed in heavy rain.|shall not|should|may|Beton tidak boleh dicor saat hujan deras.", "The Engineer ___ request additional tests if necessary.|may|shall not|must not|Direksi teknis dapat meminta pengujian tambahan bila perlu.", "Helmets ___ be worn at all times on site.|must|may|need not|Helm wajib dipakai setiap saat di lokasi.", "Joints ___ be sealed before the rainy season.|should|shall not|need|Sambungan sebaiknya ditutup sebelum musim hujan.", "All materials shall ___ before delivery.|be approved|approve|approved|Semua material wajib disetujui sebelum dikirim.", "Workers ___ enter the excavation without permission.|must not|need not|may|Pekerja dilarang masuk galian tanpa izin.", "Testing ___ not be repeated if the first result passes.|need|shall be|must be|Pengujian tidak perlu diulang jika hasil pertama lolos."]
    },
    { id: 's-t2', type: 'topic', cat: 'site', title: 'K3: Safety Briefing', en: 'Safety Briefing (Toolbox Talk)',
      phrases: ["Today's toolbox talk is about working at height.|Toolbox talk hari ini tentang bekerja di ketinggian.", "Everyone must wear full PPE.|Semua orang wajib memakai APD lengkap.", "Clip your harness to the lifeline.|Kaitkan full body harness ke tali pengaman.", "Keep the walkways clear.|Jaga jalur jalan tetap bersih.", "Don't stand under a suspended load.|Jangan berdiri di bawah beban yang sedang diangkat.", "Report any near miss immediately.|Laporkan setiap kejadian nyaris celaka segera.", "Where is the assembly point?|Di mana titik kumpul?", "The excavation must be barricaded.|Galian harus diberi pembatas.", "Check the scaffolding tag before use.|Periksa tag perancah sebelum digunakan.", "Stop work if it is unsafe.|Hentikan pekerjaan jika tidak aman.", "Hydrate regularly in this heat.|Minum air secara teratur di cuaca panas ini.", "Any questions before we start?|Ada pertanyaan sebelum kita mulai?"],
      dialog: ["A|Good morning. Today's toolbox talk is about lifting operations.|Selamat pagi. Toolbox talk hari ini tentang pekerjaan pengangkatan.", "A|The crane will lift precast girders this morning. The exclusion zone is marked with red tape.|Crane akan mengangkat gelagar pracetak pagi ini. Area terlarang ditandai pita merah.", "B|Who is the signalman today?|Siapa juru isyarat hari ini?", "A|Pak Joko. Only he gives signals to the operator.|Pak Joko. Hanya dia yang memberi isyarat kepada operator.", "C|What should we do if the wind gets too strong?|Apa yang harus kami lakukan jika angin terlalu kencang?", "A|Stop the lift immediately if wind speed exceeds 30 kilometres per hour.|Hentikan pengangkatan segera jika kecepatan angin melebihi 30 kilometer per jam.", "A|Remember, never stand under a suspended load. Any questions before we start?|Ingat, jangan pernah berdiri di bawah beban yang sedang diangkat. Ada pertanyaan sebelum mulai?"],
      resp: ["Where is your helmet?|Sorry, I left it in the site office. I'll get it now.|It's a red helmet.|I don't need a head.", "What should you do after a near miss?|Report it to the safety officer immediately.|Nothing, it missed.|Go home early.", "Is the scaffolding safe to use?|The green tag shows it was inspected yesterday.|Yes, it's very tall.|The scaffolding is using.", "Where is the assembly point?|Near the main gate, next to the security post.|At nine o'clock.|Yes, we assemble it."] },

    { id: 's-g3', type: 'grammar', title: 'Membaca Angka, Satuan & Dimensi', en: 'Numbers, Units & Dimensions',
      explain: `<p>Dalam pekerjaan teknik, angka harus diucapkan dengan jelas agar tidak terjadi salah ukur.</p><ul><li><b>Desimal</b>: 2.75 m = two point seven five metres. 0.5 = (zero) point five.</li><li><b>Dimensi</b>: 400 × 600 mm = four hundred <b>by</b> six hundred millimetres.</li><li><b>Luas dan volume</b>: m² = square metre(s); m³ = cubic metre(s). 25 m³ = twenty-five cubic metres.</li><li><b>Tegangan</b>: 25 MPa = twenty-five megapascals. <b>Beban</b>: 5 kN = five kilonewtons.</li><li><b>Kemiringan</b>: 1:2 = one in two / one to two; 2% = two percent slope.</li><li><b>Diameter tulangan</b>: D16 = sixteen-millimetre deformed bar; Ø10 = ten-millimetre plain bar.</li><li><b>Elevasi</b>: +3.50 = plus three point five zero; −1.20 = minus one point two zero.</li></ul><p>Dalam tulisan, satuan diletakkan setelah angka dengan spasi (25 mm). Jika angka menjadi kata sifat, gunakan tanda hubung dan bentuk tunggal: a <b>50-tonne</b> crane, a <b>12-metre</b> beam.</p>`,
      pattern: ["angka + by + angka (dimensi)", "angka + square / cubic + satuan jamak", "a + angka-satuan tunggal + benda (a 20-metre span)"],
      examples: ["The column is four hundred by four hundred millimetres.|Kolomnya berukuran empat ratus kali empat ratus milimeter.", "We need thirty-two cubic metres of concrete.|Kita butuh tiga puluh dua meter kubik beton.", "The required strength is twenty-five megapascals.|Kuat tekan yang disyaratkan dua puluh lima megapascal.", "The slab level is plus three point five zero.|Elevasi pelat plus tiga koma lima nol.", "Use sixteen-millimetre bars at two hundred centres.|Gunakan tulangan diameter enam belas milimeter dengan jarak dua ratus.", "It's a twelve-metre beam.|Itu balok dua belas meter.", "The road has a two percent cross slope.|Jalan itu memiliki kemiringan melintang dua persen."],
      quiz: ["400 × 600 mm is four hundred ___ six hundred millimetres.|by|times of|and|400 × 600 mm dibaca four hundred by six hundred.", "25 m³ is twenty-five ___ metres.|cubic|square|cube|25 m³ dibaca twenty-five cubic metres.", "120 m² is one hundred and twenty ___ metres.|square|cubic|squares|120 m² dibaca one hundred and twenty square metres.", "We hired a ___ crane.|50-tonne|50-tonnes|50 tonnes|Kami menyewa crane 50 ton.", "2.75 is two ___ seven five.|point|comma|dot|2,75 dibaca two point seven five.", "The beam is ___ long.|eight metres|eight-metres|eight metre|Baloknya sepanjang delapan meter.", "It's a ___ span.|20-metre|20-metres|20 metres|Itu bentang 20 meter.", "The strength is 30 ___.|megapascals|megapascal's|mega pascals'|Kuat tekannya 30 megapascal."]
    },
    { id: 's-t3', type: 'topic', cat: 'site', title: 'Inspeksi, RFI & Persetujuan Material', en: 'Inspection, RFI & Material Approval',
      phrases: ["We'd like to request an inspection for the rebar.|Kami ingin mengajukan inspeksi pembesian.", "The inspection request was submitted yesterday.|Permohonan inspeksi sudah diajukan kemarin.", "The cover is less than specified.|Selimut betonnya kurang dari yang disyaratkan.", "Please rectify it before we sign off.|Mohon diperbaiki sebelum kami setujui.", "The work is approved with comments.|Pekerjaan disetujui dengan catatan.", "The submission was rejected.|Pengajuannya ditolak.", "We need a material approval for the waterproofing.|Kami perlu persetujuan material untuk lapisan kedap air.", "Please attach the test certificate.|Mohon lampirkan sertifikat uji.", "We've raised an RFI on the beam detail.|Kami sudah mengajukan RFI terkait detail balok.", "The drawing and the specification don't match.|Gambar dan spesifikasi tidak sesuai.", "Can you confirm the correct dimension?|Bisakah Anda konfirmasi dimensi yang benar?", "We'll proceed once we receive your reply.|Kami akan melanjutkan setelah menerima balasan Anda."],
      dialog: ["A|We'd like to request an inspection for the rebar on the third-floor slab.|Kami ingin mengajukan inspeksi pembesian pelat lantai tiga.", "B|All right. I'll come at two o'clock.|Baik. Saya datang pukul dua.", "B|The spacing is fine, but the bottom cover is only 15 millimetres. The drawing says 25.|Jaraknya sudah benar, tetapi selimut bawah hanya 15 milimeter. Di gambar 25.", "A|We'll add more concrete spacers right away.|Kami segera menambah beton decking.", "B|Also, the lap length here is too short. Please rectify it before we sign off.|Selain itu, panjang sambungan lewatan di sini terlalu pendek. Mohon diperbaiki sebelum kami setujui.", "A|Understood. Can you re-inspect at four?|Dimengerti. Bisakah inspeksi ulang pukul empat?", "B|Yes. If everything is corrected, the slab will be approved for pouring tomorrow.|Bisa. Jika semuanya sudah diperbaiki, pelat disetujui untuk dicor besok."],
      resp: ["The cover is less than specified.|We'll add spacers and call you for re-inspection.|The cover is a nice book.|Yes, it's covered.", "Why was the submission rejected?|The test certificate was missing.|Because it was submitted.|It was rejected yes.", "The drawing and the specification don't match. Which one governs?|According to the contract, the specification takes precedence.|Both are very nice.|The drawing is on the table.", "When can we proceed?|As soon as we receive the consultant's reply to the RFI.|We proceeded yesterday tomorrow.|Proceed is a verb."] },

      "cut and fill|galian dan timbunan|The cut and fill volumes are balanced.|Volume galian dan timbunan seimbang.",

    { id: 's-g4', type: 'grammar', title: 'Bahasa Laporan Teknis', en: 'Cause, Effect & Comparison in Reports',
      explain: `<p>Laporan teknis menjelaskan <b>apa yang terjadi</b>, <b>mengapa</b>, dan <b>apa akibatnya</b>, dengan nada objektif. Hindari kata yang emosional; gunakan data.</p><ul><li><b>Sebab</b>: due to / owing to / because of + kata benda. The pour was delayed <b>due to</b> heavy rain.</li><li><b>Akibat</b>: As a result, / Consequently, + kalimat. <b>As a result</b>, the schedule slipped by two days.</li><li><b>Menyebabkan</b>: cause / lead to / result in. Poor compaction <b>resulted in</b> settlement.</li><li><b>Perbandingan</b>: higher than, lower than, the same as, compared with. Actual progress is 3% <b>lower than</b> planned.</li><li><b>Perubahan</b>: increase / decrease / remain stable. Costs <b>increased by</b> 5%.</li></ul><p class="tip">Bedakan <b>by</b> (besar perubahan) dan <b>to</b> (nilai akhir): Progress increased <b>by</b> 4% <b>to</b> 62%.</p>`,

      examples: ["The work was suspended due to heavy rain.|Pekerjaan dihentikan sementara karena hujan deras.", "As a result, the pour was postponed to Friday.|Akibatnya, pengecoran ditunda ke hari Jumat.", "Poor drainage led to the failure of the slope.|Drainase yang buruk menyebabkan kegagalan lereng.", "Actual progress is three percent lower than planned.|Progres aktual tiga persen lebih rendah dari rencana.", "Steel prices increased by eight percent last quarter.|Harga baja naik delapan persen pada kuartal lalu.", "Progress rose by four percent to sixty-two percent.|Progres naik empat persen menjadi enam puluh dua persen.", "Compared with last month, productivity remained stable.|Dibandingkan bulan lalu, produktivitas tetap stabil."],

  if (u.words) u.W = u.words.map(s => { const [en, id, ex, exid] = P(s); const w = { en, id, ex, exid, unit: u.id, level: L.id, k: en.toLowerCase() }; WORDS.push(w); SENTS.push({ en: ex, id: exid, level: L.id }); return w; });
  if (u.examples) { u.EX = u.examples.map(s => { const [en, id] = P(s); return { en, id }; }); for (const e of u.EX) SENTS.push({ ...e, level: L.id }); }
  if (u.quiz) u.Q = u.quiz.map(s => { const [q, a, b, c, tr] = P(s); return { q, a, opts: [a, b, c], tr }; });
  if (u.phrases) { u.PH = u.phrases.map(s => { const [en, id] = P(s); return { en, id }; }); for (const e of u.PH) SENTS.push({ ...e, level: L.id }); }
  if (u.dialog) { u.DL = u.dialog.map(s => { const [sp, en, id] = P(s); return { sp, en, id }; }); for (const e of u.DL) SENTS.push({ en: e.en, id: e.id, level: L.id }); }
  if (u.resp) u.RS = u.resp.map(s => { const [q, a, b, c] = P(s); return { q, a, opts: [a, b, c] }; });
  if (u.text) u.TX = u.text.map(s => { const [en, id] = P(s); return { en, id }; });
  if (u.qs) u.RQ = u.qs.map(s => { const [q, a, b, c] = P(s); return { q, a, opts: [a, b, c] }; });
  if (u.tf) u.TF = u.tf.map(s => { const [q, v] = P(s); return { q, v: v === 'T' }; });
  if (u.gloss) u.GL = u.gloss.map(s => { const [en, id] = P(s); return { en, id }; });
}
const LEVEL = id => COURSE.find(l => l.id === id);
// sentences good for "arrange the words": plain, 3–11 words
const scrOk = e => !/[→"…]/.test(e.en) && e.en.split(' ').length >= 3 && e.en.split(' ').length <= 11;
const unitMeta = u => u.W ? `${u.W.length} kata` : u.Q ? `${u.EX.length} contoh · ${u.Q.length} soal` : u.TX ? `${u.TX.length} paragraf · ${u.RQ.length + u.TF.length} soal` : `${u.PH.length} ungkapan · dialog`;

// ---------- state ----------
const S = {
  user: null, admin: false, pass: '', users: [], pin: '', hasPin: false, gate: null,
  items: new Map(), seq: 0, queue: new Set(), owner: '',
  route: '', lvl: LS.get('lvl') || 'dasar', type: 'all', cat: '', src: LS.get('src') || 'all', run: null, tr: LS.get('tr') === '1',
  sync: { busy: false, again: false, at: null, err: '' }
};
if (!COURSE.some(l => l.id === S.lvl)) S.lvl = 'dasar';
const RO = () => S.admin;
const key = it => it.owner + '/' + it.id;
const cacheKey = () => S.admin ? 'admin' : 'u.' + S.user;
const who = () => S.admin ? S.owner : S.user; // whose progress is shown

function saveCache() {
  LS.set(cacheKey() + '.items', JSON.stringify([...S.items.values()]));
  LS.set(cacheKey() + '.seq', String(S.seq));
  if (!S.admin) LS.set(cacheKey() + '.queue', JSON.stringify([...S.queue]));
}
function loadCache() {
  S.items = new Map(); S.queue = new Set(); S.seq = 0;
  try { for (const it of JSON.parse(LS.get(cacheKey() + '.items') || '[]')) S.items.set(key(it), it); } catch {}
  S.seq = Number(LS.get(cacheKey() + '.seq') || 0);
  if (!S.admin) try { S.queue = new Set(JSON.parse(LS.get(cacheKey() + '.queue') || '[]')); } catch {}
  if (S.admin) try { S.users = JSON.parse(LS.get('admin.users') || '[]'); } catch {}
}

// ---------- progress model ----------
// prog item 'u_<unit>' {best, last, tries, done, at}; meta 'vocab-mem' {m:{word: box 0..5}}; meta 'stats-xp' {xp, days:{ymd: xp}}
const live = (o, id) => { const it = S.items.get(o + '/' + id); return it && !it.deleted ? it : null; };
const prog = (uid, o = who()) => live(o, 'u_' + uid)?.data || null;
const best = (uid, o) => prog(uid, o)?.best || 0;
const mem = (o = who()) => live(o, 'vocab-mem')?.data?.m || {};
const stats = (o = who()) => live(o, 'stats-xp')?.data || { xp: 0, days: {} };
const PASS = 70, MASTER = 3;
function mastered(o, lid) { const m = mem(o); return WORDS.filter(w => (!lid || w.level === lid) && (m[w.k] || 0) >= MASTER).length; }
function levelPct(lid, o = who()) {
  const us = UNITS.filter(u => u.level === lid), ws = WORDS.filter(w => w.level === lid);
  return Math.round(us.reduce((a, u) => a + best(u.id, o), 0) / us.length * 0.8 + mastered(o, lid) / ws.length * 100 * 0.2);
}
function overall(o = who()) { return Math.round(UNITS.reduce((a, u) => a + best(u.id, o), 0) / UNITS.length * 0.8 + mastered(o) / WORDS.length * 100 * 0.2); }
const doneCount = (lid, o = who()) => UNITS.filter(u => (!lid || u.level === lid) && prog(u.id, o)?.done).length;
const RANKS = [[0, 'Pemula'], [10, 'Dasar'], [34, 'Menengah'], [67, 'Mahir'], [90, 'Fasih']];
const rank = p => [...RANKS].reverse().find(r => p >= r[0]);
// a level opens when the previous one reaches 60%, or once the learner has started it (new units must not lock anyone out)
const unlocked = lid => { const i = COURSE.findIndex(l => l.id === lid); return i <= 0 || COURSE[i].free || S.admin || LS.get('unlock') === '1' || levelPct(COURSE[i - 1].id) >= 60 || UNITS.some(u => u.level === lid && prog(u.id)); };
function streak(o = who()) {
  const days = stats(o).days || {}; let n = 0; const d = new Date();
  if (!days[ymd(d)]) d.setDate(d.getDate() - 1);
  while (days[ymd(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function nextUnit() { // first unit not passed yet, in order, in an unlocked level
  for (const L of COURSE) { if (!unlocked(L.id)) break; const u = L.units.find(u => !prog(u.id)?.done); if (u) return u; }
  return null;
}

function put(it, quiet) { // local write → queue → push
  if (RO()) return;
  const prev = S.items.get(key(it));
  it.updated = Math.max(Date.now(), (prev?.updated || 0) + 1);
  S.items.set(key(it), it); S.queue.add(key(it)); saveCache(); if (!quiet) render(); pushSoon();
}
function setProg(uid, score) {
  if (RO()) return false;
  const d = prog(uid, S.user) || {}, first = !d.done && score >= PASS;
  put({ id: 'u_' + uid, owner: S.user, kind: 'prog', deleted: false, data: { best: Math.max(d.best || 0, score), last: score, tries: (d.tries || 0) + 1, done: !!d.done || score >= PASS, at: Date.now() } }, true);
  return first;
}
function bumpWord(k, delta) {
  if (RO() || !k) return;
  const m = { ...mem(S.user) }; m[k] = clamp((m[k] || 0) + delta, 0, 5);
  put({ id: 'vocab-mem', owner: S.user, kind: 'meta', deleted: false, data: { m } }, true);
}
function addXp(n) {
  if (RO() || !n) return;
  const s = stats(S.user), days = { ...(s.days || {}) }, t = ymd(new Date());
  days[t] = (days[t] || 0) + n;
  for (const k of Object.keys(days)) if (k < ymd(new Date(Date.now() - 120 * 864e5))) delete days[k];
  put({ id: 'stats-xp', owner: S.user, kind: 'meta', deleted: false, data: { xp: (s.xp || 0) + n, days } }, true);
}

// ---------- server ----------
async function rpc(fn, args) { // retries: some networks drop connections
  for (let i = 0; ; i++) {
    try {
      const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: 'POST', cache: 'no-store', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
      if (!r.ok) { const e = new Error('server ' + r.status); e.server = true; throw e; }
      const t = await r.text(); return t ? JSON.parse(t) : null;
    } catch (e) { if (i >= 4 || e.server) throw navigator.onLine ? e : new Error('offline'); await new Promise(r => setTimeout(r, 300 * (i + 1))); }
  }
}
let pushTimer = null;
function pushSoon() { clearTimeout(pushTimer); pushTimer = setTimeout(syncNow, 400); showSync(); }
async function syncNow() {
  if (!S.user && !S.admin) return;
  if (S.sync.busy) { S.sync.again = true; return; }
  S.sync.busy = true; showSync(); let changed = false; const me = cacheKey();
  try {
    if (!S.admin && S.queue.size) {
      const keys = [...S.queue], sent = keys.map(k => S.items.get(k)).filter(Boolean);
      const snap = new Map(sent.map(i => [key(i), i.updated]));
      for (let i = 0; i < sent.length; i += 200) {
        const b = sent.slice(i, i + 200).map(({ id, kind, data, updated, deleted }) => ({ id, kind, data, updated, deleted }));
        const r = await rpc('en_put', { p_owner: S.user, p_pin: S.pin || null, p_items: b });
        if (!r?.ok) { needPin(r?.pin); return; }
      }
      for (const k of keys) if (S.items.get(k)?.updated === snap.get(k)) S.queue.delete(k);
      saveCache(); ping();
    }
    let rows;
    if (S.admin) {
      const r = await rpc('en_admin', { p_pass: S.pass, p_after: S.seq });
      if (!r?.ok) { logout(); return; }
      S.users = r.users || []; LS.set('admin.users', JSON.stringify(S.users)); rows = r.rows || [];
    } else { const r = await rpc('en_list', { p_owner: S.user, p_after: S.seq, p_pin: S.pin || null }); if (!r?.ok) { needPin(r?.pin); return; } rows = r.rows || []; }
    if (me !== cacheKey()) return;
    for (const r of rows) {
      const it = { id: r.id, owner: r.owner || S.user, kind: r.kind, data: r.data || {}, updated: Number(r.updated), deleted: !!r.deleted };
      const cur = S.items.get(key(it));
      if (!cur || (it.updated >= cur.updated && !S.queue.has(key(it)))) {
        if (!cur || JSON.stringify(cur) !== JSON.stringify(it)) changed = true;
        S.items.set(key(it), it);
      }
      S.seq = Math.max(S.seq, Number(r.seq));
    }
    if (changed || rows.length) saveCache();
    S.sync.at = new Date(); S.sync.err = '';
  } catch (e) { S.sync.err = e?.message === 'offline' ? 'Offline, tersimpan di perangkat ini' : (e?.message || String(e)); }
  finally { S.sync.busy = false; }
  if (S.sync.again) { S.sync.again = false; return syncNow(); }
  if (changed && !S.run) render(); else showSync();
}
// realtime: supabase broadcast pings (no data inside), plus a 10 s check
let sb = null, chans = [];
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Gagal memuat ' + src.split('/').pop())); document.head.appendChild(s); });
async function liveStart() {
  try {
    if (!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
    sb ||= window.supabase.createClient(SB_URL, SB_KEY);
    liveStop();
    const all = sb.channel('english-all');
    if (S.admin) all.on('broadcast', { event: 'chg' }, () => syncNow());
    chans.push(all.subscribe());
    if (!S.admin) chans.push(sb.channel('english-u-' + S.user).on('broadcast', { event: 'chg' }, () => syncNow()).subscribe());
  } catch {}
}
function liveStop() { if (sb) chans.forEach(c => sb.removeChannel(c)); chans = []; }
function ping() { for (const c of chans) try { c.send({ type: 'broadcast', event: 'chg', payload: { t: Date.now() } }); } catch {} }
const syncText = () => S.sync.err ? S.sync.err : S.sync.busy || S.queue.size ? 'Menyimpan…' : S.sync.at ? 'Tersinkron ' + hms(S.sync.at) : 'Menghubungkan…';
function showSync() { document.querySelectorAll('.sync').forEach(e => { e.textContent = syncText(); e.classList.toggle('err', !!S.sync.err); }); }

// ---------- login (same accounts & PIN as Planner / Notes) ----------
const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(x => x.toString(16).padStart(2, '0')).join('');
const pinHash = (name, pin) => sha('planner-pin:' + name + ':' + pin);
const PIN_MSG = { need: 'Masukkan PIN.', wrong: 'PIN salah.', locked: 'Terlalu banyak PIN salah. Coba lagi 15 menit lagi.', format: 'PIN harus 4–12 angka.', invalid: 'Nama pengguna tidak valid.' };
function needPin(code) { // server says this session's PIN is missing/wrong: back to the PIN screen
  const name = S.user; if (!name) return;
  liveStop(); LS.set('u.' + name + '.haspin', '1'); SS.del('pin.' + name);
  S.user = null; S.pin = ''; S.items = new Map(); S.queue = new Set(); S.seq = 0; S.run = null;
  S.gate = { name, msg: code === 'locked' ? PIN_MSG.locked : 'Akun ini memakai PIN. Masukkan PIN untuk melanjutkan.' };
  if (dlg().open) dlg().close(); render();
}
async function login(raw, pass, remember, pin) {
  const name = normUser(raw);
  if (!validUser(name)) throw new Error('Nama pengguna 3–32 karakter: huruf, angka, titik, garis bawah, atau tanda minus.');
  if (name === ADMIN) {
    if (!pass) throw new Error('Masukkan password Admin.');
    const r = await rpc('en_admin', { p_pass: pass, p_after: 0 }).catch(e => { throw new Error('Tidak bisa menghubungi server (' + e.message + ').'); });
    if (!r?.ok) throw new Error(r?.locked ? 'Terlalu banyak percobaan salah. Coba lagi 15 menit lagi.' : 'Password Admin salah.');
    S.admin = true; S.user = null; S.pass = pass; S.owner = '';
    S.items = new Map(); S.seq = 0; S.users = r.users || [];
    for (const x of r.rows || []) { const it = { id: x.id, owner: x.owner, kind: x.kind, data: x.data || {}, updated: Number(x.updated), deleted: !!x.deleted }; S.items.set(key(it), it); S.seq = Math.max(S.seq, Number(x.seq)); }
    saveCache(); LS.set('admin.users', JSON.stringify(S.users)); S.sync.at = new Date();
    SS.set('admin', pass); if (remember) LS.set('session', JSON.stringify({ admin: true })); else LS.del('session');
    go('users');
  } else {
    let r = null;
    try { r = await rpc('pl_login', { p_owner: name, p_pin: pin || null }); } catch (e) { // offline: unlock with the PIN checked on this device before
      const h = LS.get('u.' + name + '.pinhash');
      if (h) { if (!pin) { const er = new Error(PIN_MSG.need); er.needPin = true; throw er; } if (await pinHash(name, pin) !== h) throw new Error(PIN_MSG.wrong); }
      else if (LS.get('u.' + name + '.haspin')) throw new Error('Tidak bisa menghubungi server (' + e.message + ').');
    }
    if (r && !r.ok) { const er = new Error(PIN_MSG[r.pin] || 'Gagal masuk.'); er.needPin = r.pin === 'need'; throw er; }
    S.admin = false; S.user = name; S.pass = ''; S.pin = pin || ''; S.gate = null;
    if (r) { S.hasPin = !!r.pin; if (r.pin) { LS.set('u.' + name + '.haspin', '1'); LS.set('u.' + name + '.pinhash', await pinHash(name, pin)); } else { LS.del('u.' + name + '.haspin'); LS.del('u.' + name + '.pinhash'); } }
    else S.hasPin = !!pin;
    if (pin) SS.set('pin.' + name, pin);
    loadCache();
    if (remember) LS.set('session', JSON.stringify({ user: name })); else { LS.del('session'); SS.set('user', name); }
    setTimeout(syncNow, 0);
    if (route()[0] === 'users') go('');
  }
  liveStart();
}
function logout() {
  liveStop(); LS.del('session'); SS.del('admin'); SS.del('user'); if (S.user) SS.del('pin.' + S.user); S.pin = ''; S.gate = null; S.run = null;
  S.user = null; S.admin = false; S.pass = ''; S.items = new Map(); S.queue = new Set(); S.seq = 0; S.sync = { busy: false, again: false, at: null, err: '' };
  if (dlg().open) dlg().close(); go('');
}

let VOICE = null;
function enVoice() {
  if (VOICE) return VOICE;
  const vs = (window.speechSynthesis?.getVoices() || []).filter(v => /^en[-_]/i.test(v.lang));
  VOICE = vs.find(v => /Samantha|Google US English|Aria|Jenny|Ava/i.test(v.name)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs[0] || null;
  return VOICE;
}
function say(t, slow) {

    const sy = window.speechSynthesis; if (!sy || !t) return; sy.cancel();
    const u = new SpeechSynthesisUtterance(String(t).replace(/_{3,}/g, 'blank')); u.lang = 'en-US';
    u.rate = slow || LS.get('slow') === '1' ? 0.7 : 0.95; const v = enVoice(); if (v) u.voice = v; sy.speak(u);

}
try { speechSynthesis.onvoiceschanged = () => { VOICE = null; }; } catch {}
const autoSay = () => LS.get('autosay') !== '0';
const spk = (t, cls = '') => `<button type="button" class="spk ${cls}" data-a="say" data-t="${esc(t)}" aria-label="Dengarkan" title="Dengarkan">${ic('speaker', cls === 'xl' ? 28 : cls === 'sm' ? 14 : 16)}</button>`;

function ring(p, size = 120, stroke = 10) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${p}%"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--soft)" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--acc)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p / 100)}" transform="rotate(-90 ${size / 2} ${size / 2})"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${size / 4.6}" font-weight="700" fill="var(--text)">${p}%</text></svg>`;
}
