<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* phones + small tablets: whole app at 88% (layout widens to fill the screen); max-scale stops iOS zooming into inputs */
if (Math.min(screen.width, screen.height) <= 820) document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=0.88, minimum-scale=0.88, maximum-scale=0.88, viewport-fit=cover';</script>
<title>English Course</title>
<meta name="description" content="English Course: belajar bahasa Inggris dengan terjemahan Indonesia — level Dasar, Umum, Fasih, kosakata, struktur, percakapan, games, dan progres 0–100% yang tersinkron di HP dan laptop.">
<meta name="theme-color" content="#3355d6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%233355d6'/><text x='50' y='66' font-family='Arial' font-weight='700' font-size='46' fill='white' text-anchor='middle'>En</text></svg>">
<style>:root{--bg:#f4f6fb;--card:#fff;--soft:#eceff6;--line:#dfe3ec;--text:#161a24;--muted:#646b7a;--acc:#3355d6;--acc-ink:#fff;--ok:#1f9d55;--okbg:#e3f6ea;--red:#d6383e;--redbg:#fde7e8;--shadow:0 1px 2px rgba(10,20,50,.05),0 4px 14px rgba(10,20,50,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1218;--card:#181c24;--soft:#232834;--line:#2c3240;--text:#eef1f6;--muted:#9aa2b2;--acc:#7c9bff;--acc-ink:#0b1230;--ok:#4ad08a;--okbg:#14301f;--red:#ff6b70;--redbg:#3a1a1c;--shadow:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1218;--card:#181c24;--soft:#232834;--line:#2c3240;--text:#eef1f6;--muted:#9aa2b2;--acc:#7c9bff;--acc-ink:#0b1230;--ok:#4ad08a;--okbg:#14301f;--red:#ff6b70;--redbg:#3a1a1c;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;color:var(--text)}
input:focus{outline:2px solid color-mix(in srgb,var(--acc) 45%,transparent);border-color:var(--acc)}
a{color:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;text-align:center}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.big{padding:12px 18px;font-size:16px;border-radius:12px}
.btn small{font-weight:500;opacity:.8}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{padding:10px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;text-decoration:none;flex:none}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#4f7bff,#2747c9);color:#fff;font-size:14px;font-weight:800;letter-spacing:-.02em}
.tabs{display:flex;gap:4px;flex:1;justify-content:center}
.tab{border:0;background:none;border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.tab:hover{background:var(--soft)}
.tab.on{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.bnav{display:none}
.top-r{display:flex;align-items:center;gap:10px;flex:none}
.pill{font-weight:800;font-size:13px;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.main{padding:20px 24px 110px}
.viewing{margin-bottom:14px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--acc) 12%,transparent);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.head h1,.hero h1,.u-t h1{margin:0;font-size:24px;letter-spacing:-.01em}
.sh{font-size:15px;margin:26px 2px 10px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 60%,#19c2b0));border-radius:99px;transition:width .3s}
/* home */
.hero{display:flex;gap:26px;align-items:center;padding:22px 26px}
.hero-ring{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.rk{font-weight:800}
.hero-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.hero-t p{margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpis>div{background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.kpis b{font-size:20px}.kpis span{font-size:12.5px;color:var(--muted)}
.hero .btn.big{align-self:flex-start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lvl{text-align:left;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.lvl:hover{border-color:var(--acc)}
.lvl.locked{opacity:.65}
.lvl p{margin:8px 0 4px}
.lvl-h{display:flex;gap:10px;align-items:center}
.lvl-i{font-size:28px}.lvl-p{margin-left:auto;font-weight:800;font-size:18px;color:var(--acc)}
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.catb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;cursor:pointer}
.catb span{font-size:26px}.catb:hover,.gtile:hover:not(:disabled),.ucard:hover{border-color:var(--acc)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.games.mini{grid-template-columns:repeat(7,minmax(0,1fr))}
.games.mini .gtile .small{display:none}
.gtile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;cursor:pointer;text-align:left}
.games.mini .gtile{align-items:center;text-align:center;padding:12px 6px}
.gtile:disabled{opacity:.5;cursor:not-allowed}
.gi{font-size:30px}
.how ol{margin:0;padding:16px 18px 16px 36px;display:flex;flex-direction:column;gap:8px}
/* learn */
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--soft);padding:5px;border-radius:14px}
.seg3 button{border:0;background:none;padding:10px;border-radius:10px;font-weight:700;cursor:pointer}
.seg3 button.on{background:var(--card);box-shadow:var(--shadow);color:var(--acc)}
.seg3 small{color:var(--muted);font-weight:600}
.lvl-d{margin:10px 2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chipb{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13.5px;cursor:pointer;font-weight:600}
.chipb.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.chipb:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.grid.dim{opacity:.55}
.ucard{text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.ucard.done{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.uc-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.uc-i{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--soft);font-size:15px}
.uc-n{font-size:16px;margin-top:4px}
.ok{color:var(--ok);font-weight:800;margin-left:auto}
.lockbox{padding:14px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
/* unit */
.u-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.u-t{flex:1;min-width:0}
.u-s{display:flex;flex-direction:column;align-items:flex-end}.u-s b{font-size:24px;color:var(--acc)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.word{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.w-h{display:flex;align-items:center;gap:8px}
.w-en{font-size:18px}
.dots{margin-left:auto;color:var(--acc);font-size:11px;letter-spacing:1px}
.w-id{font-weight:600;color:var(--acc)}
.w-ex{display:flex;gap:6px;align-items:flex-start;font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px}
.spk{border:0;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc);border-radius:50%;width:32px;height:32px;flex:none;cursor:pointer;font-size:15px;display:inline-grid;place-items:center;padding:0}
.spk:hover{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.spk.sm{width:26px;height:26px;font-size:12px}
.spk.xl{width:64px;height:64px;font-size:28px}
.gram{padding:6px 20px 12px;line-height:1.65}
.gram .tip{background:color-mix(in srgb,#f5a623 16%,transparent);padding:10px 12px;border-radius:10px}
.gt{border-collapse:collapse;width:100%;max-width:560px}
.gt th,.gt td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.gt th{background:var(--soft)}
.pat{padding:12px;display:flex;flex-direction:column;gap:8px}
.pat code{background:var(--soft);padding:8px 12px;border-radius:8px;font-size:14px;white-space:normal}
.list{padding:4px 0}
.list .row{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.two-col{display:grid;grid-template-columns:1fr 1fr}
.two-col .row:nth-child(2){border-top:0}
.dlgbox{padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{display:flex;gap:8px;max-width:80%;align-items:flex-start}
.bub>div{background:var(--soft);padding:9px 12px;border-radius:14px;transition:box-shadow .2s}
.bub.r{align-self:flex-end;flex-direction:row-reverse}
.bub.r>div{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.bub.on>div{box-shadow:0 0 0 2px var(--acc)}
.bub .sp{width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.bub .spk{margin-right:6px;vertical-align:middle}
.u-act{position:sticky;bottom:12px;margin-top:18px;display:grid;grid-template-columns:1fr auto auto 1fr;gap:10px;padding:10px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.u-act>:first-child{justify-self:start}.u-act>:last-child{justify-self:end}
/* runner */
.main.running{max-width:none}
.run-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:8px}
.run-h>b{font-size:17px;text-align:center}.run-h>span{justify-self:end}.run-h .btn{justify-self:start}
.qbar{margin-bottom:12px}
.qcard{padding:22px;display:flex;flex-direction:column;gap:16px;min-height:300px}
.qp{font-size:19px;text-align:center;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;text-align:center}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
.opt.fade{opacity:.5}
.big-spk{display:flex;justify-content:center;align-items:center;gap:12px}
.typef{display:flex;gap:10px}
.typef input{flex:1;font-size:18px;padding:12px 14px}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fb.right{background:var(--okbg)}.fb.wrong{background:var(--redbg)}
.fb .btn{align-self:stretch;margin-top:6px}
.scr-ans{min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.scr-ans.right{border-color:var(--ok);background:var(--okbg)}.scr-ans.wrong{border-color:var(--red);background:var(--redbg)}
.scr-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.tok.used{visibility:hidden}
.flash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:260px;width:100%;cursor:pointer;padding:24px;text-align:center}
.flash.back{background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.f-big{font-size:34px;letter-spacing:-.01em}
.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;width:100%}
.center>.spk{margin-top:12px}
.flash-ok{box-shadow:0 0 0 3px var(--ok)}.flash-bad{box-shadow:0 0 0 3px var(--red)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.match>div{display:flex;flex-direction:column;gap:10px}
.mcell{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 10px;font-weight:600;font-size:15.5px;cursor:pointer;min-height:58px}
.mcell.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.mcell.done{opacity:.3;border-color:var(--ok);background:var(--okbg)}
.mcell.bad{border-color:var(--red);background:var(--redbg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.lives{font-size:20px}
.hword{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:28px;font-weight:800;text-transform:lowercase}
.hl{width:30px;border-bottom:3px solid var(--text);text-align:center;min-height:42px}
.hword .sp{width:16px}
.kb{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.key{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 0;font-weight:700;font-size:16px;cursor:pointer;text-transform:uppercase}
.key.hit{background:var(--okbg);border-color:var(--ok)}.key.miss{background:var(--redbg);opacity:.6}
.say-big{font-size:22px;display:flex;gap:10px;align-items:center;justify-content:center}
.mic.on{background:var(--red);border-color:var(--red);color:#fff}
.result{padding:28px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.result h2{margin:4px 0 0}.result p{margin:0}
.res-big{font-size:46px}
.res-act{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
/* progress */
.ranks{display:flex;gap:6px;flex-wrap:wrap}
.ranks span{padding:4px 10px;border-radius:99px;background:var(--soft);font-size:13px;color:var(--muted);font-weight:600}
.ranks span.on{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.acts{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;padding:14px;height:140px}
.act{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.act i{display:block;width:100%;max-width:26px;background:var(--acc);border-radius:6px 6px 2px 2px;min-height:2px}
.act small{color:var(--muted);font-size:11px}
.lvp{padding:14px 16px}
.ulist{display:flex;flex-direction:column;margin-top:6px}
.urow{display:flex;gap:8px;padding:6px 2px;border-top:1px solid var(--line);text-decoration:none;font-size:14px}
.urow .un2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weak{padding:12px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.wchip{display:inline-flex;gap:6px;align-items:center;background:var(--soft);border-radius:99px;padding:3px 12px 3px 4px;font-size:14px}
.users{width:100%;border-collapse:collapse}
.users th,.users td{padding:9px 12px;border-top:1px solid var(--line);text-align:left;font-size:14px;white-space:nowrap}
.users th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.users tr.click{cursor:pointer}.users tr.click:hover td{background:var(--soft)}
.num{text-align:right!important}
/* dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--card);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,10,20,.45)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fld .btn{align-self:flex-start}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;border:1px solid var(--line);border-radius:10px;padding:7px;cursor:pointer;font-weight:600}
.seg input:checked+span{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlg-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dlg-f .sp{flex:1}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}
/* gate (same as Planner, blue) */
.gate{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(1100px 700px at 10% 0%,#2f5bd8 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#16a3a0 0%,transparent 55%),linear-gradient(160deg,#0f1a33,#0b1020)}
.gate-card{width:min(380px,100%);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:24px;padding:34px 26px 24px;text-align:center;color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.gate .logo{width:68px;height:68px;border-radius:20px;font-size:34px;margin:0 auto 12px}
.gate h1{margin:0;font-size:27px}
.gate-sub{margin:4px 0 22px;color:rgba(255,255,255,.75)}
.gate-field{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:4px 14px;text-align:left;margin-bottom:10px}
.gate-field:focus-within{border-color:#9cc2ff;box-shadow:0 0 0 3px rgba(156,194,255,.3)}
.gate-field input{flex:1;background:none;border:0;outline:0!important;color:#fff;font-size:16px;padding:10px 0}
.gate-field input::placeholder{color:rgba(255,255,255,.6)}
.mask-wrap{position:relative;flex:1;display:block;min-width:0}
.mask-wrap input,#user-mask{font:500 17px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;padding:10px 0}
.mask-wrap input{width:100%;-webkit-text-fill-color:transparent;color:transparent;caret-color:#fff}
.mask-wrap input::placeholder{-webkit-text-fill-color:rgba(255,255,255,.6);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:0}
#user-mask{position:absolute;inset:0;pointer-events:none;color:#fff;white-space:pre;overflow:hidden}
.gate-btn{width:100%;margin-top:4px;padding:12px;font-size:16px;font-weight:700;border-radius:14px;background:linear-gradient(135deg,#4f7bff,#2747c9);border:0;color:#fff;cursor:pointer}
.gate-btn:disabled{opacity:.7}
.gate-err{color:#ffc2c2;min-height:18px;margin-top:10px;font-size:14px}
.gate-note{color:rgba(255,255,255,.65);font-size:12.5px;margin:6px 0 0;line-height:1.5}
.gate .check{justify-content:center;color:rgba(255,255,255,.85);font-weight:500;font-size:14px;margin:4px 0 10px}
.gate .logo{font-size:26px}
@media (max-width:820px){
  .top-in{gap:10px;padding:8px 12px}
  .tabs,.bname,.sync,.un{display:none}
  .top-r{margin-left:auto}
  .bnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
  .bnav .tab{flex-direction:column;gap:0;padding:6px 0;font-size:12px}
  .bnav .ti{font-size:20px}
  .main{padding:12px 12px 100px}
  .main.running{padding-bottom:30px}
  .hero{flex-direction:column;gap:14px;padding:18px 14px;text-align:center}
  .hero .btn.big{align-self:stretch}
  .kpis{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr}
  .cats{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .catb{padding:10px 2px;font-size:12.5px}.catb small{display:none}
  .games.mini{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .games.mini .gtile{font-size:12.5px;padding:10px 4px}
  .games{grid-template-columns:1fr 1fr}
  .gtile{padding:12px}
  .grid,.words{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}.two-col .row:nth-child(2){border-top:1px solid var(--line)}
  .bub{max-width:94%}
  .u-head{flex-wrap:wrap;gap:10px}.u-t{order:3;flex-basis:100%}.u-s{margin-left:auto}
  .u-act{grid-template-columns:1fr 1fr;bottom:calc(70px + env(safe-area-inset-bottom))}
  .u-act>.primary{grid-column:1/-1;order:-1}
  .u-act>span{display:none}
  .opts{grid-template-columns:1fr}
  .qcard{padding:16px;min-height:0}
  .qp{font-size:17px}
  .match{gap:8px}.mcell{font-size:14px;padding:10px 6px}
  .kb{grid-template-columns:repeat(7,1fr)}
  .acts{gap:3px;padding:10px}
  .seg3 button{padding:8px 4px;font-size:14px}
  .two{grid-template-columns:1fr}
  .toast{bottom:90px}
}

    { id: 'd-g1', type: 'grammar', title: 'To Be: am / is / are', en: 'The verb "to be"',
      explain: '<p><b>To be</b> artinya “adalah / berada / sedang”. Dipakai untuk menyebut <b>identitas, sifat, umur, tempat, dan perasaan</b>. Bahasa Indonesia sering tidak memakai kata “adalah”, tetapi bahasa Inggris <b>wajib</b> memakai am/is/are.</p><ul><li><b>I</b> → am</li><li><b>He / She / It</b> / satu orang/benda → is</li><li><b>You / We / They</b> / jamak → are</li></ul><p>Negatif: tambahkan <b>not</b> (I am not, she is not = isn\'t, they are not = aren\'t). Tanya: balik posisinya (<b>Are you</b> tired?).</p><p class="tip">❌ “I happy.” → ✅ “I <b>am</b> happy.”</p>',

      explain: '<p>Dipakai untuk <b>kebiasaan, rutinitas, fakta, dan jadwal</b>. Kata kerja memakai bentuk dasar (eat, go, work).</p><p><b>Aturan penting:</b> untuk <b>he / she / it</b> (satu orang/benda) tambahkan <b>-s / -es</b>: he works, she watches, it goes, he studies.</p><ul><li>Negatif: <b>do not (don\'t)</b> / <b>does not (doesn\'t)</b> + kata kerja dasar.</li><li>Tanya: <b>Do / Does</b> + subjek + kata kerja dasar?</li></ul><p>Kata penanda: <i>every day, usually, always, often, sometimes, never, on Monday</i>.</p><p class="tip">❌ “She don\'t like it.” → ✅ “She <b>doesn\'t</b> like it.” &nbsp; ❌ “Does he works?” → ✅ “Does he <b>work</b>?”</p>',

    { id: 'd-g3', type: 'grammar', title: 'A / An / The & Bentuk Jamak', en: 'Articles & Plurals',
      explain: '<p>Bahasa Inggris membedakan benda <b>tunggal</b> dan <b>jamak</b>, dan memakai kata sandang.</p><ul><li><b>a</b> + kata berbunyi konsonan: a book, a car, a <b>u</b>niversity (bunyi “yu”).</li><li><b>an</b> + kata berbunyi vokal: an apple, an egg, an <b>h</b>our (h tidak dibaca).</li><li><b>the</b> = benda tertentu / sudah disebut / hanya satu: the sun, the book on the table.</li></ul><p><b>Jamak:</b> + s (books), + es setelah s, sh, ch, x (boxes, watches), y → ies (city → cities). Tidak beraturan: man → men, woman → women, child → children, person → people, foot → feet, tooth → teeth.</p><p class="tip">Bahasa Indonesia mengulang kata (buku-buku); bahasa Inggris cukup <b>-s</b>: “two books”, bukan “two book”.</p>',

    { id: 'd-g5', type: 'grammar', title: 'There is / There are & Preposisi Tempat', en: 'There is/are & Prepositions of Place',
      explain: '<p><b>There is</b> (tunggal) / <b>There are</b> (jamak) artinya “<b>ada</b>”.</p><ul><li>There is a bank near my house. (Ada sebuah bank dekat rumahku.)</li><li>There are two cats on the sofa.</li><li>Tanya: <b>Is there</b> …? / <b>Are there</b> …? Negatif: There isn\'t / There aren\'t.</li></ul><p><b>Preposisi tempat:</b> in (di dalam), on (di atas, menempel), under (di bawah), next to (di sebelah), between (di antara), behind (di belakang), in front of (di depan), near (dekat), opposite (di seberang).</p><p class="tip">Jangan pakai “have” untuk “ada”: ❌ “In my room have a TV.” → ✅ “<b>There is</b> a TV in my room.”</p>',

    { id: 'd-g6', type: 'grammar', title: 'Kata Tanya (WH Questions)', en: 'Question Words',
      explain: '<p>Kata tanya diletakkan di <b>awal</b> kalimat.</p><ul><li><b>What</b> = apa · <b>Who</b> = siapa · <b>Where</b> = di mana · <b>When</b> = kapan</li><li><b>Why</b> = mengapa · <b>How</b> = bagaimana · <b>Which</b> = yang mana · <b>Whose</b> = milik siapa</li><li><b>How much</b> = berapa (harga/tak terhitung) · <b>How many</b> = berapa banyak (terhitung) · <b>How old</b> = berapa umur · <b>How long</b> = berapa lama</li></ul><p>Pola: <b>Kata tanya + am/is/are + subjek</b>? (Where is the hotel?) atau <b>Kata tanya + do/does + subjek + kata kerja</b>? (Where do you live?)</p><p class="tip">❌ “Where you live?” → ✅ “Where <b>do</b> you live?”</p>',

    { id: 'u-g3', type: 'grammar', title: 'Masa Depan: Will & Going to', en: 'Future: will & going to',

    { id: 'u-g4', type: 'grammar', title: 'Present Perfect (pengalaman & hasil)', en: 'Present Perfect',
      explain: '<p><b>have/has + kata kerja-3</b> (past participle). Dipakai untuk:</p><ul><li><b>Pengalaman</b> (tanpa waktu spesifik): I have been to Japan. Have you ever eaten durian?</li><li><b>Hasil yang masih terasa sekarang</b>: I have lost my key. (sekarang masih hilang)</li><li><b>Sejak … sampai sekarang</b>: I have lived here <b>for</b> 5 years / <b>since</b> 2019.</li><li>Dengan <b>already, yet, just</b>: I have already finished. Have you finished yet? She has just left.</li></ul><p>V3 tak beraturan: go → gone/been, see → seen, eat → eaten, do → done, write → written, take → taken.</p><p class="tip">Jika ada waktu spesifik lampau (yesterday, in 2020) pakai <b>simple past</b>: ❌ “I have seen him yesterday.” → ✅ “I <b>saw</b> him yesterday.”</p>',

    { id: 'u-g5', type: 'grammar', title: 'Perbandingan (Comparative & Superlative)', en: 'Comparatives & Superlatives',
      explain: '<p>Untuk <b>membandingkan</b> dua hal (lebih …) dan <b>paling</b> (ter-…).</p><ul><li>Kata pendek: + <b>-er than</b> / <b>the …-est</b>: cheap → cheaper than → the cheapest; big → bigger → the biggest; easy → easier → the easiest.</li><li>Kata panjang (2+ suku kata): <b>more … than</b> / <b>the most …</b>: expensive → more expensive → the most expensive.</li><li>Tidak beraturan: good → <b>better</b> → <b>the best</b>; bad → <b>worse</b> → <b>the worst</b>; far → farther → the farthest.</li><li>Sama: <b>as … as</b>: She is as tall as her mother.</li></ul><p class="tip">❌ “more cheaper” → ✅ “cheaper”. ❌ “the most best” → ✅ “the best”.</p>',
      pattern: ['A + is + adj-er / more adj + than + B', 'A + is + the adj-est / the most adj + (in/of …)', 'A + is + as adj as + B'],

    { id: 'u-g6', type: 'grammar', title: 'Modal: can, should, must, have to', en: 'Modal Verbs',
      explain: '<p>Modal + <b>kata kerja dasar</b> (tanpa to, tanpa -s).</p><ul><li><b>can / can\'t</b> = bisa (kemampuan, izin): I can swim. Can I sit here?</li><li><b>could</b> = bisa (lampau) / permintaan sopan: Could you help me?</li><li><b>should / shouldn\'t</b> = sebaiknya (saran): You should rest.</li><li><b>must / mustn\'t</b> = harus (aturan kuat) / dilarang: You mustn\'t smoke here.</li><li><b>have to / has to</b> = harus (keharusan dari luar): I have to work on Saturday. <b>don\'t have to</b> = tidak perlu.</li><li><b>may / might</b> = mungkin: It might rain.</li></ul><p class="tip">❌ “She cans speak.” → ✅ “She <b>can</b> speak.” &nbsp; ❌ “You should to go.” → ✅ “You should <b>go</b>.” Ingat: <b>mustn\'t</b> (dilarang) ≠ <b>don\'t have to</b> (tidak wajib).</p>',
      pattern: ['Subjek + modal + kata kerja dasar', 'Modal + subjek + kata kerja dasar?', 'Subjek + have/has to + kata kerja dasar'],
      examples: ['I can speak a little English.|Saya bisa sedikit berbahasa Inggris.', 'Could you open the window, please?|Bisakah Anda membuka jendela?', 'You should drink more water.|Kamu sebaiknya minum lebih banyak air.', 'Passengers must wear seat belts.|Penumpang harus memakai sabuk pengaman.', 'You mustn\'t park here.|Kamu dilarang parkir di sini.', 'I have to finish this today.|Saya harus menyelesaikan ini hari ini.', 'You don\'t have to pay. It\'s free.|Kamu tidak perlu bayar. Ini gratis.', 'It might rain this afternoon.|Mungkin akan hujan sore ini.'],

    { id: 'f-g1', type: 'grammar', title: 'Kalimat Pengandaian (Conditionals)', en: 'Conditionals 0–3',
      explain: '<p>Kalimat “jika …” punya beberapa tipe:</p><ul><li><b>Zero</b> (fakta umum): If + present, present. <i>If you heat ice, it melts.</i></li><li><b>First</b> (mungkin terjadi): If + present, <b>will</b> + V. <i>If it rains, I will stay home.</i></li><li><b>Second</b> (khayalan sekarang/tidak nyata): If + <b>past</b>, <b>would</b> + V. <i>If I had more money, I would travel the world.</i> (Pakai <b>were</b> untuk semua subjek: If I were you…)</li><li><b>Third</b> (penyesalan masa lalu): If + <b>had + V3</b>, <b>would have + V3</b>. <i>If I had studied, I would have passed.</i></li></ul><p>Juga: <b>unless</b> = kecuali jika; <b>I wish</b> + past = berharap (keadaan sekarang tidak sesuai).</p><p class="tip">❌ “If I will see him, I will tell him.” → ✅ “If I <b>see</b> him, I will tell him.” (Tidak ada <b>will</b> setelah <i>if</i>.)</p>',
      pattern: ['If + present, will + V (nyata)', 'If + past, would + V (khayalan)', 'If + had V3, would have V3 (masa lalu)'],
      examples: ['If you mix red and blue, you get purple.|Jika mencampur merah dan biru, kamu dapat ungu.', 'If it rains tomorrow, we will cancel the trip.|Jika besok hujan, kami akan membatalkan perjalanan.', 'If I were you, I would accept the offer.|Kalau aku jadi kamu, aku akan terima tawarannya.', 'If I had a car, I would drive to work.|Seandainya saya punya mobil, saya akan menyetir ke kantor.', 'If we had left earlier, we wouldn\'t have missed the flight.|Seandainya kita berangkat lebih awal, kita tidak akan ketinggalan pesawat.', 'Unless you hurry, you\'ll be late.|Kalau tidak cepat, kamu akan terlambat.', 'I wish I spoke English fluently.|Saya berharap bisa berbahasa Inggris dengan fasih.'],
      quiz: ['If it ___ tomorrow, we will stay home.|rains|will rain|rained|Jika besok hujan, kita di rumah saja.', 'If I ___ rich, I would buy a big house.|were|am|will be|Seandainya saya kaya, saya akan beli rumah besar.', 'If you heat water to 100°C, it ___.|boils|would boil|boiled|Jika air dipanaskan sampai 100°C, air mendidih.', 'If I had studied harder, I ___ passed the exam.|would have|will have|would|Seandainya saya belajar lebih giat, saya akan lulus.', 'If I were you, I ___ talk to the manager.|would|will|am|Kalau aku jadi kamu, aku akan bicara ke manajer.', '___ you leave now, you will miss the bus.|Unless|If|When|Kecuali kamu berangkat sekarang, kamu akan ketinggalan bus.', 'I wish I ___ more free time.|had|have|will have|Saya berharap punya lebih banyak waktu luang.', 'If she ___ the email, she would have replied.|had seen|saw|has seen|Seandainya dia melihat emailnya, dia pasti membalas.']
    },
    { id: 'f-t1', type: 'topic', cat: 'daily', title: 'Ungkapan Alami Penutur Asli', en: 'Natural Native Expressions',
      phrases: ['I\'m all ears.|Saya mendengarkan (silakan cerita).', 'No worries.|Tidak masalah / santai saja.', 'It\'s up to you.|Terserah kamu.', 'I\'m on my way.|Saya sedang di jalan (menuju).', 'That makes sense.|Masuk akal.', 'I couldn\'t agree more.|Saya sangat setuju.', 'Fair enough.|Wajar / oke, bisa diterima.', 'It\'s not a big deal.|Bukan masalah besar.', 'Let me sleep on it.|Biar saya pikirkan dulu (semalam).', 'I\'ll take your word for it.|Saya percaya kata-katamu.', 'Better late than never.|Lebih baik terlambat daripada tidak sama sekali.', 'You can say that again!|Betul banget!', 'Speak of the devil!|Panjang umur! (orang yang dibicarakan datang)', 'I\'m feeling under the weather.|Saya kurang enak badan.'],
      dialog: ['A|Hey, you look a bit tired. Everything OK?|Hei, kamu kelihatan agak lelah. Semua baik?', 'B|I\'m feeling a bit under the weather, to be honest.|Jujur, saya agak kurang enak badan.', 'A|Oh no. You should take the afternoon off.|Wah. Sebaiknya kamu libur sore ini.', 'B|I\'d love to, but the report is due tomorrow.|Pengen sih, tapi laporannya harus selesai besok.', 'A|No worries, I can cover for you. Just send me your notes.|Santai, saya bisa gantikan. Kirim saja catatanmu.', 'B|Really? That would be a huge help. I owe you one!|Serius? Itu sangat membantu. Aku berutang budi!', 'A|Don\'t mention it. Get some rest.|Sama-sama. Istirahatlah.'],
      resp: ['Where are you? The meeting is starting.|Sorry, I\'m on my way. Five minutes.|I\'m on the way of it.|I\'m all ears.', 'Should we eat Thai or Italian?|Either is fine. It\'s up to you.|It\'s up to me.|I eat up.', 'I\'m sorry I forgot to call you back.|No worries. It\'s not a big deal.|You\'re welcome.|Yes, you forgot.', 'This traffic is terrible!|You can say that again!|Say it again, please.|I\'m terrible.'] },
    { id: 'f-v2', type: 'vocab', title: 'Bisnis & Proyek Lanjutan', en: 'Business & Project Terms', words: [
      'stakeholder|pemangku kepentingan|We must update all stakeholders.|Kita harus mengabari semua pemangku kepentingan.',
      'milestone|tonggak capaian|We reached an important milestone.|Kita mencapai tonggak penting.',
      'scope|ruang lingkup|That task is out of scope.|Tugas itu di luar ruang lingkup.',

      'feasible|layak / memungkinkan|Is this plan feasible?|Apakah rencana ini memungkinkan?',
      'priority|prioritas|Safety is our top priority.|Keselamatan adalah prioritas utama kami.',

      'outcome|hasil|We are happy with the outcome.|Kami senang dengan hasilnya.',

      'profit|keuntungan|The profit was higher than expected.|Keuntungannya lebih tinggi dari perkiraan.',
      'invoice|faktur / tagihan|Please send the invoice by email.|Tolong kirim fakturnya lewat email.',
      'workload|beban kerja|My workload is heavy this week.|Beban kerja saya berat minggu ini.',
      'bottleneck|hambatan / penghambat|The approval process is a bottleneck.|Proses persetujuan menjadi penghambat.',
      'efficient|efisien|The new tool is more efficient.|Alat baru ini lebih efisien.',
      'consistent|konsisten|Be consistent with your quality.|Konsistenlah dengan kualitasmu.',
      'reliable|andal / dapat diandalkan|We need a reliable supplier.|Kita butuh pemasok yang andal.',
      'approve|menyetujui|The director approved the budget.|Direktur menyetujui anggarannya.',
      'postpone|menunda|The launch was postponed.|Peluncurannya ditunda.',
      'collaborate|berkolaborasi|We collaborate with local partners.|Kami berkolaborasi dengan mitra lokal.'
    ] },
    { id: 'f-g2', type: 'grammar', title: 'Kalimat Pasif (Passive Voice)', en: 'Passive Voice',
      explain: '<p>Kalimat pasif fokus pada <b>apa yang dikenai</b> tindakan, bukan pelakunya. Mirip “di-” dalam bahasa Indonesia.</p><p>Rumus: <b>be (sesuai tense) + V3</b> (+ by …).</p><ul><li>Present: The office <b>is cleaned</b> every day. (Kantor dibersihkan setiap hari.)</li><li>Past: The bridge <b>was built</b> in 1990.</li><li>Present perfect: The email <b>has been sent</b>.</li><li>Future: The results <b>will be announced</b> tomorrow.</li><li>Continuous: The road <b>is being repaired</b>.</li><li>Modal: It <b>must be done</b> today.</li></ul><p class="tip">Bahasa Inggris profesional sering memakai pasif: “Your order <b>has been shipped</b>.” “Mistakes <b>were made</b>.”</p>',
      pattern: ['Objek + is/are + V3', 'Objek + was/were + V3', 'Objek + has/have been + V3', 'Objek + will be / must be + V3'],
      examples: ['English is spoken all over the world.|Bahasa Inggris dipakai di seluruh dunia.', 'This house was built in 1985.|Rumah ini dibangun tahun 1985.', 'Your package has been delivered.|Paket Anda sudah diantar.', 'The meeting will be held on Monday.|Rapat akan diadakan hari Senin.', 'The road is being repaired.|Jalannya sedang diperbaiki.', 'The report must be submitted by Friday.|Laporannya harus diserahkan paling lambat Jumat.', 'I was given a second chance.|Saya diberi kesempatan kedua.'],
      quiz: ['The letter ___ sent yesterday.|was|is|were|Surat itu dikirim kemarin.', 'English ___ spoken in many countries.|is|was being|are|Bahasa Inggris dipakai di banyak negara.', 'The project ___ been completed.|has|have|was|Proyek itu sudah selesai dikerjakan.', 'The winners will be ___ tomorrow.|announced|announce|announcing|Pemenang akan diumumkan besok.', 'The road is ___ repaired right now.|being|been|be|Jalannya sedang diperbaiki sekarang.', 'This bridge was built ___ a Dutch company.|by|from|with|Jembatan ini dibangun oleh perusahaan Belanda.', 'The form must ___ signed.|be|been|being|Formulirnya harus ditandatangani.', 'Many houses ___ destroyed by the flood.|were|was|are being|Banyak rumah hancur oleh banjir.']
    },
    { id: 'f-t2', type: 'topic', cat: 'work', title: 'Presentasi & Negosiasi', en: 'Presentations & Negotiation',
      phrases: ['Today I\'d like to walk you through…|Hari ini saya ingin memaparkan…', 'Let me start with a quick overview.|Saya mulai dengan gambaran singkat.', 'As you can see on this slide…|Seperti yang terlihat di slide ini…', 'This brings me to my next point.|Ini membawa saya ke poin berikutnya.', 'To sum up…|Sebagai kesimpulan…', 'I\'m happy to take any questions.|Saya siap menjawab pertanyaan.', 'That\'s a great question.|Pertanyaan yang bagus.', 'What would it take to close the deal today?|Apa yang dibutuhkan agar kesepakatan selesai hari ini?', 'Is there any flexibility on the price?|Apakah harganya masih bisa fleksibel?', 'We could meet you halfway.|Kami bisa bertemu di tengah (kompromi).', 'That\'s the best we can offer.|Itu penawaran terbaik kami.', 'Let\'s put it in writing.|Mari kita tuangkan secara tertulis.'],
      dialog: ['A|Thanks for your proposal. The quality looks great, but the price is a bit high for us.|Terima kasih atas proposalnya. Kualitasnya bagus, tapi harganya agak tinggi bagi kami.', 'B|I understand. What budget did you have in mind?|Saya mengerti. Anggaran berapa yang Anda pikirkan?', 'A|We were hoping for something around 10% lower.|Kami berharap sekitar 10% lebih rendah.', 'B|That\'s difficult, but if you sign a one-year contract, we could offer 7%.|Itu sulit, tapi jika Anda tanda tangan kontrak setahun, kami bisa beri 7%.', 'A|Could you also include free delivery?|Bisakah termasuk pengiriman gratis?', 'B|Fair enough. 7% off plus free delivery. Do we have a deal?|Baiklah. Diskon 7% plus gratis kirim. Sepakat?', 'A|Deal. Let\'s put it in writing.|Sepakat. Mari kita tuangkan secara tertulis.'],
      resp: ['Is there any flexibility on the price?|We could offer 5% off for a bigger order.|Yes, it\'s flexible plastic.|The price is price.', 'Do you have any questions about the presentation?|Yes — how will this affect our costs?|Yes, I present.|No, I am questions.', 'We can\'t go lower than that.|I see. Could you add a longer warranty instead?|Thank you, goodbye.|Go lower, please.', 'So, do we have a deal?|Yes, let\'s put it in writing.|Deal with it.|Yes, a deal is a deal is.'] },
    { id: 'f-v3', type: 'vocab', title: 'Idiom Sehari-hari', en: 'Everyday Idioms', words: [

      'by the way|ngomong-ngomong|By the way, did you call him?|Ngomong-ngomong, kamu sudah meneleponnya?',

      'think outside the box|berpikir kreatif|We need to think outside the box.|Kita perlu berpikir di luar kebiasaan.',

    { id: 'f-g3', type: 'grammar', title: 'Kalimat Tidak Langsung (Reported Speech)', en: 'Reported Speech',
      explain: '<p>Untuk menyampaikan ulang perkataan orang lain. Biasanya tense <b>mundur satu langkah</b>:</p><ul><li>present → past: “I <b>am</b> tired.” → She said (that) she <b>was</b> tired.</li><li>past / present perfect → past perfect: “I <b>lost</b> my key.” → He said he <b>had lost</b> his key.</li><li>will → <b>would</b>, can → <b>could</b>, must → <b>had to</b>.</li><li>Kata keterangan berubah: today → that day, tomorrow → the next day, here → there.</li></ul><p><b>Pertanyaan</b>: susunan jadi seperti kalimat biasa: “Where do you live?” → She asked me <b>where I lived</b>. Ya/tidak → <b>if/whether</b>: He asked <b>if I was</b> ready.</p><p><b>Perintah</b>: told/asked + <b>to</b> + V: “Close the door.” → He told me <b>to close</b> the door.</p><p class="tip"><b>say</b> tanpa orang: She said that…; <b>tell</b> + orang: She told <b>me</b> that…</p>',
      pattern: ['Subjek + said (that) + tense mundur', 'Subjek + told + orang + (that) …', 'Subjek + asked + (orang) + if/WH + subjek + kata kerja', 'Subjek + told/asked + orang + to + V'],
      examples: ['"I\'m busy." → She said she was busy.|"Saya sibuk." → Dia bilang dia sibuk.', '"I will call you." → He said he would call me.|"Saya akan meneleponmu." → Dia bilang akan menelepon saya.', '"We can help." → They said they could help.|"Kami bisa bantu." → Mereka bilang bisa membantu.', '"Where do you work?" → She asked me where I worked.|"Kamu kerja di mana?" → Dia bertanya di mana saya bekerja.', '"Are you ready?" → He asked if I was ready.|"Kamu siap?" → Dia bertanya apakah saya siap.', '"Please wait here." → She asked me to wait there.|"Tolong tunggu di sini." → Dia meminta saya menunggu di sana.', 'He told me that the meeting had been cancelled.|Dia memberi tahu saya bahwa rapat sudah dibatalkan.'],
      quiz: ['"I am hungry." → She said she ___ hungry.|was|is|were|Dia bilang dia lapar.', '"I will come." → He said he ___ come.|would|will|can|Dia bilang dia akan datang.', 'She ___ me that she was leaving.|told|said|asked|Dia memberi tahu saya bahwa dia akan pergi.', 'He ___ that he was tired.|said|told|asked to|Dia bilang dia lelah.', '"Where do you live?" → She asked me where I ___.|lived|do live|did I live|Dia bertanya di mana saya tinggal.', '"Are you OK?" → He asked ___ I was OK.|if|that|what|Dia bertanya apakah saya baik-baik saja.', '"Close the door." → She told me ___ the door.|to close|close|closing|Dia menyuruh saya menutup pintu.', '"I lost my wallet." → He said he ___ his wallet.|had lost|has lost|loses|Dia bilang dia kehilangan dompetnya.']
    },
    { id: 'f-t3', type: 'topic', cat: 'project', title: 'Rapat Proyek & Laporan Status', en: 'Project Meetings & Status Reports',
      phrases: ['Let\'s align on the priorities for this sprint.|Mari samakan prioritas untuk sprint ini.', 'What are the blockers?|Apa hambatannya?', 'We\'re waiting on approval from the client.|Kita menunggu persetujuan dari klien.', 'This is a quick win.|Ini hasil cepat yang mudah dicapai.', 'Can we push the launch back a week?|Bisakah peluncuran dimundurkan seminggu?', 'The scope has changed significantly.|Ruang lingkupnya berubah signifikan.', 'We need to manage expectations.|Kita perlu mengelola ekspektasi.', 'Who owns this action item?|Siapa penanggung jawab tugas ini?', 'Let\'s take this offline.|Mari bahas ini terpisah (di luar rapat).', 'I\'ll circulate the minutes after the meeting.|Saya akan mengedarkan notulen setelah rapat.', 'Overall, the project is in good shape.|Secara keseluruhan, proyek dalam kondisi baik.', 'We\'ve hit a few roadblocks, but we have a plan.|Ada beberapa hambatan, tapi kami punya rencana.'],
      dialog: ['A|Let\'s go round the table. Dina, what\'s the status on the mobile app?|Mari bergiliran. Dina, bagaimana status aplikasi seluler?', 'B|Overall it\'s in good shape. The login and payment features have been completed.|Secara keseluruhan baik. Fitur login dan pembayaran sudah selesai.', 'A|Great. Any blockers?|Bagus. Ada hambatan?', 'B|Just one. We\'re waiting on the API keys from the bank.|Satu saja. Kami menunggu kunci API dari bank.', 'C|I can chase that. I\'ll email their team today.|Saya bisa menindaklanjuti. Saya email tim mereka hari ini.', 'A|Thanks. If we don\'t get them by Thursday, the launch will be pushed back.|Terima kasih. Jika tidak dapat sampai Kamis, peluncuran mundur.', 'B|Understood. I\'ll keep everyone posted.|Dimengerti. Saya akan terus mengabari semua.', 'A|Perfect. I\'ll circulate the minutes after the meeting.|Sip. Saya edarkan notulennya setelah rapat.'],
      resp: ['Any blockers on your side?|Yes, we\'re still waiting on the design files.|Yes, I blocked him.|No, I\'m on my side.', 'Can we push the deadline back?|Possibly, but we\'d need the client\'s approval.|Yes, push it hard.|The deadline is back.', 'Who owns this action item?|I\'ll take it. I\'ll have it done by Friday.|It\'s my own item.|The item is owned.', 'This discussion is getting long.|Let\'s take it offline and continue after the meeting.|Let\'s go online.|Yes, it\'s long distance.'] },
    { id: 'f-g4', type: 'grammar', title: 'Klausa Relatif (who, which, that, where)', en: 'Relative Clauses',
      explain: '<p>Menggabungkan dua kalimat dengan kata <b>“yang”</b> atau <b>“tempat”</b>.</p><ul><li><b>who</b> = yang (orang): The man <b>who</b> called you is my boss.</li><li><b>which</b> = yang (benda/hewan): The car <b>which</b> I bought is red.</li><li><b>that</b> = yang (orang/benda, santai): The book <b>that</b> you lent me is great.</li><li><b>whose</b> = yang … -nya: The girl <b>whose</b> father is a pilot.</li><li><b>where</b> = tempat: This is the café <b>where</b> we first met.</li><li><b>when</b> = waktu: I remember the day <b>when</b> we met.</li></ul><p>Klausa tambahan (non-defining) diapit koma dan <b>tidak boleh</b> memakai “that”: My sister, <b>who</b> lives in Bali, is a chef.</p><p class="tip">Jika “yang” menjadi objek, kata relatif boleh dihilangkan: The film (that) we watched was good.</p>',
      pattern: ['Benda/orang + who/which/that + kata kerja …', 'Tempat + where + subjek + kata kerja', 'Orang + whose + benda …'],
      examples: ['The woman who works next door is a doctor.|Wanita yang bekerja di sebelah adalah dokter.', 'This is the laptop which I bought online.|Ini laptop yang saya beli online.', 'The project that we finished last month won an award.|Proyek yang kami selesaikan bulan lalu memenangkan penghargaan.', 'I have a friend whose brother is an actor.|Saya punya teman yang kakaknya aktor.', 'That\'s the hotel where we stayed.|Itu hotel tempat kami menginap.', 'My boss, who is very kind, gave me a day off.|Bos saya, yang sangat baik, memberi saya libur sehari.', 'Friday is the day when I feel happiest.|Jumat adalah hari ketika saya paling bahagia.'],
      quiz: ['The man ___ helped me was very kind.|who|which|where|Pria yang menolong saya sangat baik.', 'The phone ___ I bought is broken.|which|who|where|Ponsel yang saya beli rusak.', 'This is the restaurant ___ we had dinner.|where|which|who|Ini restoran tempat kami makan malam.', 'I know a girl ___ mother is a singer.|whose|who|which|Saya kenal gadis yang ibunya penyanyi.', 'My father, ___ is 60, still works.|who|that|which|Ayah saya, yang berumur 60, masih bekerja.', 'Do you remember the day ___ we met?|when|where|which|Ingat hari ketika kita bertemu?', 'The documents ___ you sent are complete.|that|who|where|Dokumen yang kamu kirim sudah lengkap.', 'She is the colleague ___ I told you about.|who|which|where|Dia rekan kerja yang saya ceritakan.']

      const keys = [...S.queue], sent = keys.map(k => S.items.get(k)).filter(Boolean);
      const snap = new Map(sent.map(i => [key(i), i.updated]));
      for (let i = 0; i < sent.length; i += 200) {
        const b = sent.slice(i, i + 200).map(({ id, kind, data, updated, deleted }) => ({ id, kind, data, updated, deleted }));
        const r = await rpc('en_put', { p_owner: S.user, p_pin: S.pin || null, p_items: b });
        if (!r?.ok) { needPin(r?.pin); return; }
      }
      for (const k of keys) if (S.items.get(k)?.updated === snap.get(k)) S.queue.delete(k);
      saveCache(); ping();
    }
    let rows;
    if (S.admin) {
      const r = await rpc('en_admin', { p_pass: S.pass, p_after: S.seq });
      if (!r?.ok) { logout(); return; }
      S.users = r.users || []; LS.set('admin.users', JSON.stringify(S.users)); rows = r.rows || [];
    } else { const r = await rpc('en_list', { p_owner: S.user, p_after: S.seq, p_pin: S.pin || null }); if (!r?.ok) { needPin(r?.pin); return; } rows = r.rows || []; }
    if (me !== cacheKey()) return;
    for (const r of rows) {
      const it = { id: r.id, owner: r.owner || S.user, kind: r.kind, data: r.data || {}, updated: Number(r.updated), deleted: !!r.deleted };
      const cur = S.items.get(key(it));
      if (!cur || (it.updated >= cur.updated && !S.queue.has(key(it)))) {
        if (!cur || JSON.stringify(cur) !== JSON.stringify(it)) changed = true;

}

let sb = null, chans = [];
async function liveStart() {
  try {
    if (!window.supabase) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    sb ||= window.supabase.createClient(SB_URL, SB_KEY);
    liveStop();
    const all = sb.channel('english-all');
    if (S.admin) all.on('broadcast', { event: 'chg' }, () => syncNow());
    chans.push(all.subscribe());
    if (!S.admin) chans.push(sb.channel('english-u-' + S.user).on('broadcast', { event: 'chg' }, () => syncNow()).subscribe());
  } catch {}
}
function liveStop() { if (sb) chans.forEach(c => sb.removeChannel(c)); chans = []; }
function ping() { for (const c of chans) try { c.send({ type: 'broadcast', event: 'chg', payload: { t: Date.now() } }); } catch {} }
const syncText = () => S.sync.err ? '⚠ ' + S.sync.err : S.sync.busy || S.queue.size ? '⏳ Menyimpan…' : S.sync.at ? '☁ Tersinkron ' + hms(S.sync.at) : '☁ Menghubungkan…';

const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(x => x.toString(16).padStart(2, '0')).join('');
const pinHash = (name, pin) => sha('planner-pin:' + name + ':' + pin);
const PIN_MSG = { need: 'Masukkan PIN.', wrong: 'PIN salah.', locked: 'Terlalu banyak PIN salah. Coba lagi 15 menit lagi.', format: 'PIN harus 4–12 angka.', invalid: 'Nama pengguna tidak valid.' };
function needPin(code) { // server says this session's PIN is missing/wrong: back to the PIN screen
  const name = S.user; if (!name) return;
  liveStop(); LS.set('u.' + name + '.haspin', '1'); SS.del('pin.' + name);
  S.user = null; S.pin = ''; S.items = new Map(); S.queue = new Set(); S.seq = 0; S.run = null;
  S.gate = { name, msg: code === 'locked' ? PIN_MSG.locked : 'Akun ini memakai PIN. Masukkan PIN untuk melanjutkan.' };

async function login(raw, pass, remember, pin) {
  const name = normUser(raw);
  if (!validUser(name)) throw new Error('Nama pengguna 3–32 karakter: huruf, angka, titik, garis bawah, atau tanda minus.');
  if (name === ADMIN) {
    if (!pass) throw new Error('Masukkan password Admin.');
    const r = await rpc('en_admin', { p_pass: pass, p_after: 0 }).catch(e => { throw new Error('Tidak bisa menghubungi server (' + e.message + ').'); });
    if (!r?.ok) throw new Error(r?.locked ? 'Terlalu banyak percobaan salah. Coba lagi 15 menit lagi.' : 'Password Admin salah.');
    S.admin = true; S.user = null; S.pass = pass; S.owner = '';
    S.items = new Map(); S.seq = 0; S.users = r.users || [];
    for (const x of r.rows || []) { const it = { id: x.id, owner: x.owner, kind: x.kind, data: x.data || {}, updated: Number(x.updated), deleted: !!x.deleted }; S.items.set(key(it), it); S.seq = Math.max(S.seq, Number(x.seq)); }
    saveCache(); LS.set('admin.users', JSON.stringify(S.users)); S.sync.at = new Date();
    SS.set('admin', pass); if (remember) LS.set('session', JSON.stringify({ admin: true })); else LS.del('session');
    go('users');
  } else {
    let r = null;
    try { r = await rpc('pl_login', { p_owner: name, p_pin: pin || null }); } catch (e) { // offline: unlock with the PIN checked on this device before
      const h = LS.get('u.' + name + '.pinhash');
      if (h) { if (!pin) { const er = new Error(PIN_MSG.need); er.needPin = true; throw er; } if (await pinHash(name, pin) !== h) throw new Error(PIN_MSG.wrong); }
      else if (LS.get('u.' + name + '.haspin')) throw new Error('Tidak bisa menghubungi server (' + e.message + ').');
    }
    if (r && !r.ok) { const er = new Error(PIN_MSG[r.pin] || 'Gagal masuk.'); er.needPin = r.pin === 'need'; throw er; }
    S.admin = false; S.user = name; S.pass = ''; S.pin = pin || ''; S.gate = null;
    if (r) { S.hasPin = !!r.pin; if (r.pin) { LS.set('u.' + name + '.haspin', '1'); LS.set('u.' + name + '.pinhash', await pinHash(name, pin)); } else { LS.del('u.' + name + '.haspin'); LS.del('u.' + name + '.pinhash'); } }
    else S.hasPin = !!pin;
    if (pin) SS.set('pin.' + name, pin);
    loadCache();
    if (remember) LS.set('session', JSON.stringify({ user: name })); else { LS.del('session'); SS.set('user', name); }
    setTimeout(syncNow, 0);
    if (route()[0] === 'users') go('');
  }
  liveStart();
}

  liveStop(); LS.del('session'); SS.del('admin'); SS.del('user'); if (S.user) SS.del('pin.' + S.user); S.pin = ''; S.gate = null; S.run = null;
  S.user = null; S.admin = false; S.pass = ''; S.items = new Map(); S.queue = new Set(); S.seq = 0; S.sync = { busy: false, again: false, at: null, err: '' };

// ---------- question builders ----------
const mc = (prompt, a, opts, extra = {}) => ({ t: 'mc', prompt, a, opts: shuffle([...new Set([a, ...opts])]), ...extra });
const others = (list, w, f, n = 3) => pick(list.filter(x => f(x) !== f(w)), n).map(f);

function vocabQs(W, pool = W, n = 12) {
  const ws = pick(W, Math.min(n, W.length)), out = [];
  ws.forEach((w, i) => {
    const kind = i % 6;

function nextSpeed() {

let tickT = null;
function tick() {
  clearInterval(tickT);
  tickT = setInterval(() => {
    const R = S.run; if (!R || R.kind !== 'speed') { clearInterval(tickT); return; }
    const left = Math.max(0, Math.ceil((R.end - Date.now()) / 1000));
    if (!left) { clearInterval(tickT); addXp(R.right); render(); return; }
    const el = $('#sp-left'); if (el) el.textContent = left;
    const b = $('.qbar .bar i'); if (b) b.style.width = (left / 60 * 100) + '%';
  }, 250);
}

  const t = norm(target).split(' ').filter(Boolean), h = norm(heard).split(' ').filter(Boolean), bag = [...h]; let hit = 0;
  for (const w of t) { const j = bag.indexOf(w); if (j >= 0) { hit++; bag.splice(j, 1); } }
  return Math.round(hit / Math.max(t.length, 1) * 100);
}

}

      <div class="ulist">${L.units.map(u => { const pr = prog(u.id, o); return `<a href="#u/${u.id}" class="urow"><span>${TYPES[u.type][0]}</span><span class="un2">${esc(u.title)}</span><span class="${pr?.done ? 'ok' : 'muted'}">${pr ? pr.best + '%' : '—'}${pr?.done ? ' ✓' : ''}</span></a>`; }).join('')}</div></div>`).join('')}</div>
    ${S.admin ? '' : `<h2 class="sh">Kata yang perlu diulang</h2><div class="card weak">${weakFirst(WORDS.filter(w => unlocked(w.level)), 18).map(w => `<span class="wchip">${spk(w.en, 'sm')}<b>${esc(w.en)}</b> <span class="muted">${esc(w.id)}</span></span>`).join('')}</div>
      <div class="center"><button class="btn primary" data-a="game" data-v="flash">🃏 Ulangi lewat Kartu Hafalan</button></div>`}`;
}
function usersView() {
  const rows = S.users.map(u => ({ u, p: overall(u.owner), d: doneCount(null, u.owner), w: mastered(u.owner), xp: stats(u.owner).xp || 0, t: Math.max(0, ...[...S.items.values()].filter(i => i.owner === u.owner).map(i => i.updated)) }));
  return `<div class="head"><h1>👥 Pengguna <span class="muted">${S.users.length}</span></h1></div><p class="muted small">Akun sama dengan Planner & Notes. Klik pengguna untuk melihat progresnya (hanya baca).</p>
    <div class="card" style="overflow-x:auto"><table class="users"><thead><tr><th>Pengguna</th><th class="num">Progres</th><th class="num">Materi lulus</th><th class="num">Kata</th><th class="num">XP</th><th>Terakhir belajar</th><th>PIN</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="click" data-a="seeuser" data-v="${esc(r.u.owner)}"><td><b>👤 ${esc(r.u.owner)}</b></td><td class="num">${r.p}%</td><td class="num">${r.d}/${UNITS.length}</td><td class="num">${r.w}</td><td class="num">${r.xp}</td><td class="muted">${r.t ? fullDT(r.t) : '—'}</td><td>${r.u.pin ? '🔒' : '<span class="muted">—</span>'}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">Belum ada yang belajar.</td></tr>'}
    </tbody></table></div>`;
}

// ---------- gate ----------
function gateView() {
  if (S.gate) { const n = S.gate.name; return `<div class="gate"><form class="gate-card" id="gate-form" autocomplete="off">
    <div class="logo">🔒</div><h1>English Course</h1><p class="gate-sub">👤 ${esc(n.slice(0, 4) + '*'.repeat(Math.max(0, n.length - 4)))}</p>
    <label class="gate-field"><span>🔑</span><input id="pin-in" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="PIN" autocomplete="off"></label>
    <label class="check"><input type="checkbox" id="remember" checked> Tetap masuk di perangkat ini</label>
    <button class="gate-btn" type="submit">Masuk</button>
    <div class="gate-err" id="gate-err" role="alert">${esc(S.gate.msg || '')}</div>
    <p class="gate-note"><a href="#" data-a="gateback" style="color:#fff">← Ganti nama pengguna</a></p>
  </form></div>`; }
  const adm = normUser($('#user-in')?.value) === ADMIN;
  return `<div class="gate"><form class="gate-card" id="gate-form" autocomplete="off">
    <div class="logo">En</div><h1>English Course</h1><p class="gate-sub">Belajar bahasa Inggris dari Dasar sampai Fasih</p>
    <label class="gate-field"><span>👤</span><span class="mask-wrap"><input id="user-in" name="user" type="text" placeholder="Nama pengguna" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="32" required value="${esc($('#user-in')?.value || '')}"><span id="user-mask" aria-hidden="true"></span></span></label>
    <label class="gate-field" id="pass-row" style="${adm ? '' : 'display:none'}"><span>🔑</span><input id="pass-in" type="password" inputmode="numeric" placeholder="Password Admin" autocomplete="off"></label>
    <label class="check"><input type="checkbox" id="remember" checked> Tetap masuk di perangkat ini</label>
    <button class="gate-btn" type="submit">Masuk</button>
    <div class="gate-err" id="gate-err" role="alert"></div>
    <p class="gate-note">Setiap nama pengguna memiliki progres sendiri. Nama & PIN sama dengan <a href="https://liemyo.github.io/planner/" style="color:#fff">Planner</a> dan <a href="https://liemyo.github.io/notes/" style="color:#fff">Notes</a>. Nama yang belum pernah dipakai akan membuat akun baru.</p>
  </form></div>`;
}
function syncMask() {
  const i = $('#user-in'), m = $('#user-mask'); if (!i || !m) return;
  const v = i.value; m.textContent = v.slice(0, 4) + '*'.repeat(Math.max(0, v.length - 4)); m.scrollLeft = i.scrollLeft;
  const pr = $('#pass-row'); if (pr) pr.style.display = normUser(v) === ADMIN ? '' : 'none';
}

// ---------- menu ----------
const dlg = () => $('#dlg');
function openMenu() {
  const theme = LS.get('theme') || 'auto';
  dlg().innerHTML = `<div class="dlg"><h2>${S.admin ? '🛡 Admin' : '👤 ' + esc(S.user)}</h2>
    <p class="muted small" style="margin:0">${syncText()} · versi ${BUILD}</p>
    <div class="fld"><span>Tampilan</span><div class="seg">${[['auto', 'Otomatis'], ['light', 'Terang'], ['dark', 'Gelap']].map(([v, l]) => `<label><input type="radio" name="theme" value="${v}"${theme === v ? ' checked' : ''}><span>${l}</span></label>`).join('')}</div></div>
    <div class="fld"><span>Suara</span><label class="check"><input type="checkbox" id="opt-autosay"${autoSay() ? ' checked' : ''}> Ucapkan otomatis saat latihan</label><label class="check"><input type="checkbox" id="opt-slow"${LS.get('slow') === '1' ? ' checked' : ''}> Suara lebih pelan</label>
      <button type="button" class="btn sm" data-a="say" data-t="Hello! Welcome to your English course.">🔊 Tes suara</button></div>
    ${S.admin ? '<p class="muted small" style="margin:0">Mode Admin hanya melihat progres semua pengguna, diperbarui real time.</p>' : `
    <div class="fld"><span>Level</span><label class="check"><input type="checkbox" id="opt-unlock"${LS.get('unlock') === '1' ? ' checked' : ''}> Buka semua level tanpa menunggu 60%</label></div>
    <div class="fld"><span>🔒 PIN masuk</span><p class="small" style="margin:0">${S.hasPin ? '✓ PIN aktif — diminta setiap kali masuk.' : 'Belum ada PIN. Pasang PIN agar progres tidak bisa dibuka hanya dengan nama pengguna.'} PIN ini sama dengan PIN Planner & Notes.</p>
      ${S.hasPin ? '<input type="password" id="pin-old" inputmode="numeric" maxlength="12" placeholder="PIN saat ini" autocomplete="off">' : ''}
      <div class="two"><input type="password" id="pin-new" inputmode="numeric" maxlength="12" placeholder="PIN baru (4–12 angka)" autocomplete="new-password"><input type="password" id="pin-new2" inputmode="numeric" maxlength="12" placeholder="Ulangi PIN baru" autocomplete="new-password"></div>
      <div class="dlg-f" style="justify-content:flex-start"><button type="button" class="btn primary" data-a="pinsave">${S.hasPin ? 'Ubah PIN' : 'Pasang PIN'}</button>${S.hasPin ? '<button type="button" class="btn danger" data-a="pinoff">Hapus PIN</button>' : ''}<span class="small" id="pin-msg" style="align-self:center;color:var(--red)"></span></div></div>
    <div class="fld"><span>Mulai ulang</span><button type="button" class="btn danger" data-a="reset" id="reset-btn">🗑 Hapus semua progres</button></div>`}
    <div class="dlg-f"><button type="button" class="btn danger" data-a="logout">Keluar</button><span class="sp"></span><button type="button" class="btn primary" data-a="close">Tutup</button></div></div>`;
  if (!dlg().open) dlg().showModal();
}
async function pinChange(old, nw, out) {
  out.textContent = 'Menyimpan…';
  try {
    const r = await rpc('pl_pin_set', { p_owner: S.user, p_old: old || S.pin || null, p_new: nw || null });
    if (!r?.ok) { out.textContent = r?.pin === 'wrong' || r?.pin === 'need' ? 'PIN saat ini salah.' : PIN_MSG[r?.pin] || 'Gagal.'; return; }
    S.pin = nw; S.hasPin = !!nw;
    if (nw) { SS.set('pin.' + S.user, nw); LS.set('u.' + S.user + '.haspin', '1'); LS.set('u.' + S.user + '.pinhash', await pinHash(S.user, nw)); }
    else { SS.del('pin.' + S.user); LS.del('u.' + S.user + '.haspin'); LS.del('u.' + S.user + '.pinhash'); }
    openMenu(); toast(nw ? 'PIN tersimpan ✓ — berlaku juga di Planner & Notes' : 'PIN dihapus.');
  } catch (e) { out.textContent = 'Tidak bisa menghubungi server (' + e.message + ').'; }
}
let toastT = null;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2500);
}
function applyTheme() { const t = LS.get('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

// ---------- actions ----------
const A = {
  go: el => go(el.dataset.v),
  menu: () => openMenu(),
  close: () => dlg().close(),
  logout: () => logout(),
  gateback: () => { S.gate = null; render(); },
  say: el => say(el.dataset.t),
  sayslow: el => say(el.dataset.t, true),
  lvl: el => { S.lvl = el.dataset.v; LS.set('lvl', S.lvl); if (route()[0] !== 'learn') go('learn'); else render(); },
  type: el => { S.type = el.dataset.v; S.cat = ''; render(); },
  cat: el => { S.cat = S.cat === el.dataset.v && route()[0] === 'learn' ? '' : el.dataset.v; S.type = 'all'; if (S.cat && !UNITS.some(u => u.level === S.lvl && u.cat === S.cat)) S.lvl = 'dasar'; if (route()[0] !== 'learn') go('learn'); else render(); },
  src: el => { S.src = el.dataset.v; LS.set('src', S.src); render(); },
  unlock: () => { LS.set('unlock', '1'); render(); toast('Semua level terbuka.'); },
  seeuser: el => { S.owner = el.dataset.v; go('prog'); },
  quiz: el => { const u = UMAP.get(el.dataset.v); startQuiz(`${TYPES[u.type][0]} ${u.title}`, unitQs(u), u.id); },
  flashunit: el => { const u = UMAP.get(el.dataset.v); startFlash(shuffle(u.W), '🃏 ' + u.title, u.id); },
  game: el => startGame(el.dataset.v),
  quit: () => { const R = S.run; S.run = null; clearInterval(tickT); try { R?.recog?.abort(); } catch {} window.speechSynthesis?.cancel(); render(); window.scrollTo(0, 0); },
  playdlg: el => { // reads the dialog line by line, highlighting each bubble
    const u = UMAP.get(el.dataset.v), sy = window.speechSynthesis; if (!sy) return; sy.cancel();
    u.DL.forEach((d, i) => { const ut = new SpeechSynthesisUtterance(d.en); ut.lang = 'en-US'; ut.rate = LS.get('slow') === '1' ? 0.7 : 0.95; const v = enVoice(); if (v) ut.voice = v; if (d.sp !== 'A') ut.pitch = 0.8;
      ut.onstart = () => { document.querySelectorAll('.bub.on').forEach(b => b.classList.remove('on')); const b = $('#dl-' + i); if (b) { b.classList.add('on'); b.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } };
      ut.onend = () => { if (i === u.DL.length - 1) $('#dl-' + i)?.classList.remove('on'); }; sy.speak(ut); });
  },
  ans: el => { const R = S.run, q = R.qs[R.i]; if (R.ans !== null) return; R.ans = Number(el.dataset.v); answer(q.opts[R.ans] === q.a, q); render(); $('#next-btn')?.focus(); },
  tok: el => { const q = S.run.qs[S.run.i]; q.sel.push(Number(el.dataset.v)); say(q.toks[Number(el.dataset.v)].t); render(); },
  untok: el => { const q = S.run.qs[S.run.i]; q.sel.splice(Number(el.dataset.v), 1); render(); },
  scrcheck: () => { const R = S.run, q = R.qs[R.i]; const got = q.sel.map(i => q.toks[i].t).join(' '); R.ans = norm(got) === norm(q.a); q.say = q.a; answer(R.ans, q); render(); $('#next-btn')?.focus(); },
  next: () => { const R = S.run; R.i++; R.ans = null; R.typed = ''; if (R.i >= R.qs.length) finishQuiz(); render(); window.scrollTo(0, 0); speakQ(); setTimeout(() => $('#type-in')?.focus(), 30); },
  flip: () => { S.run.flip = !S.run.flip; render(); if (S.run.flip && autoSay()) say(S.run.deck[S.run.i].ex); },
  fknow: () => flashNext(true), fagain: () => flashNext(false),
  spans: el => { const R = S.run, q = R.q, ok = q.opts[Number(el.dataset.v)] === q.a; R.total++; if (ok) R.right++; bumpWord(q.word, ok ? 1 : 0); R.flash = ok ? 'flash-ok' : 'flash-bad'; if (!ok) toast(`✗ ${q.a}`); nextSpeed(); render(); },
  matchnext: () => { newMatch(); render(); },
  mpick: el => {
    const R = S.run, m = R.m, side = el.dataset.v[0], k = el.dataset.v.slice(1); m.bad = null;
    if (side === 'L') { m.selL = k; say(m.left.find(w => w.k === k).en); } else m.selR = k;
    if (m.selL && m.selR) {
      const wl = m.left.find(w => w.k === m.selL), wr = m.right.find(w => w.k === m.selR);
      if (wl.k === wr.k || wl.id === wr.id) { m.done.add(wl.k); if (wr.k !== wl.k) m.done.add(wr.k); bumpWord(wl.k, 1); addXp(1); }
      else { m.miss++; m.bad = ['L' + m.selL, 'R' + m.selR]; setTimeout(() => { if (S.run?.m === m) { m.bad = null; render(); } }, 600); }
      m.selL = m.selR = null;
      if (m.done.size === m.left.length) addXp(5);
    }
    render();
  },
  hkey: el => {
    const h = S.run.h, c = el.dataset.v; h.tried.add(c);
    if (h.w.en.toLowerCase().includes(c)) h.got.add(c); else h.miss++;
    const win = [...h.w.en.toLowerCase()].every(x => x === ' ' || h.got.has(x));
    if (win) { S.run.won++; bumpWord(h.w.k, 1); addXp(3); say(h.w.en); }
    else if (h.miss >= 6) { h.over = true; S.run.lost++; bumpWord(h.w.k, -1); say(h.w.en); }
    render();
  },
  hangnext: () => { newHang(); render(); },
  rec: () => {
    const R = S.run; if (!SR || R.rec) return; window.speechSynthesis?.cancel();
    const r = new SR(); r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 3; R.recog = r; R.rec = true; R.err = ''; render();
    r.onresult = ev => { const e = R.list[R.i], alts = [...ev.results[0]].map(a => a.transcript); let bestA = alts[0], sc = 0; for (const a of alts) { const s = similarity(e.en, a); if (s > sc) { sc = s; bestA = a; } } R.heard = bestA; const was = R.res?.ok; R.res = { score: sc, ok: sc >= 75 }; if (R.res.ok && !was) { R.right++; addXp(3); } };
    r.onerror = ev => { R.err = ev.error === 'not-allowed' ? 'Izinkan akses mikrofon untuk bermain.' : ev.error === 'no-speech' ? 'Tidak terdengar suara. Coba lagi lebih dekat ke mikrofon.' : 'Pengenalan suara gagal (' + ev.error + ').'; };
    r.onend = () => { R.rec = false; if (S.run === R) render(); };
    try { r.start(); } catch { R.rec = false; render(); }
  },
  speaknext: () => { const R = S.run; R.i++; R.res = null; R.heard = ''; R.err = ''; render(); },
  pinsave: () => {
    const old = $('#pin-old')?.value || '', a = $('#pin-new').value, b = $('#pin-new2').value, out = $('#pin-msg');
    if (!/^\d{4,12}$/.test(a)) { out.textContent = PIN_MSG.format; return; }
    if (a !== b) { out.textContent = 'PIN baru tidak sama.'; return; }
    if (S.hasPin && !old) { out.textContent = 'Masukkan PIN saat ini.'; return; }
    pinChange(old, a, out);
  },
  pinoff: () => { const old = $('#pin-old')?.value || '', out = $('#pin-msg'); if (!old) { out.textContent = 'Masukkan PIN saat ini untuk menghapus.'; return; } pinChange(old, '', out); },
  reset: el => { // two clicks: no confirm()/prompt() dialogs
    if (!el.dataset.sure) { el.dataset.sure = '1'; el.textContent = '⚠ Yakin? Klik sekali lagi untuk menghapus'; setTimeout(() => { if (el.isConnected) { delete el.dataset.sure; el.textContent = '🗑 Hapus semua progres'; } }, 4000); return; }
    for (const it of [...S.items.values()]) if (it.owner === S.user && !it.deleted) put({ ...it, data: {}, deleted: true }, true);
    dlg().close(); render(); toast('Progres dihapus. Mulai dari 0%.');
  }
};
function flashNext(ok) {
  const R = S.run, w = R.deck[R.i];
  bumpWord(w.k, ok ? 1 : -1); if (ok) { R.know++; addXp(1); } else if (R.deck.length < 40) R.deck.push(w); // again later in this session
  R.i++; R.flip = false;
  if (R.i >= R.deck.length && R.unit) addXp(5);
  render(); if (R.i < R.deck.length && autoSay()) say(R.deck[R.i].en);
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el || !A[el.dataset.a] || el.disabled) return;
  ev.preventDefault(); ev.stopPropagation(); A[el.dataset.a](el);
});
document.addEventListener('input', ev => { if (ev.target.id === 'user-in') syncMask(); });
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.name === 'theme') { t.value === 'auto' ? LS.del('theme') : LS.set('theme', t.value); applyTheme(); }
  if (t.id === 'opt-autosay') t.checked ? LS.del('autosay') : LS.set('autosay', '0');
  if (t.id === 'opt-slow') t.checked ? LS.set('slow', '1') : LS.del('slow');
  if (t.id === 'opt-unlock') { t.checked ? LS.set('unlock', '1') : LS.del('unlock'); render(); }
});
document.addEventListener('keydown', ev => {
  const R = S.run; if (!R || dlg().open || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName);
  if (R.kind === 'quiz' && R.i < R.qs.length) {
    const q = R.qs[R.i];
    if (R.ans !== null && ev.key === 'Enter' && !typing) { ev.preventDefault(); A.next(); return; }
    if (q.t === 'mc' && R.ans === null && /^[1-4]$/.test(ev.key)) { const b = document.querySelectorAll('.opt')[Number(ev.key) - 1]; if (b) A.ans(b); }
  }
  if (R.kind === 'speed' && /^[1-4]$/.test(ev.key)) { const b = document.querySelectorAll('.opt')[Number(ev.key) - 1]; if (b) A.spans(b); }
  if (R.kind === 'hang' && !typing && /^[a-z]$/i.test(ev.key) && !R.h.over) { const b = document.querySelector(`.key[data-v="${ev.key.toLowerCase()}"]:not([disabled])`); if (b) A.hkey(b); }
  if (R.kind === 'flash' && !typing) { if (ev.key === ' ') { ev.preventDefault(); A.flip(); } else if (ev.key === 'ArrowRight') A.fknow(); else if (ev.key === 'ArrowLeft') A.fagain(); }
});
document.addEventListener('submit', ev => {
  const f = ev.target; ev.preventDefault();
  if (f.id === 'type-form') {
    const R = S.run, q = R.qs[R.i]; if (R.ans !== null) return;
    R.typed = $('#type-in').value; if (!R.typed.trim()) return;
    R.ans = norm(R.typed) === norm(q.a); answer(R.ans, q); render(); $('#next-btn')?.focus(); return;
  }
  if (f.id === 'gate-form') {
    const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Membuka…';
    const pinMode = !!S.gate, name = pinMode ? S.gate.name : $('#user-in').value, pin = pinMode ? $('#pin-in').value : '';
    if (pinMode && !pin) { btn.disabled = false; btn.textContent = 'Masuk'; $('#gate-err').textContent = PIN_MSG.need; return; }
    login(name, pinMode ? '' : $('#pass-in').value, $('#remember').checked, pin).then(render, e => {
      if (e.needPin && !pinMode) { S.gate = { name: normUser(name), msg: '' }; render(); return; }
      btn.disabled = false; btn.textContent = 'Masuk'; $('#gate-err').textContent = e.message; const pi = $('#pin-in'); if (pi) { pi.value = ''; pi.focus(); } });
  }
});
dlg().addEventListener('click', ev => { if (ev.target === dlg()) dlg().close(); }); // click on backdrop

// ---------- auto update + boot ----------
async function checkUpdate() { // phones keep old copies; load the newer build when not in the middle of an exercise
  if (dlg().open || S.queue.size || S.run) return;
  try {
    const r = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' }); const m = /const BUILD = '([^']+)'/.exec(await r.text());
    if (m && m[1] !== BUILD && m[1] !== '__BUILD__' && SS.get('reloaded') !== m[1]) { SS.set('reloaded', m[1]); location.replace(location.pathname + '?v=' + m[1] + location.hash); }
  } catch {}
}
setInterval(() => { if (!document.hidden) syncNow(); }, 10000);
setInterval(checkUpdate, 10 * 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(); });
window.addEventListener('online', () => syncNow());
window.addEventListener('focus', () => syncNow());

function boot() {
  applyTheme(); checkUpdate();
  let s = null; try { s = JSON.parse(LS.get('session') || 'null'); } catch {}
  const ssUser = SS.get('user'), ssAdmin = SS.get('admin');
  if (s?.admin || ssAdmin) {
    if (ssAdmin) { S.admin = true; S.pass = ssAdmin; loadCache(); render(); liveStart(); syncNow(); return; }
    LS.del('session'); // admin password is never stored on the device; ask again
  } else if (s?.user || ssUser) {
    const name = s?.user || ssUser, pin = SS.get('pin.' + name) || '';
    if (LS.get('u.' + name + '.haspin') && !pin) { S.gate = { name, msg: '' }; render(); return; } // PIN asked on every new visit
    S.user = name; S.pin = pin; S.hasPin = !!LS.get('u.' + name + '.haspin'); loadCache();
    render(); liveStart(); syncNow(); return;
  }
  render();
}
boot();
</script>
</body>
