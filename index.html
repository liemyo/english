<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* phones + small tablets: whole app at 88% (layout widens to fill the screen); max-scale stops iOS zooming into inputs */
if (Math.min(screen.width, screen.height) <= 820) document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=0.88, minimum-scale=0.88, maximum-scale=0.88, viewport-fit=cover';</script>
<title>English Course</title>
<meta name="description" content="English Course: kursus bahasa Inggris dengan terjemahan Indonesia. Level Dasar, Umum, Fasih, dan jalur Teknik Sipil; kosakata, tata bahasa, percakapan, bacaan, latihan, dan modul PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<meta name="theme-color" content="#24489c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2324489c'/><text x='50' y='66' font-family='Arial' font-weight='700' font-size='46' fill='white' text-anchor='middle'>En</text></svg>">
<style>:root{--bg:#f6f7f9;--card:#fff;--soft:#eef0f4;--line:#e3e6eb;--text:#151a23;--muted:#667085;--acc:#24489c;--acc-soft:#e9eef9;--acc-ink:#fff;--ok:#1b7f4b;--okbg:#e8f5ee;--red:#c23b3b;--redbg:#fbecec;--shadow:0 1px 2px rgba(16,24,40,.04);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101318;--card:#171b22;--soft:#20252e;--line:#2a303a;--text:#e9ecf1;--muted:#98a1b0;--acc:#8aa6e8;--acc-soft:#1e2738;--acc-ink:#0d1424;--ok:#5cc88f;--okbg:#14291e;--red:#f07a7a;--redbg:#331a1a;--shadow:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#101318;--card:#171b22;--soft:#20252e;--line:#2a303a;--text:#e9ecf1;--muted:#98a1b0;--acc:#8aa6e8;--acc-soft:#1e2738;--acc-ink:#0d1424;--ok:#5cc88f;--okbg:#14291e;--red:#f07a7a;--redbg:#331a1a;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:650;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-width:0;color:var(--text)}
input:focus{outline:2px solid color-mix(in srgb,var(--acc) 35%,transparent);border-color:var(--acc)}
a{color:inherit}
.ic{flex:none;display:block}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:550;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.3}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.big{padding:12px 18px;font-size:15.5px}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:6px;background:var(--acc-soft);color:var(--acc)}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1560px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;text-decoration:none;flex:none}
.logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);font-size:13px;font-weight:700}
.tabs{display:flex;gap:2px;flex:1;justify-content:center}
.tab{border:0;background:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:550;color:var(--muted);display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab.on{color:var(--acc);background:var(--acc-soft)}
.tabs .ti{display:none}
.bnav{display:none}
.top-r{display:flex;align-items:center;gap:12px;flex:none}
.pill{font-weight:650;font-size:13px;padding:3px 9px;border-radius:6px;background:var(--acc-soft);color:var(--acc)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}.sync.err{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px 5px 11px;cursor:pointer;font-weight:550;font-size:13px;white-space:nowrap}
.main{max-width:1560px;margin:0 auto;padding:20px 24px 40px}
.viewing{margin-bottom:16px;padding:8px 12px;border-radius:8px;background:var(--acc-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.head h1,.hero h1,.u-t h1{margin:0;font-size:24px}
.sh{font-size:15px;margin:30px 0 12px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
/* home */
.hero{display:flex;gap:28px;align-items:center;padding:24px 28px}
.hero-ring{flex:none}
.hero-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.hero-t p{margin:0}
.next{display:flex;align-items:center;gap:16px;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.next>div{display:flex;flex-direction:column;min-width:0}.next b{font-size:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column}
.stat b{font-size:22px;font-weight:650;letter-spacing:-.02em}.stat b small{font-size:13px;color:var(--muted);font-weight:500}.stat span{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.lvl{text-align:left;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.lvl:hover,.catb:hover,.gtile:hover:not(:disabled),.ucard:hover,.pdfb:hover{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.lvl.locked{opacity:.6}
.lvl p{margin:8px 0 2px;color:var(--muted)}
.lvl-h{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.lvl-n{font-size:17px}
.lvl-p{margin-left:auto;font-weight:650;font-size:16px;color:var(--acc)}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.catb{display:flex;flex-direction:column;gap:2px;padding:12px 14px;cursor:pointer;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.games.mini{grid-template-columns:repeat(3,minmax(0,1fr))}
.gtile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;cursor:pointer;text-align:left}
.gtile:disabled{opacity:.5;cursor:not-allowed}
.how ol{margin:0;padding:4px 22px 16px 40px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.how{margin-top:16px}.how summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between}
.how summary::-webkit-details-marker{display:none}.how summary::after{content:'';width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0}
.how[open] summary::after{transform:rotate(-135deg);margin-top:4px}
/* home dashboard: everything on one screen — levels left, practice right */
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
.dash .sh{margin:18px 0 10px}.dash-r>.sh:first-child{margin-top:0}
.dash .hero{padding:18px 22px;gap:22px}.dash .next{padding-top:10px;margin-top:2px}
.dash .stats{margin-top:12px}.dash .stat{padding:10px 14px}
.dash .lvl{padding:14px 16px}.dash .lvl p{margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dash .lvl .bar{margin:8px 0 4px}
.dash-r .cats{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-r .catb{padding:9px 12px}
.dash-r .games.mini{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-r .gtile{padding:11px 13px}
@media (max-width:1100px){.dash{grid-template-columns:1fr}.dash-r>.sh:first-child{margin-top:18px}.dash-r .cats,.dash-r .games.mini{grid-template-columns:repeat(3,minmax(0,1fr))}}
.how b{color:var(--text);font-weight:600}
/* learn */
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:10px}
.seg4 button{border:0;background:none;padding:9px 6px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg4 button.on{background:var(--card);box-shadow:0 1px 3px rgba(16,24,40,.08);color:var(--text)}
.seg4 small{font-weight:500;margin-left:4px}
.lvl-d{margin:12px 2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.chipb{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:5px 11px;font-size:13.5px;cursor:pointer;font-weight:550;color:var(--muted)}
.chipb.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.chipb:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.grid.dim{opacity:.55}
.ucard{text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.ucard.done{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.uc-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:550}
.uc-n{font-variant-numeric:tabular-nums;font-weight:650;color:var(--acc)}
.uc-title{font-size:15.5px;margin-top:4px;font-weight:600}
.ok{color:var(--ok);font-weight:650;margin-left:auto}
.lockbox{padding:14px 16px;margin-bottom:14px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* unit */
.u-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:8px}
.u-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.u-s{display:flex;flex-direction:column;align-items:flex-end}.u-s b{font-size:22px;color:var(--acc)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin-top:16px}
.word{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.w-h{display:flex;align-items:center;gap:8px}
.w-en{font-size:17px;font-weight:600}
.dots{margin-left:auto;display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}.dots i.on{background:var(--acc);border-color:var(--acc)}
.flash .dots{margin:0}
.w-id{font-weight:550;color:var(--acc)}
.w-ex{display:flex;gap:6px;align-items:flex-start;font-size:13.5px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.spk{border:0;background:var(--acc-soft);color:var(--acc);border-radius:50%;width:30px;height:30px;flex:none;cursor:pointer;display:inline-grid;place-items:center;padding:0}
.spk:hover{filter:brightness(.96)}
.spk.sm{width:24px;height:24px}
.spk.xl{width:64px;height:64px}
.prose{padding:6px 22px 14px;line-height:1.7;text-align:justify;hyphens:auto}
.prose ul{padding-left:20px}.prose li{margin:3px 0}
.prose .tip{background:var(--soft);border-left:3px solid var(--acc);padding:10px 14px;border-radius:0 8px 8px 0}
.prose .gt{border-collapse:collapse;width:100%;max-width:560px}
.prose .gt th,.prose .gt td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.prose .gt th{background:var(--soft)}
.reading{padding-top:14px}.reading p{margin:0 0 14px}
.trn{display:block;color:var(--muted);font-style:italic;margin-top:4px;font-size:14px}
.gloss{padding:6px 0;display:grid;grid-template-columns:1fr 1fr}
.gloss>div{display:flex;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.gloss>div:nth-child(-n+2){border-top:0}
.gloss .muted{margin-left:auto;text-align:right}
.pat{padding:12px;display:flex;flex-direction:column;gap:8px}
.pat code{background:var(--soft);padding:8px 12px;border-radius:6px;font:500 14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:normal}
.list{padding:4px 0}
.list .row{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.two-col{display:grid;grid-template-columns:1fr 1fr}
.two-col .row:nth-child(2){border-top:0}
.dlgbox{padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{display:flex;gap:8px;max-width:80%;align-items:flex-start}
.bub>div{background:var(--soft);padding:9px 12px;border-radius:10px;transition:box-shadow .2s}
.bub.r{align-self:flex-end;flex-direction:row-reverse}
.bub.r>div{background:var(--acc-soft)}
.bub.on>div{box-shadow:0 0 0 2px var(--acc)}
.bub .sp{width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:650;font-size:12px;flex:none}
.bub .spk{margin-right:6px;vertical-align:middle;display:inline-grid}
.u-act{position:sticky;bottom:12px;margin-top:20px;display:flex;align-items:center;gap:10px;padding:10px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(16,24,40,.08)}
.u-nav{flex:1;display:flex}.u-nav.r{justify-content:flex-end}
.u-mid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* runner */
.main.running{max-width:760px}
.run-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:8px}
.run-h>b{font-size:16px;text-align:center}.run-h>span{justify-self:end;font-size:14px}.run-h .btn{justify-self:start}
.qbar{margin-bottom:12px}
.qcard{padding:24px;display:flex;flex-direction:column;gap:16px;min-height:300px}
.qp{font-size:18px;text-align:center;line-height:1.55}
.qp b{font-weight:600}
.ctx{background:var(--soft);border-radius:8px;padding:8px 14px;font-size:14px;text-align:justify}
.ctx summary{cursor:pointer;font-weight:550;color:var(--acc)}
.ctx p{margin:8px 0}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;font-size:15.5px;font-weight:500;cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center}
.opts.two .opt{justify-content:center}
.okey{width:24px;height:24px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:650;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
.opt.fade{opacity:.5}
.big-spk{display:flex;justify-content:center;align-items:center;gap:12px}
.typef{display:flex;gap:10px}
.typef input{flex:1;font-size:17px;padding:11px 14px}
.fb{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fb.right{background:var(--okbg)}.fb.wrong{background:var(--redbg)}
.fb.right>b{color:var(--ok)}.fb.wrong>b{color:var(--red)}
.fb-say{display:flex;gap:6px;align-items:center}
.fb .btn{align-self:stretch;margin-top:6px}
.scr-ans{min-height:64px;border:1.5px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.scr-ans.right{border-color:var(--ok);background:var(--okbg)}.scr-ans.wrong{border-color:var(--red);background:var(--redbg)}
.scr-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-size:15.5px;font-weight:550;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.tok.used{visibility:hidden}
.flash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:250px;width:100%;cursor:pointer;padding:24px;text-align:center}
.flash.back{background:var(--acc-soft)}
.f-big{font-size:32px;letter-spacing:-.02em;font-weight:650}
.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;width:100%}
.center>.spk{margin:12px auto 0}
.flash-ok{box-shadow:0 0 0 2px var(--ok)}.flash-bad{box-shadow:0 0 0 2px var(--red)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match>div{display:flex;flex-direction:column;gap:8px}
.mcell{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:13px 10px;font-weight:550;font-size:15px;cursor:pointer;min-height:54px}
.mcell.sel{border-color:var(--acc);background:var(--acc-soft)}
.mcell.done{opacity:.35;border-color:var(--ok);background:var(--okbg)}
.mcell.bad{border-color:var(--red);background:var(--redbg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.lives{font-size:13px;color:var(--muted)}
.hword{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:26px;font-weight:650;text-transform:lowercase}
.hl{width:28px;border-bottom:2px solid var(--text);text-align:center;min-height:40px}
.hword .sp{width:16px}
.kb{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.key{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:9px 0;font-weight:600;font-size:15px;cursor:pointer;text-transform:uppercase}
.key.hit{background:var(--okbg);border-color:var(--ok)}.key.miss{background:var(--redbg);opacity:.6}
.say-big{font-size:21px;display:flex;gap:10px;align-items:center;justify-content:center}
.mic{margin:0 auto}.mic.on{background:var(--red);border-color:var(--red);color:#fff}
.result{padding:28px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.result h2{margin:6px 0 0}.result p{margin:0}
.res-act{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
/* pdf */
.pdfcard{padding:18px 20px;margin-top:16px}
.pdf-h h2{margin:0 0 4px;font-size:17px}.pdf-h p{margin:0}
.pdf-levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.pdfb{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:8px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.pdfb .ic{grid-row:1/3;grid-column:2;color:var(--acc)}
.pdfb.all{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
.pdfb.busy,.btn.busy{opacity:.55;pointer-events:none}
/* progress */
.ranks{display:flex;gap:6px;flex-wrap:wrap}
.ranks span{padding:3px 9px;border-radius:6px;background:var(--soft);font-size:13px;color:var(--muted);font-weight:550}
.ranks span.on{background:var(--acc-soft);color:var(--acc)}
.acts{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;padding:14px;height:140px}
.act{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.act i{display:block;width:100%;max-width:24px;background:var(--acc);border-radius:4px 4px 1px 1px;min-height:2px}
.act small{color:var(--muted);font-size:11px}
.lvp{padding:16px 18px;display:flex;flex-direction:column}
.ulist{display:flex;flex-direction:column;margin-top:8px}
.urow{display:flex;gap:10px;padding:6px 2px;border-top:1px solid var(--line);text-decoration:none;font-size:14px;align-items:baseline}
.urow .ut{width:84px;flex:none;font-size:12px;color:var(--muted)}
.urow .un2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weak{padding:12px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.wchip{display:inline-flex;gap:6px;align-items:center;background:var(--soft);border-radius:8px;padding:3px 12px 3px 4px;font-size:14px}
.users{width:100%;border-collapse:collapse}
.users th,.users td{padding:9px 12px;border-top:1px solid var(--line);text-align:left;font-size:14px;white-space:nowrap}
.users th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.users tr.click{cursor:pointer}.users tr.click:hover td{background:var(--soft)}
.num{text-align:right!important}
/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(500px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--card);color:var(--text);box-shadow:0 24px 64px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(10,12,18,.4)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>span{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fld .btn{align-self:flex-start}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;border:1px solid var(--line);border-radius:8px;padding:7px;cursor:pointer;font-weight:550}
.seg input:checked+span{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlg-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dlg-f .sp{flex:1}
.check{display:flex;align-items:center;gap:8px;font-weight:550}
.check input{width:17px;height:17px;accent-color:var(--acc)}
.sh .check{font-size:13px;color:var(--muted);font-weight:500}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;font-weight:550;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}
/* gate */
.gate{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--bg)}
.gate-card{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 28px 26px;text-align:center;box-shadow:0 12px 40px rgba(16,24,40,.08)}
.gate .logo{width:52px;height:52px;border-radius:12px;font-size:19px;margin:0 auto 14px}
.gate h1{margin:0;font-size:23px}
.gate-sub{margin:6px 0 22px;color:var(--muted);font-size:14px}
.gate-field{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px 14px;text-align:left;margin-bottom:10px}
.gate-field>span:first-child{font-size:12px;font-weight:600;color:var(--muted);width:40px;flex:none}
.gate-field:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.gate-field input{flex:1;background:none;border:0;outline:0!important;color:var(--text);font-size:16px;padding:10px 0}
.mask-wrap{position:relative;flex:1;display:block;min-width:0}
.mask-wrap input,#user-mask{font:500 16px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;padding:10px 0}
.mask-wrap input{width:100%;-webkit-text-fill-color:transparent;color:transparent;caret-color:var(--text)}
.mask-wrap input::placeholder{-webkit-text-fill-color:var(--muted);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:0}
#user-mask{position:absolute;inset:0;pointer-events:none;color:var(--text);white-space:pre;overflow:hidden}
.gate-btn{width:100%;margin-top:4px;padding:11px;font-size:15.5px;font-weight:600;border-radius:10px;background:var(--acc);border:0;color:var(--acc-ink);cursor:pointer}
.gate-btn:disabled{opacity:.7}
.gate-err{color:var(--red);min-height:18px;margin-top:10px;font-size:14px}
.gate-note{color:var(--muted);font-size:12.5px;margin:6px 0 0;line-height:1.55}
.gate-note a{color:var(--acc)}
.gate .check{justify-content:center;color:var(--muted);font-weight:500;font-size:14px;margin:4px 0 12px}
@media (max-width:980px){.pdf-levels{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){
  .top-in{gap:10px;padding:8px 14px}

  .next{flex-direction:column;align-items:stretch;text-align:left}
  .stats{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .cats{grid-template-columns:1fr 1fr}
  .games,.games.mini{grid-template-columns:1fr 1fr}
  /* phone home: compact rows so the dashboard fits one screen */
  .dash{gap:0}.dash .sh{margin:12px 0 7px;font-size:14px}
  .dash .hero{flex-direction:row;text-align:left;gap:12px;padding:12px 14px}.dash .hero .ring{width:64px;height:64px}
  .dash .hero h1{font-size:18px}.dash .hero-t{gap:3px}.dash .hero-t>p{font-size:12.5px;line-height:1.35}
  .dash .next{flex-direction:row;align-items:center;gap:8px;padding-top:7px}.dash .next b{font-size:14px}.dash .next .btn{padding:6px 10px;font-size:13px}
  .dash .stats{grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.dash .stat{padding:7px 8px;border-radius:10px}.dash .stat b{font-size:16px}.dash .stat span{font-size:10.5px;line-height:1.2}
  .dash .grid2{grid-template-columns:1fr 1fr;gap:8px}.dash .lvl{padding:10px 11px}.dash .lvl-h{margin-bottom:2px}.dash .lvl-n{font-size:15px}.dash .lvl p,.dash .lvl>span:last-child{display:none}.dash .lvl .bar{margin:6px 0 0}
  .dash-r>.sh:first-child{margin-top:12px}.dash-r .cats,.dash-r .games.mini{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .dash-r .catb,.dash-r .gtile{padding:7px 9px;border-radius:9px}.dash-r .catb b,.dash-r .gtile b{font-size:13px;line-height:1.25}.dash-r .catb .small{font-size:11px}
  .dash .how{margin-top:10px}.dash .how summary{padding:9px 12px;font-size:14px}
  .gtile{padding:12px}.games.mini .gtile .small{display:none}
  .grid,.words{grid-template-columns:1fr}
  .seg4{grid-template-columns:1fr 1fr}
  .two-col,.gloss{grid-template-columns:1fr}.two-col .row:nth-child(2),.gloss>div:nth-child(2){border-top:1px solid var(--line)}
  .prose{padding:4px 16px 12px;text-align:left}
  .bub{max-width:94%}
  .u-head{flex-wrap:wrap;gap:10px}.u-t{order:3;flex-basis:100%}.u-s{margin-left:auto}
  .u-act{bottom:calc(66px + env(safe-area-inset-bottom));padding:8px;gap:6px}
  .hide-s{display:none}
  .opts.two{grid-template-columns:1fr 1fr}
  .qcard{padding:16px;min-height:0}
  .qp{font-size:16.5px}
  .match{gap:8px}.mcell{font-size:14px;padding:10px 6px}
  .kb{grid-template-columns:repeat(7,1fr)}
  .acts{gap:3px;padding:10px}
  .two{grid-template-columns:1fr}
  .pdf-levels{grid-template-columns:1fr 1fr}
  .toast{bottom:90px}
}
@media (max-width:380px){.u-mid .btn{padding:8px 10px}}

    { id: 'd-g1', type: 'grammar', title: 'To Be: am / is / are', en: 'The verb "to be"',
      explain: '<p><b>To be</b> artinya “adalah / berada / sedang”. Dipakai untuk menyebut <b>identitas, sifat, umur, tempat, dan perasaan</b>. Bahasa Indonesia sering tidak memakai kata “adalah”, tetapi bahasa Inggris <b>wajib</b> memakai am/is/are.</p><ul><li><b>I</b> → am</li><li><b>He / She / It</b> / satu orang/benda → is</li><li><b>You / We / They</b> / jamak → are</li></ul><p>Negatif: tambahkan <b>not</b> (I am not, she is not = isn\'t, they are not = aren\'t). Tanya: balik posisinya (<b>Are you</b> tired?).</p><p class="tip">Salah: “I happy.” Benar: “I <b>am</b> happy.”</p>',

      examples: ['I am a student.|Saya seorang pelajar.', 'She is very smart.|Dia sangat pintar.', 'We are at home.|Kami ada di rumah.', 'They are not busy today.|Mereka tidak sibuk hari ini.', 'Is he your brother?|Apakah dia saudaramu?', 'It is cold outside.|Di luar dingin.', 'You are late.|Kamu terlambat.'],

      dialog: ['A|Hi! Good morning.|Hai! Selamat pagi.', 'B|Good morning! How are you?|Selamat pagi! Apa kabar?', 'A|I\'m fine, thanks. I\'m Rina. What\'s your name?|Baik, terima kasih. Saya Rina. Siapa namamu?', 'B|I\'m David. Nice to meet you, Rina.|Saya David. Senang bertemu denganmu, Rina.', 'A|Nice to meet you too. Where are you from?|Senang bertemu juga. Kamu dari mana?', 'B|I\'m from Australia. And you?|Saya dari Australia. Kamu?', 'A|I\'m from Jakarta. Welcome to Indonesia!|Saya dari Jakarta. Selamat datang di Indonesia!', 'B|Thank you! See you later.|Terima kasih! Sampai jumpa.'],
      resp: ['How are you?|I\'m good, thanks. And you?|I\'m 25 years old.|Yes, I am a teacher.', 'Nice to meet you.|Nice to meet you too.|You\'re welcome.|Good night.', 'Where are you from?|I\'m from Medan.|I\'m a nurse.|I\'m fine.', 'Thank you very much!|You\'re welcome.|Nice to meet you.|See you.'] },
    { id: 'd-v2', type: 'vocab', title: 'Kata Kerja Sehari-hari', en: 'Everyday Verbs', words: [

    { id: 'd-g2', type: 'grammar', title: 'Simple Present (kebiasaan)', en: 'Simple Present Tense',

      dialog: ['A|Hello! Can I help you?|Halo! Ada yang bisa dibantu?', 'B|Yes, how much is this T-shirt?|Ya, berapa harga kaus ini?', 'A|It\'s 150,000 rupiah.|Harganya 150.000 rupiah.', 'B|Do you have it in a medium size?|Ada ukuran M?', 'A|Yes, here you are. The fitting room is over there.|Ada, ini dia. Ruang gantinya di sana.', 'B|It fits well. I\'ll take it. Can I pay by card?|Pas. Saya ambil. Bisa bayar pakai kartu?', 'A|Sure. Here is your receipt.|Tentu. Ini struk Anda.', 'B|Thank you!|Terima kasih!'],

    { id: 'd-v3', type: 'vocab', title: 'Rumah, Waktu & Hari', en: 'Home, Time & Days', words: [

      'room|kamar / ruangan|My room is on the second floor.|Kamar saya di lantai dua.',

    { id: 'd-g3', type: 'grammar', title: 'A / An / The & Bentuk Jamak', en: 'Articles & Plurals',
      explain: '<p>Bahasa Inggris membedakan benda <b>tunggal</b> dan <b>jamak</b>, dan memakai kata sandang.</p><ul><li><b>a</b> + kata berbunyi konsonan: a book, a car, a <b>u</b>niversity (bunyi “yu”).</li><li><b>an</b> + kata berbunyi vokal: an apple, an egg, an <b>h</b>our (h tidak dibaca).</li><li><b>the</b> = benda tertentu / sudah disebut / hanya satu: the sun, the book on the table.</li></ul><p><b>Jamak:</b> + s (books), + es setelah s, sh, ch, x (boxes, watches), y → ies (city → cities). Tidak beraturan: man → men, woman → women, child → children, person → people, foot → feet, tooth → teeth.</p><p class="tip">Bahasa Indonesia mengulang kata (buku-buku); bahasa Inggris cukup <b>-s</b>: “two books”, bukan “two book”.</p>',
      pattern: ['a/an + benda tunggal', 'the + benda tertentu', 'angka/many/some + benda jamak (-s/-es)'],
      examples: ['I have a car and an umbrella.|Saya punya sebuah mobil dan sebuah payung.', 'The car is red.|Mobil itu berwarna merah.', 'She eats an apple every day.|Dia makan apel setiap hari.', 'There are three children in the room.|Ada tiga anak di ruangan itu.', 'I need two boxes.|Saya butuh dua kotak.', 'Many people live in big cities.|Banyak orang tinggal di kota besar.', 'Please close the door.|Tolong tutup pintunya.'],

    { id: 'd-g4', type: 'grammar', title: 'Kata Ganti & Kepemilikan', en: 'Pronouns & Possessives',
      explain: '<p>Kata ganti berubah sesuai fungsinya di kalimat.</p><table class="gt"><tr><th>Subjek</th><th>Objek</th><th>Milik (+benda)</th><th>Milik (sendiri)</th></tr><tr><td>I</td><td>me</td><td>my</td><td>mine</td></tr><tr><td>you</td><td>you</td><td>your</td><td>yours</td></tr><tr><td>he</td><td>him</td><td>his</td><td>his</td></tr><tr><td>she</td><td>her</td><td>her</td><td>hers</td></tr><tr><td>it</td><td>it</td><td>its</td><td>—</td></tr><tr><td>we</td><td>us</td><td>our</td><td>ours</td></tr><tr><td>they</td><td>them</td><td>their</td><td>theirs</td></tr></table><p>Kepemilikan benda/orang: <b>\'s</b> → Budi\'s car (mobil Budi), my mother\'s house.</p><p class="tip">Bahasa Indonesia “dia” bisa laki-laki atau perempuan; bahasa Inggris harus memilih <b>he</b> (laki-laki) atau <b>she</b> (perempuan).</p>',

    { id: 'd-g5', type: 'grammar', title: 'There is / There are & Preposisi Tempat', en: 'There is/are & Prepositions of Place',
      explain: '<p><b>There is</b> (tunggal) / <b>There are</b> (jamak) artinya “<b>ada</b>”.</p><ul><li>There is a bank near my house. (Ada sebuah bank dekat rumahku.)</li><li>There are two cats on the sofa.</li><li>Tanya: <b>Is there</b> …? / <b>Are there</b> …? Negatif: There isn\'t / There aren\'t.</li></ul><p><b>Preposisi tempat:</b> in (di dalam), on (di atas, menempel), under (di bawah), next to (di sebelah), between (di antara), behind (di belakang), in front of (di depan), near (dekat), opposite (di seberang).</p><p class="tip">Jangan pakai “have” untuk “ada”: Salah: “In my room have a TV.” Benar: “<b>There is</b> a TV in my room.”</p>',

    { id: 'd-g6', type: 'grammar', title: 'Kata Tanya (WH Questions)', en: 'Question Words',
      explain: '<p>Kata tanya diletakkan di <b>awal</b> kalimat.</p><ul><li><b>What</b> = apa · <b>Who</b> = siapa · <b>Where</b> = di mana · <b>When</b> = kapan</li><li><b>Why</b> = mengapa · <b>How</b> = bagaimana · <b>Which</b> = yang mana · <b>Whose</b> = milik siapa</li><li><b>How much</b> = berapa (harga/tak terhitung) · <b>How many</b> = berapa banyak (terhitung) · <b>How old</b> = berapa umur · <b>How long</b> = berapa lama</li></ul><p>Pola: <b>Kata tanya + am/is/are + subjek</b>? (Where is the hotel?) atau <b>Kata tanya + do/does + subjek + kata kerja</b>? (Where do you live?)</p><p class="tip">Salah: “Where you live?” Benar: “Where <b>do</b> you live?”</p>',

    { id: 'u-g2', type: 'grammar', title: 'Present & Past Continuous', en: 'Continuous Tenses',
      explain: '<p><b>Present continuous</b> = sedang terjadi <b>sekarang</b> atau rencana pasti dekat: <b>am/is/are + kata kerja-ing</b>.</p><ul><li>I am working now. She is cooking. They are coming tomorrow (rencana).</li></ul><p><b>Past continuous</b> = sedang berlangsung di suatu waktu di masa lalu, sering terpotong kejadian lain: <b>was/were + -ing</b>.</p><ul><li>I was sleeping when you called. (Saya sedang tidur ketika kamu menelepon.)</li><li>While we were eating, it started to rain.</li></ul><p>Kata kerja “keadaan” biasanya tidak memakai -ing: know, like, want, need, understand, believe.</p><p class="tip">Salah: “I am knowing him.” Benar: “I <b>know</b> him.”</p>',
      pattern: ['Subjek + am/is/are + V-ing', 'Subjek + was/were + V-ing', 'Was/were + V-ing … when + simple past'],
      examples: ['I am studying English right now.|Saya sedang belajar bahasa Inggris sekarang.', 'She is talking to a customer.|Dia sedang berbicara dengan pelanggan.', 'We are meeting the client tomorrow.|Kami akan bertemu klien besok.', 'What are you doing?|Kamu sedang apa?', 'I was driving when the phone rang.|Saya sedang menyetir ketika ponsel berbunyi.', 'They were watching TV at 9 p.m.|Mereka sedang menonton TV jam 9 malam.', 'While she was cooking, he was cleaning.|Selagi dia memasak, dia (pria) membersihkan.'],
      quiz: ['Look! It ___ raining.|is|was|are|Lihat! Sedang hujan.', 'I ___ working at the moment.|am|is|was|Saya sedang bekerja saat ini.', 'They ___ playing football when it started to rain.|were|was|are|Mereka sedang main bola ketika mulai hujan.', 'What ___ you doing now?|are|is|were|Kamu sedang apa sekarang?', 'I was sleeping when you ___.|called|were calling|call|Saya sedang tidur ketika kamu menelepon.', 'She ___ dinner at 7 last night.|was cooking|is cooking|cooks|Dia sedang memasak makan malam jam 7 tadi malam.', 'I ___ the answer.|know|am knowing|knowing|Saya tahu jawabannya.', 'We ___ the manager tomorrow at 10.|are meeting|were meeting|meeting|Kami bertemu manajer besok jam 10.']
    },
    { id: 'u-t2', type: 'topic', cat: 'work', title: 'Rapat & Email Kerja', en: 'Meetings & Work Emails',
      phrases: ['Let\'s get started.|Mari kita mulai.', 'The purpose of this meeting is…|Tujuan rapat ini adalah…', 'Could you give us an update?|Bisa berikan kabar terbaru?', 'I\'d like to add something.|Saya ingin menambahkan sesuatu.', 'I see your point, but…|Saya paham maksudmu, tetapi…', 'Could you clarify that?|Bisa diperjelas?', 'Let\'s move on to the next item.|Mari lanjut ke poin berikutnya.', 'I\'m writing to follow up on…|Saya menulis untuk menindaklanjuti…', 'Please find the attached file.|Terlampir file yang dimaksud.', 'Please let me know if you have any questions.|Kabari saya jika ada pertanyaan.', 'I look forward to hearing from you.|Saya menantikan kabar dari Anda.', 'Best regards,|Salam hormat,'],
      dialog: ['A|Good morning, everyone. Let\'s get started.|Selamat pagi semua. Mari kita mulai.', 'A|The purpose of this meeting is to review last month\'s sales.|Tujuan rapat ini meninjau penjualan bulan lalu.', 'B|Sales increased by ten percent, mainly online.|Penjualan naik sepuluh persen, terutama online.', 'C|I\'d like to add something. Our costs also went up.|Saya ingin menambahkan. Biaya kita juga naik.', 'A|Good point. Could you send us the details?|Poin bagus. Bisa kirimkan rinciannya?', 'C|Sure, I\'ll email them after the meeting.|Tentu, akan saya email setelah rapat.', 'A|Great. Let\'s move on to the next item.|Bagus. Mari lanjut ke poin berikutnya.'],
      resp: ['Could you give us an update on the project?|Sure. We\'ve finished phase one and started phase two.|Yes, I give.|Update is good.', 'Do you have any questions?|Just one. When is the deadline?|No, I\'m fine thanks, and you?|Yes, I am questions.', 'I think we should cut the budget.|I see your point, but that might affect quality.|You\'re welcome.|I am cutting.', 'Could you clarify that?|Of course. I mean we need two more designers.|Yes, it\'s clear water.|No, I couldn\'t.'] },

    { id: 'u-g3', type: 'grammar', title: 'Masa Depan: Will & Going to', en: 'Future: will & going to',
      explain: '<p><b>Will</b> + kata kerja dasar → keputusan <b>spontan</b>, janji, tawaran, prediksi umum.</p><ul><li>The phone is ringing. I\'ll answer it. (spontan)</li><li>I will help you. (janji/tawaran)</li></ul><p><b>Be going to</b> + kata kerja dasar → <b>rencana</b> yang sudah dipikirkan, atau prediksi dengan bukti.</p><ul><li>I\'m going to visit Japan next year. (rencana)</li><li>Look at those clouds. It\'s going to rain. (ada bukti)</li></ul><p>Negatif: will not = <b>won\'t</b>; I\'m not going to…</p><p class="tip">Salah: “I will to go.” Benar: “I will <b>go</b>.”</p>',
      pattern: ['Subjek + will / won\'t + kata kerja dasar', 'Subjek + am/is/are + going to + kata kerja dasar'],
      examples: ['I\'ll call you tonight.|Saya akan meneleponmu nanti malam.', 'Don\'t worry, I won\'t tell anyone.|Jangan khawatir, saya tidak akan memberi tahu siapa pun.', 'We\'re going to move to a new office.|Kami akan pindah ke kantor baru.', 'She\'s going to start a business.|Dia berencana memulai bisnis.', 'It\'s going to rain soon.|Sebentar lagi akan hujan.', 'Will you come to the meeting?|Apakah kamu akan datang ke rapat?', 'I think the price will go up.|Saya rasa harganya akan naik.'],
      quiz: ['I\'m tired. I think I ___ go to bed.|will|am going|going|Saya lelah. Sepertinya saya akan tidur.', 'We ___ going to buy a house next year.|are|will|is|Kami berencana membeli rumah tahun depan.', 'Look at the sky! It\'s ___ rain.|going to|will to|going|Lihat langit! Akan hujan.', 'Don\'t worry. I ___ forget.|won\'t|don\'t|am not|Jangan khawatir. Saya tidak akan lupa.', '___ you help me with this box?|Will|Are|Going|Maukah kamu membantuku dengan kotak ini?', 'She is going to ___ a new job.|start|starts|started|Dia akan memulai pekerjaan baru.', 'The bags look heavy. I ___ carry one for you.|\'ll|\'m going|am|Tasnya kelihatan berat. Saya bawakan satu.', 'They will ___ tomorrow.|arrive|arriving|arrives|Mereka akan tiba besok.']
    },
    { id: 'u-t3', type: 'topic', cat: 'travel', title: 'Hotel & Restoran', en: 'Hotel & Restaurant',

      dialog: ['A|Good evening. Welcome to Sunrise Hotel.|Selamat malam. Selamat datang di Hotel Sunrise.', 'B|Hi, I have a reservation under the name Hendra.|Hai, saya punya reservasi atas nama Hendra.', 'A|Yes, a double room for three nights. May I see your ID?|Ya, kamar double untuk tiga malam. Boleh lihat identitas Anda?', 'B|Here you go. Is breakfast included?|Ini. Apakah termasuk sarapan?', 'A|Yes, breakfast is from 6 to 10 on the second floor.|Ya, sarapan jam 6 sampai 10 di lantai dua.', 'B|Great. And what time is check-out?|Bagus. Jam berapa check-out?', 'A|Check-out is at noon. Here is your key card. Enjoy your stay!|Check-out jam 12 siang. Ini kartu kunci Anda. Selamat menikmati!'],

    { id: 'u-g4', type: 'grammar', title: 'Present Perfect (pengalaman & hasil)', en: 'Present Perfect',
      explain: '<p><b>have/has + kata kerja-3</b> (past participle). Dipakai untuk:</p><ul><li><b>Pengalaman</b> (tanpa waktu spesifik): I have been to Japan. Have you ever eaten durian?</li><li><b>Hasil yang masih terasa sekarang</b>: I have lost my key. (sekarang masih hilang)</li><li><b>Sejak … sampai sekarang</b>: I have lived here <b>for</b> 5 years / <b>since</b> 2019.</li><li>Dengan <b>already, yet, just</b>: I have already finished. Have you finished yet? She has just left.</li></ul><p>V3 tak beraturan: go → gone/been, see → seen, eat → eaten, do → done, write → written, take → taken.</p><p class="tip">Jika ada waktu spesifik lampau (yesterday, in 2020) pakai <b>simple past</b>: Salah: “I have seen him yesterday.” Benar: “I <b>saw</b> him yesterday.”</p>',
      pattern: ['Subjek + have/has + V3', 'Have/Has + subjek + (ever) + V3?', '… for + durasi / since + titik waktu'],
      examples: ['I have visited Bali three times.|Saya sudah tiga kali ke Bali.', 'She has worked here since 2020.|Dia bekerja di sini sejak 2020.', 'We have known each other for ten years.|Kami saling kenal selama sepuluh tahun.', 'Have you ever tried sushi?|Pernahkah kamu mencoba sushi?', 'I haven\'t finished the report yet.|Saya belum menyelesaikan laporannya.', 'He has just arrived.|Dia baru saja tiba.', 'They have already paid.|Mereka sudah membayar.'],
      quiz: ['I have ___ this movie before.|seen|saw|see|Saya pernah menonton film ini.', 'She ___ lived in Bandung for five years.|has|have|is|Dia sudah tinggal di Bandung lima tahun.', 'Have you ___ been to Singapore?|ever|yet|since|Pernahkah kamu ke Singapura?', 'We have worked here ___ 2018.|since|for|from|Kami bekerja di sini sejak 2018.', 'I have known her ___ ten years.|for|since|during|Saya kenal dia selama sepuluh tahun.', 'I ___ him yesterday.|saw|have seen|seen|Saya melihatnya kemarin.', 'Have you finished ___?|yet|already|since|Sudah selesai?', 'He has just ___ the office.|left|leave|leaved|Dia baru saja meninggalkan kantor.']
    },
    { id: 'u-t4', type: 'topic', cat: 'project', title: 'Proyek: Progres & Masalah', en: 'Project: Progress & Problems',
      phrases: ['We\'re on track.|Kita sesuai jadwal.', 'We\'re behind schedule.|Kita terlambat dari jadwal.', 'We\'ve completed 70% of the work.|Kita sudah menyelesaikan 70% pekerjaan.', 'There\'s a problem with the supplier.|Ada masalah dengan pemasok.', 'What\'s the main issue?|Apa masalah utamanya?', 'We need to fix this as soon as possible.|Kita harus memperbaiki ini secepatnya.', 'Who will handle this?|Siapa yang akan menangani ini?', 'Can we extend the deadline?|Bisakah tenggatnya diperpanjang?', 'Let\'s set up a quick call.|Ayo atur panggilan singkat.', 'I\'ll keep you posted.|Saya akan terus mengabari.', 'The budget is tight.|Anggarannya ketat.', 'That\'s a good solution.|Itu solusi yang bagus.'],
      dialog: ['A|Hi Rudi, how is the website project going?|Hai Rudi, bagaimana proyek situs webnya?', 'B|We\'ve completed about 70%, but we\'re a little behind schedule.|Sudah sekitar 70%, tapi kita agak terlambat.', 'A|What\'s the main issue?|Apa masalah utamanya?', 'B|The client changed the design twice, so we lost a week.|Klien mengubah desain dua kali, jadi kita kehilangan seminggu.', 'A|I see. Can we still finish by the 30th?|Begitu. Masih bisa selesai tanggal 30?', 'B|If we add one more developer, yes.|Kalau kita tambah satu developer lagi, bisa.', 'A|OK, I\'ll talk to HR today. Keep me posted.|Oke, saya bicara ke HRD hari ini. Terus kabari ya.'],
      resp: ['How is the project going?|It\'s going well. We\'re on track.|It goes to the office.|I\'m project.', 'We\'re behind schedule.|What happened? How can I help?|Congratulations!|Nice to meet you.', 'Can you handle this task?|Yes, I\'ll take care of it.|Yes, I handle it yesterday.|No, it\'s a handle.', 'Please keep me posted.|Will do. I\'ll update you tomorrow.|Yes, I post it.|You\'re welcome.'] },
    { id: 'u-g5', type: 'grammar', title: 'Perbandingan (Comparative & Superlative)', en: 'Comparatives & Superlatives',
      explain: '<p>Untuk <b>membandingkan</b> dua hal (lebih …) dan <b>paling</b> (ter-…).</p><ul><li>Kata pendek: + <b>-er than</b> / <b>the …-est</b>: cheap → cheaper than → the cheapest; big → bigger → the biggest; easy → easier → the easiest.</li><li>Kata panjang (2+ suku kata): <b>more … than</b> / <b>the most …</b>: expensive → more expensive → the most expensive.</li><li>Tidak beraturan: good → <b>better</b> → <b>the best</b>; bad → <b>worse</b> → <b>the worst</b>; far → farther → the farthest.</li><li>Sama: <b>as … as</b>: She is as tall as her mother.</li></ul><p class="tip">Salah: “more cheaper”. Benar: “cheaper”. Salah: “the most best”. Benar: “the best”.</p>',
      pattern: ['A + is + adj-er / more adj + than + B', 'A + is + the adj-est / the most adj + (in/of …)', 'A + is + as adj as + B'],
      examples: ['This phone is cheaper than that one.|Ponsel ini lebih murah daripada yang itu.', 'Jakarta is bigger than Bandung.|Jakarta lebih besar daripada Bandung.', 'Gold is more expensive than silver.|Emas lebih mahal daripada perak.', 'This is the best restaurant in town.|Ini restoran terbaik di kota.', 'Today is the hottest day of the year.|Hari ini hari terpanas dalam setahun.', 'My English is better than last year.|Bahasa Inggris saya lebih baik dari tahun lalu.', 'He is as tall as his father.|Dia setinggi ayahnya.'],
      quiz: ['A car is ___ than a bike.|faster|more fast|fastest|Mobil lebih cepat daripada sepeda.', 'This hotel is ___ expensive than that one.|more|most|much|Hotel ini lebih mahal daripada yang itu.', 'She is the ___ student in the class.|smartest|smarter|most smart|Dia murid terpintar di kelas.', 'This is the ___ movie I\'ve ever seen.|best|better|goodest|Ini film terbaik yang pernah saya tonton.', 'Today is ___ than yesterday.|hotter|hoter|more hot|Hari ini lebih panas daripada kemarin.', 'The traffic is ___ today than yesterday.|worse|badder|worst|Lalu lintas hari ini lebih buruk daripada kemarin.', 'He is as ___ as his brother.|tall|taller|tallest|Dia setinggi saudaranya.', 'Bali is one of the ___ beautiful islands.|most|more|best|Bali salah satu pulau terindah.']

    { id: 'u-g6', type: 'grammar', title: 'Modal: can, should, must, have to', en: 'Modal Verbs',
      explain: '<p>Modal + <b>kata kerja dasar</b> (tanpa to, tanpa -s).</p><ul><li><b>can / can\'t</b> = bisa (kemampuan, izin): I can swim. Can I sit here?</li><li><b>could</b> = bisa (lampau) / permintaan sopan: Could you help me?</li><li><b>should / shouldn\'t</b> = sebaiknya (saran): You should rest.</li><li><b>must / mustn\'t</b> = harus (aturan kuat) / dilarang: You mustn\'t smoke here.</li><li><b>have to / has to</b> = harus (keharusan dari luar): I have to work on Saturday. <b>don\'t have to</b> = tidak perlu.</li><li><b>may / might</b> = mungkin: It might rain.</li></ul><p class="tip">Salah: “She cans speak.” Benar: “She <b>can</b> speak.” &nbsp; Salah: “You should to go.” Benar: “You should <b>go</b>.” Ingat: <b>mustn\'t</b> (dilarang) ≠ <b>don\'t have to</b> (tidak wajib).</p>',
      pattern: ['Subjek + modal + kata kerja dasar', 'Modal + subjek + kata kerja dasar?', 'Subjek + have/has to + kata kerja dasar'],
      examples: ['I can speak a little English.|Saya bisa sedikit berbahasa Inggris.', 'Could you open the window, please?|Bisakah Anda membuka jendela?', 'You should drink more water.|Kamu sebaiknya minum lebih banyak air.', 'Passengers must wear seat belts.|Penumpang harus memakai sabuk pengaman.', 'You mustn\'t park here.|Kamu dilarang parkir di sini.', 'I have to finish this today.|Saya harus menyelesaikan ini hari ini.', 'You don\'t have to pay. It\'s free.|Kamu tidak perlu bayar. Ini gratis.', 'It might rain this afternoon.|Mungkin akan hujan sore ini.'],
      quiz: ['She ___ speak three languages.|can|cans|can to|Dia bisa berbicara tiga bahasa.', 'You look tired. You ___ rest.|should|must to|can to|Kamu kelihatan lelah. Sebaiknya istirahat.', '___ you help me, please?|Could|Should|Must|Bisakah kamu membantuku?', 'You ___ smoke in the hospital.|mustn\'t|don\'t have to|shouldn\'t to|Dilarang merokok di rumah sakit.', 'It\'s free. You ___ pay.|don\'t have to|mustn\'t|can\'t to|Gratis. Kamu tidak perlu bayar.', 'He ___ wake up early tomorrow.|has to|have to|must to|Dia harus bangun pagi besok.', 'I ___ swim when I was five.|could|can|should|Saya bisa berenang ketika umur lima.', 'Take an umbrella. It ___ rain.|might|must|has|Bawa payung. Mungkin hujan.']

    { id: 'f-g1', type: 'grammar', title: 'Kalimat Pengandaian (Conditionals)', en: 'Conditionals 0–3',
      explain: '<p>Kalimat “jika …” punya beberapa tipe:</p><ul><li><b>Zero</b> (fakta umum): If + present, present. <i>If you heat ice, it melts.</i></li><li><b>First</b> (mungkin terjadi): If + present, <b>will</b> + V. <i>If it rains, I will stay home.</i></li><li><b>Second</b> (khayalan sekarang/tidak nyata): If + <b>past</b>, <b>would</b> + V. <i>If I had more money, I would travel the world.</i> (Pakai <b>were</b> untuk semua subjek: If I were you…)</li><li><b>Third</b> (penyesalan masa lalu): If + <b>had + V3</b>, <b>would have + V3</b>. <i>If I had studied, I would have passed.</i></li></ul><p>Juga: <b>unless</b> = kecuali jika; <b>I wish</b> + past = berharap (keadaan sekarang tidak sesuai).</p><p class="tip">Salah: “If I will see him, I will tell him.” Benar: “If I <b>see</b> him, I will tell him.” (Tidak ada <b>will</b> setelah <i>if</i>.)</p>',
      pattern: ['If + present, will + V (nyata)', 'If + past, would + V (khayalan)', 'If + had V3, would have V3 (masa lalu)'],
      examples: ['If you mix red and blue, you get purple.|Jika mencampur merah dan biru, kamu dapat ungu.', 'If it rains tomorrow, we will cancel the trip.|Jika besok hujan, kami akan membatalkan perjalanan.', 'If I were you, I would accept the offer.|Kalau aku jadi kamu, aku akan terima tawarannya.', 'If I had a car, I would drive to work.|Seandainya saya punya mobil, saya akan menyetir ke kantor.', 'If we had left earlier, we wouldn\'t have missed the flight.|Seandainya kita berangkat lebih awal, kita tidak akan ketinggalan pesawat.', 'Unless you hurry, you\'ll be late.|Kalau tidak cepat, kamu akan terlambat.', 'I wish I spoke English fluently.|Saya berharap bisa berbahasa Inggris dengan fasih.'],
      quiz: ['If it ___ tomorrow, we will stay home.|rains|will rain|rained|Jika besok hujan, kita di rumah saja.', 'If I ___ rich, I would buy a big house.|were|am|will be|Seandainya saya kaya, saya akan beli rumah besar.', 'If you heat water to 100°C, it ___.|boils|would boil|boiled|Jika air dipanaskan sampai 100°C, air mendidih.', 'If I had studied harder, I ___ passed the exam.|would have|will have|would|Seandainya saya belajar lebih giat, saya akan lulus.', 'If I were you, I ___ talk to the manager.|would|will|am|Kalau aku jadi kamu, aku akan bicara ke manajer.', '___ you leave now, you will miss the bus.|Unless|If|When|Kecuali kamu berangkat sekarang, kamu akan ketinggalan bus.', 'I wish I ___ more free time.|had|have|will have|Saya berharap punya lebih banyak waktu luang.', 'If she ___ the email, she would have replied.|had seen|saw|has seen|Seandainya dia melihat emailnya, dia pasti membalas.']

    { id: 'f-g2', type: 'grammar', title: 'Kalimat Pasif (Passive Voice)', en: 'Passive Voice',
      explain: '<p>Kalimat pasif fokus pada <b>apa yang dikenai</b> tindakan, bukan pelakunya. Mirip “di-” dalam bahasa Indonesia.</p><p>Rumus: <b>be (sesuai tense) + V3</b> (+ by …).</p><ul><li>Present: The office <b>is cleaned</b> every day. (Kantor dibersihkan setiap hari.)</li><li>Past: The bridge <b>was built</b> in 1990.</li><li>Present perfect: The email <b>has been sent</b>.</li><li>Future: The results <b>will be announced</b> tomorrow.</li><li>Continuous: The road <b>is being repaired</b>.</li><li>Modal: It <b>must be done</b> today.</li></ul><p class="tip">Bahasa Inggris profesional sering memakai pasif: “Your order <b>has been shipped</b>.” “Mistakes <b>were made</b>.”</p>',
      pattern: ['Objek + is/are + V3', 'Objek + was/were + V3', 'Objek + has/have been + V3', 'Objek + will be / must be + V3'],
      examples: ['English is spoken all over the world.|Bahasa Inggris dipakai di seluruh dunia.', 'This house was built in 1985.|Rumah ini dibangun tahun 1985.', 'Your package has been delivered.|Paket Anda sudah diantar.', 'The meeting will be held on Monday.|Rapat akan diadakan hari Senin.', 'The road is being repaired.|Jalannya sedang diperbaiki.', 'The report must be submitted by Friday.|Laporannya harus diserahkan paling lambat Jumat.', 'I was given a second chance.|Saya diberi kesempatan kedua.'],
      quiz: ['The letter ___ sent yesterday.|was|is|were|Surat itu dikirim kemarin.', 'English ___ spoken in many countries.|is|was being|are|Bahasa Inggris dipakai di banyak negara.', 'The project ___ been completed.|has|have|was|Proyek itu sudah selesai dikerjakan.', 'The winners will be ___ tomorrow.|announced|announce|announcing|Pemenang akan diumumkan besok.', 'The road is ___ repaired right now.|being|been|be|Jalannya sedang diperbaiki sekarang.', 'This bridge was built ___ a Dutch company.|by|from|with|Jembatan ini dibangun oleh perusahaan Belanda.', 'The form must ___ signed.|be|been|being|Formulirnya harus ditandatangani.', 'Many houses ___ destroyed by the flood.|were|was|are being|Banyak rumah hancur oleh banjir.']

    { id: 'f-g3', type: 'grammar', title: 'Kalimat Tidak Langsung (Reported Speech)', en: 'Reported Speech',
      explain: '<p>Untuk menyampaikan ulang perkataan orang lain. Biasanya tense <b>mundur satu langkah</b>:</p><ul><li>present → past: “I <b>am</b> tired.” → She said (that) she <b>was</b> tired.</li><li>past / present perfect → past perfect: “I <b>lost</b> my key.” → He said he <b>had lost</b> his key.</li><li>will → <b>would</b>, can → <b>could</b>, must → <b>had to</b>.</li><li>Kata keterangan berubah: today → that day, tomorrow → the next day, here → there.</li></ul><p><b>Pertanyaan</b>: susunan jadi seperti kalimat biasa: “Where do you live?” → She asked me <b>where I lived</b>. Ya/tidak → <b>if/whether</b>: He asked <b>if I was</b> ready.</p><p><b>Perintah</b>: told/asked + <b>to</b> + V: “Close the door.” → He told me <b>to close</b> the door.</p><p class="tip"><b>say</b> tanpa orang: She said that…; <b>tell</b> + orang: She told <b>me</b> that…</p>',
      pattern: ['Subjek + said (that) + tense mundur', 'Subjek + told + orang + (that) …', 'Subjek + asked + (orang) + if/WH + subjek + kata kerja', 'Subjek + told/asked + orang + to + V'],
      examples: ['"I\'m busy." → She said she was busy.|"Saya sibuk." → Dia bilang dia sibuk.', '"I will call you." → He said he would call me.|"Saya akan meneleponmu." → Dia bilang akan menelepon saya.', '"We can help." → They said they could help.|"Kami bisa bantu." → Mereka bilang bisa membantu.', '"Where do you work?" → She asked me where I worked.|"Kamu kerja di mana?" → Dia bertanya di mana saya bekerja.', '"Are you ready?" → He asked if I was ready.|"Kamu siap?" → Dia bertanya apakah saya siap.', '"Please wait here." → She asked me to wait there.|"Tolong tunggu di sini." → Dia meminta saya menunggu di sana.', 'He told me that the meeting had been cancelled.|Dia memberi tahu saya bahwa rapat sudah dibatalkan.'],
      quiz: ['"I am hungry." → She said she ___ hungry.|was|is|were|Dia bilang dia lapar.', '"I will come." → He said he ___ come.|would|will|can|Dia bilang dia akan datang.', 'She ___ me that she was leaving.|told|said|asked|Dia memberi tahu saya bahwa dia akan pergi.', 'He ___ that he was tired.|said|told|asked to|Dia bilang dia lelah.', '"Where do you live?" → She asked me where I ___.|lived|do live|did I live|Dia bertanya di mana saya tinggal.', '"Are you OK?" → He asked ___ I was OK.|if|that|what|Dia bertanya apakah saya baik-baik saja.', '"Close the door." → She told me ___ the door.|to close|close|closing|Dia menyuruh saya menutup pintu.', '"I lost my wallet." → He said he ___ his wallet.|had lost|has lost|loses|Dia bilang dia kehilangan dompetnya.']
    },
    { id: 'f-t3', type: 'topic', cat: 'project', title: 'Rapat Proyek & Laporan Status', en: 'Project Meetings & Status Reports',
      phrases: ['Let\'s align on the priorities for this sprint.|Mari samakan prioritas untuk sprint ini.', 'What are the blockers?|Apa hambatannya?', 'We\'re waiting on approval from the client.|Kita menunggu persetujuan dari klien.', 'This is a quick win.|Ini hasil cepat yang mudah dicapai.', 'Can we push the launch back a week?|Bisakah peluncuran dimundurkan seminggu?', 'The scope has changed significantly.|Ruang lingkupnya berubah signifikan.', 'We need to manage expectations.|Kita perlu mengelola ekspektasi.', 'Who owns this action item?|Siapa penanggung jawab tugas ini?', 'Let\'s take this offline.|Mari bahas ini terpisah (di luar rapat).', 'I\'ll circulate the minutes after the meeting.|Saya akan mengedarkan notulen setelah rapat.', 'Overall, the project is in good shape.|Secara keseluruhan, proyek dalam kondisi baik.', 'We\'ve hit a few roadblocks, but we have a plan.|Ada beberapa hambatan, tapi kami punya rencana.'],
      dialog: ['A|Let\'s go round the table. Dina, what\'s the status on the mobile app?|Mari bergiliran. Dina, bagaimana status aplikasi seluler?', 'B|Overall it\'s in good shape. The login and payment features have been completed.|Secara keseluruhan baik. Fitur login dan pembayaran sudah selesai.', 'A|Great. Any blockers?|Bagus. Ada hambatan?', 'B|Just one. We\'re waiting on the API keys from the bank.|Satu saja. Kami menunggu kunci API dari bank.', 'C|I can chase that. I\'ll email their team today.|Saya bisa menindaklanjuti. Saya email tim mereka hari ini.', 'A|Thanks. If we don\'t get them by Thursday, the launch will be pushed back.|Terima kasih. Jika tidak dapat sampai Kamis, peluncuran mundur.', 'B|Understood. I\'ll keep everyone posted.|Dimengerti. Saya akan terus mengabari semua.', 'A|Perfect. I\'ll circulate the minutes after the meeting.|Sip. Saya edarkan notulennya setelah rapat.'],
      resp: ['Any blockers on your side?|Yes, we\'re still waiting on the design files.|Yes, I blocked him.|No, I\'m on my side.', 'Can we push the deadline back?|Possibly, but we\'d need the client\'s approval.|Yes, push it hard.|The deadline is back.', 'Who owns this action item?|I\'ll take it. I\'ll have it done by Friday.|It\'s my own item.|The item is owned.', 'This discussion is getting long.|Let\'s take it offline and continue after the meeting.|Let\'s go online.|Yes, it\'s long distance.'] },
    { id: 'f-g4', type: 'grammar', title: 'Klausa Relatif (who, which, that, where)', en: 'Relative Clauses',
      explain: '<p>Menggabungkan dua kalimat dengan kata <b>“yang”</b> atau <b>“tempat”</b>.</p><ul><li><b>who</b> = yang (orang): The man <b>who</b> called you is my boss.</li><li><b>which</b> = yang (benda/hewan): The car <b>which</b> I bought is red.</li><li><b>that</b> = yang (orang/benda, santai): The book <b>that</b> you lent me is great.</li><li><b>whose</b> = yang … -nya: The girl <b>whose</b> father is a pilot.</li><li><b>where</b> = tempat: This is the café <b>where</b> we first met.</li><li><b>when</b> = waktu: I remember the day <b>when</b> we met.</li></ul><p>Klausa tambahan (non-defining) diapit koma dan <b>tidak boleh</b> memakai “that”: My sister, <b>who</b> lives in Bali, is a chef.</p><p class="tip">Jika “yang” menjadi objek, kata relatif boleh dihilangkan: The film (that) we watched was good.</p>',
      pattern: ['Benda/orang + who/which/that + kata kerja …', 'Tempat + where + subjek + kata kerja', 'Orang + whose + benda …'],
      examples: ['The woman who works next door is a doctor.|Wanita yang bekerja di sebelah adalah dokter.', 'This is the laptop which I bought online.|Ini laptop yang saya beli online.', 'The project that we finished last month won an award.|Proyek yang kami selesaikan bulan lalu memenangkan penghargaan.', 'I have a friend whose brother is an actor.|Saya punya teman yang kakaknya aktor.', 'That\'s the hotel where we stayed.|Itu hotel tempat kami menginap.', 'My boss, who is very kind, gave me a day off.|Bos saya, yang sangat baik, memberi saya libur sehari.', 'Friday is the day when I feel happiest.|Jumat adalah hari ketika saya paling bahagia.'],
      quiz: ['The man ___ helped me was very kind.|who|which|where|Pria yang menolong saya sangat baik.', 'The phone ___ I bought is broken.|which|who|where|Ponsel yang saya beli rusak.', 'This is the restaurant ___ we had dinner.|where|which|who|Ini restoran tempat kami makan malam.', 'I know a girl ___ mother is a singer.|whose|who|which|Saya kenal gadis yang ibunya penyanyi.', 'My father, ___ is 60, still works.|who|that|which|Ayah saya, yang berumur 60, masih bekerja.', 'Do you remember the day ___ we met?|when|where|which|Ingat hari ketika kita bertemu?', 'The documents ___ you sent are complete.|that|who|where|Dokumen yang kamu kirim sudah lengkap.', 'She is the colleague ___ I told you about.|who|which|where|Dia rekan kerja yang saya ceritakan.']
    },

    { id: 'f-g5', type: 'grammar', title: 'Gerund & To-Infinitive', en: 'Gerunds vs Infinitives',
      explain: '<p>Setelah kata kerja tertentu, kata kerja berikutnya berbentuk <b>-ing</b> (gerund) atau <b>to + V</b> (infinitive).</p><ul><li><b>+ -ing</b>: enjoy, finish, avoid, mind, suggest, keep, consider, practice, miss, can\'t stand. <i>I enjoy <b>reading</b>.</i></li><li><b>+ to V</b>: want, need, decide, plan, hope, agree, promise, refuse, learn, would like. <i>I want <b>to learn</b>.</i></li><li>Setelah <b>preposisi</b> selalu -ing: interested <b>in learning</b>, good <b>at speaking</b>, look forward <b>to meeting</b>.</li><li>Arti berbeda: <b>stop smoking</b> (berhenti merokok) vs <b>stop to smoke</b> (berhenti untuk merokok); <b>remember to lock</b> (ingat untuk mengunci) vs <b>remember locking</b> (ingat pernah mengunci).</li></ul><p class="tip">Salah: “I look forward to meet you.” Benar: “I look forward to <b>meeting</b> you.”</p>',
      pattern: ['enjoy/finish/avoid/suggest + V-ing', 'want/need/decide/plan + to V', 'preposisi + V-ing'],
      examples: ['I enjoy learning new words.|Saya senang mempelajari kata-kata baru.', 'She finished writing the report.|Dia selesai menulis laporan.', 'We decided to move to Bali.|Kami memutuskan pindah ke Bali.', 'He wants to improve his English.|Dia ingin meningkatkan bahasa Inggrisnya.', 'I\'m interested in joining your team.|Saya tertarik bergabung dengan tim Anda.', 'Would you mind opening the window?|Keberatan membuka jendelanya?', 'Don\'t forget to call your mother.|Jangan lupa menelepon ibumu.'],
      quiz: ['I enjoy ___ to music.|listening|to listen|listen|Saya senang mendengarkan musik.', 'She decided ___ a new car.|to buy|buying|buy|Dia memutuskan membeli mobil baru.', 'I\'m interested in ___ abroad.|studying|to study|study|Saya tertarik kuliah di luar negeri.', 'Would you mind ___ the door?|closing|to close|close|Keberatan menutup pintunya?', 'We need ___ more staff.|to hire|hiring|hire|Kita perlu merekrut lebih banyak staf.', 'I look forward to ___ from you.|hearing|hear|heard|Saya menantikan kabar dari Anda.', 'He stopped ___ two years ago. (berhenti merokok)|smoking|to smoke|smoke|Dia berhenti merokok dua tahun lalu.', 'Please remember ___ the lights.|to turn off|turning off|turn off|Ingat matikan lampunya.']

    { id: 'f-g6', type: 'grammar', title: 'Tenses Lanjut & Berbicara Alami', en: 'Advanced Tenses & Natural Speech',
      explain: '<p><b>Past perfect</b> (had + V3): kejadian yang terjadi <b>lebih dulu</b> sebelum kejadian lampau lain. <i>When I arrived, the train <b>had</b> already <b>left</b>.</i></p><p><b>Present perfect continuous</b> (have/has been + V-ing): sudah berlangsung sejak lama dan masih berlanjut. <i>I <b>have been learning</b> English for two years.</i></p><p><b>Used to</b> + V: kebiasaan lampau yang sudah tidak dilakukan. <i>I <b>used to</b> smoke.</i> &nbsp; <b>Be used to</b> + V-ing: terbiasa. <i>I\'m used to <b>waking up</b> early.</i></p><p><b>Bicara alami (connected speech):</b> penutur asli menyambung kata — <i>going to → gonna, want to → wanna, have to → hafta, did you → didja, let me → lemme</i>. Pahami saat mendengar; untuk tulisan formal tetap pakai bentuk lengkap.</p><p><b>Question tags</b> untuk konfirmasi: <i>It\'s hot, <b>isn\'t it</b>? You\'re coming, <b>aren\'t you</b>? He didn\'t call, <b>did he</b>?</i></p>',
      pattern: ['had + V3 (lebih dulu di masa lalu)', 'have/has been + V-ing (+ for/since)', 'used to + V / be used to + V-ing', 'kalimat positif + tag negatif?'],
      examples: ['By the time we got there, the movie had started.|Saat kami tiba, filmnya sudah mulai.', 'She had never flown before that trip.|Dia belum pernah naik pesawat sebelum perjalanan itu.', 'I\'ve been waiting for you for an hour!|Saya sudah menunggumu satu jam!', 'They have been working on this since March.|Mereka mengerjakan ini sejak Maret.', 'I used to live in Medan.|Dulu saya tinggal di Medan.', 'I\'m used to working under pressure.|Saya terbiasa bekerja di bawah tekanan.', 'You\'re from Jakarta, aren\'t you?|Kamu dari Jakarta, kan?', 'I\'m gonna grab some lunch. Wanna come?|Saya mau beli makan siang. Mau ikut?'],
      quiz: ['When I arrived, the bus ___ already left.|had|has|was|Ketika saya tiba, busnya sudah berangkat.', 'I have been ___ English for two years.|learning|learned|learn|Saya sudah belajar bahasa Inggris dua tahun.', 'I ___ to play football every weekend, but now I don\'t.|used|use|am used|Dulu saya main bola tiap akhir pekan, sekarang tidak.', 'She is used to ___ early.|waking up|wake up|woke up|Dia terbiasa bangun pagi.', 'It\'s a nice day, ___ it?|isn\'t|is|doesn\'t|Hari yang cerah, ya kan?', 'You didn\'t lock the door, ___ you?|did|didn\'t|do|Kamu tidak mengunci pintu, kan?', 'They ___ been waiting since 8 a.m.|have|has|had been|Mereka sudah menunggu sejak jam 8 pagi.', '"I\'m gonna call him" means "I\'m ___ call him".|going to|want to|got to|"I\'m gonna call him" artinya "Saya akan meneleponnya".']
    }
  ]

  { id: 'd-g7', type: 'grammar', title: 'Can dan Can\'t', en: 'Ability & Permission: can',
    explain: `<p><b>Can</b> berarti “bisa” atau “boleh”. Kata ini dipakai untuk menyatakan <b>kemampuan</b>, <b>izin</b>, dan <b>permintaan</b>. Setelah <b>can</b> selalu gunakan kata kerja bentuk dasar, tanpa <i>to</i> dan tanpa akhiran <i>-s</i>.</p><ul><li>Positif: I can swim. She can drive.</li><li>Negatif: <b>cannot / can't</b>. He can't speak Japanese.</li><li>Pertanyaan: <b>Can</b> + subjek + kata kerja dasar? Can you help me?</li></ul><p>Bentuk <b>can</b> sama untuk semua subjek: I can, he can, they can.</p><p class="tip">Salah: She cans cook. Benar: She can cook. Salah: I can to swim. Benar: I can swim.</p>`,
    pattern: ["Subjek + can + kata kerja dasar", "Subjek + can't + kata kerja dasar", "Can + subjek + kata kerja dasar?"],
    examples: ["I can speak a little English.|Saya bisa berbicara sedikit bahasa Inggris.", "She can't come today.|Dia tidak bisa datang hari ini.", "Can you open the window?|Bisa tolong buka jendelanya?", "Can I sit here?|Boleh saya duduk di sini?", "My father can fix the car.|Ayah saya bisa memperbaiki mobil itu.", "We can meet at five.|Kita bisa bertemu jam lima.", "They can't find the key.|Mereka tidak bisa menemukan kuncinya."],
    quiz: ["She ___ play the piano.|can|cans|can to|Dia bisa bermain piano.", "I ___ hear you. Please speak louder.|can't|can|am not|Saya tidak bisa mendengarmu. Tolong bicara lebih keras.", "___ I use your phone?|Can|Do|Am|Boleh saya pakai teleponmu?", "He can ___ very fast.|run|runs|running|Dia bisa berlari sangat cepat.", "Can you ___ me?|help|helps|to help|Bisakah kamu membantuku?", "My son ___ read yet. He is only three.|can't|can|doesn't can|Anak saya belum bisa membaca. Dia baru tiga tahun.", "Can they ___ English?|speak|speaks|speaking|Apakah mereka bisa berbahasa Inggris?", "You ___ park here. It's not allowed.|can't|can|are|Kamu tidak boleh parkir di sini. Itu dilarang."]
  },
  { id: 'd-t6', type: 'topic', cat: 'daily', title: 'Di Restoran: Memesan Makanan', en: 'Ordering Food',
    phrases: ["A table for two, please.|Meja untuk dua orang.", "Can I see the menu, please?|Boleh saya lihat menunya?", "What do you recommend?|Apa yang Anda rekomendasikan?", "I'd like the fried rice, please.|Saya pesan nasi gorengnya.", "Not too spicy, please.|Jangan terlalu pedas.", "Can I have some water?|Boleh minta air putih?", "Is it vegetarian?|Apakah ini vegetarian?", "How long will it take?|Berapa lama (menunggunya)?", "This is delicious.|Ini enak sekali.", "Could we have the bill, please?|Boleh minta tagihannya?", "Can I pay by card?|Bisa bayar dengan kartu?", "Keep the change.|Kembaliannya untuk Anda."],
    dialog: ["A|Good evening. A table for two?|Selamat malam. Meja untuk dua orang?", "B|Yes, please. Can we sit near the window?|Ya. Bisa kami duduk dekat jendela?", "A|Of course. Here is the menu.|Tentu. Ini menunya.", "B|What do you recommend?|Apa yang Anda rekomendasikan?", "A|The grilled fish is very popular.|Ikan bakarnya sangat populer.", "B|I'd like the grilled fish and an iced tea, please.|Saya pesan ikan bakar dan es teh.", "A|Anything else?|Ada lagi?", "B|No, thank you. Could we have the bill later?|Tidak, terima kasih. Nanti kami minta tagihannya, ya."],
    resp: ["Are you ready to order?|Yes, I'd like the chicken soup, please.|Yes, I'm ready to go home.|No, I'm a student.", "Would you like something to drink?|An iced tea, please.|I'm from Medan.|It's on the table.", "How is your meal?|It's delicious, thank you.|It's seven o'clock.|Two people, please.", "Cash or card?|Card, please.|Yes, it's spicy.|The menu, please."] },
  { id: 'd-g8', type: 'grammar', title: 'Kalimat Perintah & Permintaan Sopan', en: 'Imperatives & Polite Requests',
    explain: `<p>Kalimat perintah (<b>imperative</b>) diawali kata kerja bentuk dasar tanpa subjek: <i>Open the door. Sit down.</i> Untuk larangan gunakan <b>Don't</b> + kata kerja dasar: <i>Don't touch it.</i></p><p>Dalam situasi kerja dan dengan orang yang belum dikenal, perintah langsung bisa terdengar kasar. Gunakan bentuk yang lebih sopan:</p><ul><li><b>Please</b> + kata kerja: Please sign here.</li><li><b>Could you</b> + kata kerja dasar? Could you send me the file?</li><li><b>Would you mind</b> + kata kerja-ing? Would you mind waiting a moment?</li><li><b>Let's</b> + kata kerja dasar untuk ajakan: Let's start.</li></ul><p class="tip">Urutan kesopanan: Send the file. → Please send the file. → Could you send the file? → Would you mind sending the file?</p>`,
    pattern: ["Kata kerja dasar + objek (perintah)", "Don't + kata kerja dasar (larangan)", "Could you + kata kerja dasar …? (sopan)", "Would you mind + kata kerja-ing …? (sangat sopan)"],
    examples: ["Close the door, please.|Tolong tutup pintunya.", "Don't park here.|Jangan parkir di sini.", "Could you call me back later?|Bisakah Anda menelepon saya kembali nanti?", "Would you mind opening the window?|Apakah Anda keberatan membuka jendela?", "Let's have a short break.|Mari kita istirahat sebentar.", "Please wear your helmet.|Harap kenakan helm Anda.", "Don't forget the meeting tomorrow.|Jangan lupa rapat besok."],
    quiz: ["___ the light, please.|Turn off|Turns off|Turning off|Tolong matikan lampunya.", "___ smoke in this room.|Don't|Not|Doesn't|Jangan merokok di ruangan ini.", "Could you ___ me the report?|send|sending|sends|Bisakah Anda mengirimkan laporannya kepada saya?", "Would you mind ___ a little?|waiting|wait|to wait|Apakah Anda keberatan menunggu sebentar?", "___ start the meeting now.|Let's|Let|Lets us|Mari kita mulai rapatnya sekarang.", "Please ___ your name here.|write|writes|writing|Silakan tulis nama Anda di sini.", "___ be late tomorrow.|Don't|Not|No|Jangan terlambat besok.", "Would you mind ___ the door?|closing|close|to close|Apakah Anda keberatan menutup pintu?"]
  },
  { id: 'd-t7', type: 'topic', cat: 'work', title: 'Telepon & Janji Temu', en: 'Phone Calls & Appointments',
    phrases: ["Hello, this is Budi speaking.|Halo, saya Budi.", "May I speak to Mr. Hendra?|Boleh saya bicara dengan Pak Hendra?", "Who's calling, please?|Dengan siapa saya berbicara?", "Hold on a moment, please.|Mohon tunggu sebentar.", "He's not in the office right now.|Beliau sedang tidak di kantor.", "Can I take a message?|Boleh saya catat pesannya?", "Could you ask him to call me back?|Bisa minta beliau menelepon saya kembali?", "I'd like to make an appointment.|Saya ingin membuat janji temu.", "Are you free on Thursday?|Apakah Anda ada waktu hari Kamis?", "How about ten o'clock?|Bagaimana kalau jam sepuluh?", "That works for me.|Waktu itu cocok untuk saya.", "Could you spell your name, please?|Bisa dieja nama Anda?"],
    dialog: ["A|Good morning, PT Maju Jaya. How can I help you?|Selamat pagi, PT Maju Jaya. Ada yang bisa dibantu?", "B|Hello, this is Rina from Bangun Karya. May I speak to Mr. Hendra?|Halo, saya Rina dari Bangun Karya. Boleh bicara dengan Pak Hendra?", "A|I'm sorry, he's in a meeting. Can I take a message?|Maaf, beliau sedang rapat. Boleh saya catat pesannya?", "B|Yes, I'd like to make an appointment with him next week.|Ya, saya ingin membuat janji dengan beliau minggu depan.", "A|Is Thursday at ten o'clock all right?|Apakah Kamis jam sepuluh bisa?", "B|That works for me. Thank you.|Waktu itu cocok untuk saya. Terima kasih.", "A|Could you spell your name, please?|Bisa dieja nama Anda?", "B|Sure. R-I-N-A.|Tentu. R-I-N-A."],
    resp: ["Who's calling, please?|This is Rina from Bangun Karya.|I'm calling now.|Yes, please call.", "He's not in right now. Can I take a message?|Yes, please ask him to call me back.|No, I'm not in.|Yes, I'm taking it.", "Are you free on Friday afternoon?|Yes, I'm free after two.|Yes, it's free of charge.|I'm Friday.", "Could you spell your name?|Sure. It's A-N-D-I.|My name is very long.|Yes, I can spell."] },
  { id: 'd-g9', type: 'grammar', title: 'Angka, Jam & Tanggal', en: 'Numbers, Time & Dates',
    explain: `<p>Angka besar dibaca per kelompok tiga digit: <i>1,250</i> = one thousand two hundred (and) fifty; <i>3,500,000</i> = three million five hundred thousand. Dalam bahasa Inggris, <b>koma</b> memisahkan ribuan dan <b>titik</b> dipakai untuk desimal: 2.5 = two point five.</p><p><b>Jam</b>: 7:00 = seven o'clock; 7:15 = a quarter past seven; 7:30 = half past seven; 7:45 = a quarter to eight. Cara modern juga lazim: seven fifteen, seven thirty.</p><p><b>Tanggal</b> memakai bilangan urutan (<i>ordinal</i>): 1st first, 2nd second, 3rd third, 4th fourth, 21st twenty-first. Contoh: <i>on the 5th of May</i> atau <i>on May 5th</i>.</p><ul><li><b>at</b> + jam: at 9 a.m.</li><li><b>on</b> + hari/tanggal: on Monday, on 17 August.</li><li><b>in</b> + bulan/tahun: in March, in 2026.</li></ul>`,
    pattern: ["at + jam (at seven o'clock)", "on + hari / tanggal (on Friday, on 3 June)", "in + bulan / tahun / bagian hari (in July, in the morning)"],
    examples: ["The meeting starts at half past nine.|Rapat dimulai pukul setengah sepuluh.", "My birthday is on the 12th of October.|Ulang tahun saya tanggal 12 Oktober.", "The project started in 2024.|Proyek dimulai pada tahun 2024.", "It costs two million five hundred thousand rupiah.|Harganya dua juta lima ratus ribu rupiah.", "The train leaves at a quarter to eight.|Kereta berangkat pukul delapan kurang seperempat.", "We have a holiday on Friday.|Kami libur hari Jumat.", "The office closes at five p.m.|Kantor tutup pukul lima sore."],
    quiz: ["The class starts ___ eight o'clock.|at|on|in|Kelas dimulai pukul delapan.", "I was born ___ 1995.|in|on|at|Saya lahir tahun 1995.", "We meet ___ Monday.|on|in|at|Kami bertemu hari Senin.", "7:30 is half ___ seven.|past|to|after|7.30 adalah setengah delapan.", "8:45 is a quarter ___ nine.|to|past|before|8.45 adalah sembilan kurang seperempat.", "Today is the ___ of June.|third|three|thirth|Hari ini tanggal tiga Juni.", "The shop is closed ___ the evening.|in|on|at|Tokonya tutup pada malam hari.", "Her birthday is ___ 21 April.|on|in|at|Ulang tahunnya tanggal 21 April."]
  },
  { id: 'd-t8', type: 'topic', cat: 'daily', title: 'Di Dokter & Apotek', en: 'At the Doctor & Pharmacy',
    phrases: ["I don't feel well.|Saya merasa tidak enak badan.", "I have a headache.|Saya sakit kepala.", "I have a fever.|Saya demam.", "My stomach hurts.|Perut saya sakit.", "How long have you had it?|Sudah berapa lama Anda mengalaminya?", "Since yesterday.|Sejak kemarin.", "Are you allergic to anything?|Apakah Anda alergi sesuatu?", "Take this medicine three times a day.|Minum obat ini tiga kali sehari.", "Take it after meals.|Diminum setelah makan.", "Do I need a prescription?|Apakah saya perlu resep?", "Get some rest.|Istirahatlah yang cukup.", "I hope you feel better soon.|Semoga lekas sembuh."],
    dialog: ["A|Good morning. What seems to be the problem?|Selamat pagi. Apa keluhannya?", "B|I have a fever and a sore throat.|Saya demam dan sakit tenggorokan.", "A|How long have you had it?|Sudah berapa lama?", "B|Since Monday.|Sejak hari Senin.", "A|Are you allergic to any medicine?|Apakah Anda alergi obat?", "B|No, I'm not.|Tidak.", "A|Take this medicine three times a day after meals, and get some rest.|Minum obat ini tiga kali sehari setelah makan, dan istirahat yang cukup.", "B|Thank you, doctor.|Terima kasih, Dok."],
